<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Helical Spring and Single Plate Clutch</text><text x="230" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Helical compression spring</text><path d="M170,130 q60,-18 120,0" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><path d="M170,158 q60,-18 120,0" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><path d="M170,186 q60,-18 120,0" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><path d="M170,214 q60,-18 120,0" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><path d="M170,242 q60,-18 120,0" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><path d="M170,270 q60,-18 120,0" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><path d="M170,298 q60,-18 120,0" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><line x1="230" y1="90" x2="230" y2="120" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><text x="246" y="108" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">W</text><line x1="150" y1="330" x2="310" y2="330" stroke="#1f2328" stroke-width="3"/><line x1="150" y1="330" x2="310" y2="330" stroke="#1f2328" stroke-width="2.5"/><line x1="150" y1="330" x2="143" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="159" y1="330" x2="152" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="168" y1="330" x2="161" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="177" y1="330" x2="170" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="186" y1="330" x2="179" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="195" y1="330" x2="188" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="204" y1="330" x2="197" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="213" y1="330" x2="206" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="222" y1="330" x2="215" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="231" y1="330" x2="224" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="240" y1="330" x2="233" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="249" y1="330" x2="242" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="258" y1="330" x2="251" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="267" y1="330" x2="260" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="276" y1="330" x2="269" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="285" y1="330" x2="278" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="294" y1="330" x2="287" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="303" y1="330" x2="296" y2="339" stroke="#1f2328" stroke-width="1"/><line x1="330" y1="130" x2="330" y2="326" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="292.725" y="221" width="74.55000000000001" height="16" fill="#ffffff" opacity="0.9"/><text x="330" y="232" font-size="11" fill="#1f2328" text-anchor="middle">free length</text><text x="230" y="375" font-size="12" fill="#1f2328" text-anchor="middle">Spring index C = D / d (6 to 12 typical)</text><text x="230" y="397" font-size="12" fill="#1f2328" text-anchor="middle">&#964; = K<tspan baseline-shift="sub" font-size="72%">w</tspan> 8 W D / (&#960; d<tspan baseline-shift="super" font-size="72%">3</tspan>) ,  K<tspan baseline-shift="sub" font-size="72%">w</tspan> = (4C-1)/(4C-4) + 0.615/C</text><text x="230" y="419" font-size="12" fill="#57606a" text-anchor="middle">Deflection &#948; = 8 W D<tspan baseline-shift="super" font-size="72%">3</tspan> n / (G d<tspan baseline-shift="super" font-size="72%">4</tspan>) ;  stiffness k = G d<tspan baseline-shift="super" font-size="72%">4</tspan> / (8 D<tspan baseline-shift="super" font-size="72%">3</tspan> n)</text><line x1="470" y1="60" x2="470" y2="450" stroke="#e5e7eb" stroke-width="1"/><text x="680" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Single plate clutch</text><rect x="560" y="120" width="24" height="150" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="600" y="135" width="14" height="120" fill="#fdecc8" stroke="#d98a1f" stroke-width="2"/><rect x="630" y="120" width="24" height="150" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><line x1="760" y1="195" x2="660" y2="195" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><text x="765" y="199" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">W</text><line x1="500" y1="195" x2="850" y2="195" stroke="#57606a" stroke-width="1" stroke-dasharray="8 4"/><text x="680" y="300" font-size="11" fill="#1f2328" text-anchor="middle">Uniform pressure:  T = (2/3) &#956; W (R<tspan baseline-shift="super" font-size="72%">3</tspan> - r<tspan baseline-shift="super" font-size="72%">3</tspan>) / (R<tspan baseline-shift="super" font-size="72%">2</tspan> - r<tspan baseline-shift="super" font-size="72%">2</tspan>) n</text><text x="680" y="322" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">Uniform wear:  T = &#956; W (R + r) n / 4</text><text x="680" y="344" font-size="12" fill="#57606a" text-anchor="middle">n = number of friction surfaces (2 for a single plate)</text><text x="680" y="380" font-size="12" fill="#1f2328" text-anchor="middle">Uniform wear is the realistic assumption</text><text x="680" y="402" font-size="12" fill="#1f2328" text-anchor="middle">for design; it gives the lower torque.</text></svg>