<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="460" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Open Belt Drive: Tight and Slack Sides</text><circle cx="200" cy="230" r="100" fill="#f7f8fa" stroke="#1f2328" stroke-width="2.5"/><circle cx="560" cy="230" r="60" fill="#f7f8fa" stroke="#1f2328" stroke-width="2.5"/><line x1="200" y1="130" x2="560" y2="170" stroke="#c0392b" stroke-width="3"/><line x1="200" y1="330" x2="560" y2="290" stroke="#3b82d4" stroke-width="3"/><circle cx="200" cy="230" r="4" fill="#1f2328"/><circle cx="560" cy="230" r="4" fill="#1f2328"/><text x="380" y="140" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">Tight side T<tspan baseline-shift="sub" font-size="72%">1</tspan> (driven upward)</text><text x="380" y="340" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Slack side T<tspan baseline-shift="sub" font-size="72%">2</tspan></text><path d="M234.64,250.00 A40,40 0 1 1 220.00,195.36" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)" stroke-linejoin="round"/><text x="200" y="308" font-size="12" fill="#1f2328" text-anchor="middle">Driver</text><text x="560" y="234" font-size="12" fill="#1f2328" text-anchor="middle">Driven</text><rect x="40" y="385" width="820" height="69.80000000000001" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="405" font-size="12" fill="#1f2328" text-anchor="start">Power P = (T<tspan baseline-shift="sub" font-size="72%">1</tspan> - T<tspan baseline-shift="sub" font-size="72%">2</tspan>) v ;  v = &#960; d N / 60 ;  T<tspan baseline-shift="sub" font-size="72%">1</tspan>/T<tspan baseline-shift="sub" font-size="72%">2</tspan> = e<tspan baseline-shift="super" font-size="72%">&#956;&#952;</tspan> (flat belt),  e<tspan baseline-shift="super" font-size="72%">&#956;&#952;/\sin&#946;</tspan> (V-belt)</text><text x="52" y="423.6" font-size="12" fill="#1f2328" text-anchor="start">Centrifugal tension T<tspan baseline-shift="sub" font-size="72%">c</tspan> = m v<tspan baseline-shift="super" font-size="72%">2</tspan>; maximum power transmitted when T<tspan baseline-shift="sub" font-size="72%">1</tspan> = 3 T<tspan baseline-shift="sub" font-size="72%">c</tspan> (v = sqrt(T/3m))</text><text x="52" y="442.2" font-size="12" fill="#1f2328" text-anchor="start">Length of open belt  L = &#960; (r<tspan baseline-shift="sub" font-size="72%">1</tspan> + r<tspan baseline-shift="sub" font-size="72%">2</tspan>) + 2 C + (r<tspan baseline-shift="sub" font-size="72%">1</tspan> - r<tspan baseline-shift="sub" font-size="72%">2</tspan>)<tspan baseline-shift="super" font-size="72%">2</tspan> / C</text></svg>