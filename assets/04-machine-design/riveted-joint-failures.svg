<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="520" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Riveted Lap Joint and Modes of Failure</text><text x="230" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Single-riveted lap joint</text><rect x="60" y="120" width="250" height="36" fill="#dbeafe" stroke="#3b82d4" stroke-width="2"/><rect x="150" y="156" width="250" height="36" fill="#fdecc8" stroke="#d98a1f" stroke-width="2"/><rect x="215" y="110" width="20" height="94" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="205" y="104" width="40" height="10" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><line x1="20" y1="138" x2="60" y2="138" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><line x1="440" y1="174" x2="400" y2="174" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><text x="8" y="130" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">P</text><text x="445" y="170" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">P</text><line x1="225" y1="230" x2="145" y2="230" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><text x="185" y="250" font-size="12" fill="#57606a" text-anchor="middle">margin m = 1.5 d</text><text x="230" y="290" font-size="12" fill="#1f2328" text-anchor="middle">Pitch p : distance between rivet centres</text><text x="230" y="312" font-size="12" fill="#1f2328" text-anchor="middle">Rivet diameter d from Unwin: d = 6 &#8730; t</text><line x1="470" y1="60" x2="470" y2="450" stroke="#e5e7eb" stroke-width="1"/><text x="670" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Failure modes and strengths</text><text x="500" y="120" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">1. Tearing of plate</text><text x="500" y="142" font-size="12" fill="#1f2328" text-anchor="start">P<tspan baseline-shift="sub" font-size="72%">t</tspan> = (p - d) t &#963;<tspan baseline-shift="sub" font-size="72%">t</tspan></text><text x="500" y="182" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">2. Shearing of rivet</text><text x="500" y="204" font-size="12" fill="#1f2328" text-anchor="start">P<tspan baseline-shift="sub" font-size="72%">s</tspan> = n (&#960; d<tspan baseline-shift="super" font-size="72%">2</tspan>/4) &#964;   (double shear: 2x)</text><text x="500" y="244" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">3. Crushing of rivet</text><text x="500" y="266" font-size="12" fill="#1f2328" text-anchor="start">P<tspan baseline-shift="sub" font-size="72%">c</tspan> = n d t &#963;<tspan baseline-shift="sub" font-size="72%">c</tspan></text><text x="500" y="306" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">4. Tearing at edge</text><text x="500" y="328" font-size="12" fill="#1f2328" text-anchor="start">prevented by margin m = 1.5 d</text><text x="500" y="380" font-size="12" fill="#3b82d4" text-anchor="start" font-weight="bold">Efficiency &#951; = least of P<tspan baseline-shift="sub" font-size="72%">t</tspan>, P<tspan baseline-shift="sub" font-size="72%">s</tspan>, P<tspan baseline-shift="sub" font-size="72%">c</tspan> / (p t &#963;<tspan baseline-shift="sub" font-size="72%">t</tspan>)</text><text x="500" y="402" font-size="12" fill="#57606a" text-anchor="start">Lap: single shear. Butt with cover plates: double shear</text></svg>