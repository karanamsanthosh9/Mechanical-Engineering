<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="460" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Rolling Contact Bearings: Types and Life</text><text x="130" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Ball bearing</text><circle cx="130" cy="170" r="60" fill="#f7f8fa" stroke="#1f2328" stroke-width="2.5"/><circle cx="130" cy="170" r="30" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><circle cx="175" cy="170" r="8" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="161.81980515339464" cy="138.18019484660536" r="8" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="130" cy="125" r="8" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="98.18019484660536" cy="138.18019484660536" r="8" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="85" cy="170" r="8" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="98.18019484660536" cy="201.81980515339464" r="8" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="130" cy="215" r="8" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="161.81980515339464" cy="201.81980515339464" r="8" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="130" y="260" font-size="12" fill="#1f2328" text-anchor="middle">Radial + moderate thrust</text><text x="330" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Roller bearing</text><circle cx="330" cy="170" r="60" fill="#f7f8fa" stroke="#1f2328" stroke-width="2.5"/><circle cx="330" cy="170" r="30" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><rect x="369" y="161" width="12" height="18" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><rect x="355.81980515339467" y="129.18019484660536" width="12" height="18" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><rect x="324" y="116" width="12" height="18" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><rect x="292.1801948466054" y="129.18019484660536" width="12" height="18" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><rect x="279" y="161" width="12" height="18" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><rect x="292.18019484660533" y="192.81980515339464" width="12" height="18" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><rect x="324" y="206" width="12" height="18" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><rect x="355.8198051533946" y="192.81980515339464" width="12" height="18" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><text x="330" y="260" font-size="12" fill="#1f2328" text-anchor="middle">Heavy radial loads</text><text x="530" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Tapered roller</text><polygon points="470,120 590,140 590,200 470,220" fill="#f7f8fa" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><polygon points="490,150 570,160 570,180 490,190" fill="#fdecc8" stroke="#d98a1f" stroke-width="2" stroke-linejoin="round"/><text x="530" y="260" font-size="12" fill="#1f2328" text-anchor="middle">Combined radial + axial</text><rect x="40" y="300" width="820" height="69.80000000000001" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="320" font-size="12" fill="#1f2328" text-anchor="start">Basic life L<tspan baseline-shift="sub" font-size="72%">10</tspan> = (C / P)<tspan baseline-shift="super" font-size="72%">k</tspan> million revolutions  (k = 3 balls, 10/3 rollers)</text><text x="52" y="338.6" font-size="12" fill="#1f2328" text-anchor="start">C = dynamic load capacity (1 million rev with 90 percent reliability); P = equivalent dynamic load = X V F<tspan baseline-shift="sub" font-size="72%">r</tspan> + Y F<tspan baseline-shift="sub" font-size="72%">a</tspan></text><text x="52" y="357.2" font-size="12" fill="#1f2328" text-anchor="start">Life in hours: L<tspan baseline-shift="sub" font-size="72%">h</tspan> = 10<tspan baseline-shift="super" font-size="72%">6</tspan> L<tspan baseline-shift="sub" font-size="72%">10</tspan> / (60 N) ;  doubling the load cuts the life to one eighth for ball bearings</text><text x="40" y="400" font-size="12" fill="#57606a" text-anchor="start">Static capacity C<tspan baseline-shift="sub" font-size="72%">0</tspan>: load for permanent deformation 0.0001 of the rolling element diameter</text></svg>