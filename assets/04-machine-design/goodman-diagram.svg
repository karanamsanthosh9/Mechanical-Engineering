<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="500" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Goodman and Soderberg Diagram</text><line x1="120" y1="380" x2="694" y2="380" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="120" y1="380" x2="120" y2="86" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="692" y="404" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">Mean stress &#963;<tspan baseline-shift="sub" font-size="72%">m</tspan></text><text x="110" y="78" font-size="14" fill="#1f2328" text-anchor="start" font-style="italic">Stress amplitude &#963;<tspan baseline-shift="sub" font-size="72%">a</tspan></text><polyline points="120,246.67 586.67,380" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><polyline points="120,246.67 470,380" fill="none" stroke="#2e8b57" stroke-width="2.5" stroke-linejoin="round"/><polyline points="120,180 470,380" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/><polygon points="120,380 120,246.67 470,380 120,380" fill="#dcf3e4" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><polyline points="120,246.67 586.67,380" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><text x="112" y="250.66666666666669" font-size="14" fill="#3b82d4" text-anchor="end" font-weight="bold">&#963;<tspan baseline-shift="sub" font-size="72%">e</tspan></text><text x="590.6666666666667" y="372" font-size="14" fill="#3b82d4" text-anchor="start" font-weight="bold">&#963;<tspan baseline-shift="sub" font-size="72%">u</tspan></text><text x="470" y="372" font-size="14" fill="#2e8b57" text-anchor="middle" font-weight="bold">&#963;<tspan baseline-shift="sub" font-size="72%">y</tspan></text><text x="540" y="326.6666666666667" font-size="12" fill="#3b82d4" text-anchor="start" font-weight="bold">Goodman line</text><text x="386" y="334.6666666666667" font-size="12" fill="#2e8b57" text-anchor="start" font-weight="bold">Soderberg</text><circle cx="260" cy="326.6666666666667" r="4.5" fill="#d98a1f"/><text x="268" y="320.6666666666667" font-size="12" fill="#d98a1f" text-anchor="start">safe point</text><text x="185.33333333333334" y="332" font-size="12" fill="#2e8b57" text-anchor="start" font-weight="bold">Safe region</text><rect x="120" y="425" width="700" height="69.80000000000001" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="132" y="445" font-size="12" fill="#1f2328" text-anchor="start">Goodman: &#963;<tspan baseline-shift="sub" font-size="72%">a</tspan>/&#963;<tspan baseline-shift="sub" font-size="72%">e</tspan> + &#963;<tspan baseline-shift="sub" font-size="72%">m</tspan>/&#963;<tspan baseline-shift="sub" font-size="72%">u</tspan> = 1/FS   (preferred for brittle materials and general use)</text><text x="132" y="463.6" font-size="12" fill="#1f2328" text-anchor="start">Soderberg: &#963;<tspan baseline-shift="sub" font-size="72%">a</tspan>/&#963;<tspan baseline-shift="sub" font-size="72%">e</tspan> + &#963;<tspan baseline-shift="sub" font-size="72%">m</tspan>/&#963;<tspan baseline-shift="sub" font-size="72%">y</tspan> = 1/FS   (most conservative)</text><text x="132" y="482.2" font-size="12" fill="#1f2328" text-anchor="start">Gerber parabola: &#963;<tspan baseline-shift="sub" font-size="72%">a</tspan>/&#963;<tspan baseline-shift="sub" font-size="72%">e</tspan> + (&#963;<tspan baseline-shift="sub" font-size="72%">m</tspan>/&#963;<tspan baseline-shift="sub" font-size="72%">u</tspan>)<tspan baseline-shift="super" font-size="72%">2</tspan> = 1   (fits ductile test data best)</text></svg>