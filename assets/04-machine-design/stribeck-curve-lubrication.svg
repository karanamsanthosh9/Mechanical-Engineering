t><rect x="100" y="380" width="700" height="51.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="112" y="400" font-size="12" fill="#1f2328" text-anchor="start">Operate to the right of the minimum (stable film); left of it friction rises and the film collapses</text><text x="112" y="418.6" font-size="12" fill="#1f2328" text-anchor="start">Sommerfeld number S = (Z N / p)(r / c)<tspan baseline-shift="super" font-size="72%">2</tspan> ;  ZN/p less than K gives unstable lubrication</text></svg>