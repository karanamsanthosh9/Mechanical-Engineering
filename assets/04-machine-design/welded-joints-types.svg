<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="460" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Welded Joints: Butt and Fillet Weld</text><text x="230" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Butt weld (V-groove)</text><polygon points="60,150 215,150 230,170 245,150 400,150 400,190 245,190 230,190 215,190 60,190" fill="#dbeafe" stroke="#3b82d4" stroke-width="2" stroke-linejoin="round"/><line x1="20" y1="170" x2="58" y2="170" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><line x1="440" y1="170" x2="402" y2="170" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><line x1="420" y1="150" x2="420" y2="190" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="412.425" y="161" width="15.15" height="18" fill="#ffffff" opacity="0.9"/><text x="420" y="174" font-size="13" fill="#1f2328" text-anchor="middle">t</text><text x="230" y="245" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">&#963; = P / (l t)</text><text x="230" y="268" font-size="12" fill="#57606a" text-anchor="middle">Throat = plate thickness t</text><line x1="450" y1="60" x2="450" y2="440" stroke="#e5e7eb" stroke-width="1"/><text x="670" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Fillet weld</text><rect x="520" y="130" width="260" height="24" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="600" y="154" width="24" height="110" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><polygon points="600,154 600,184 570,154" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5" stroke-linejoin="round"/><polygon points="624,154 624,184 654,154" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5" stroke-linejoin="round"/><text x="550" y="190" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">s</text><text x="643" y="190" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">s</text><text x="670" y="300" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">Throat t = s cos 45&#176; = 0.707 s</text><text x="670" y="324" font-size="12" fill="#1f2328" text-anchor="middle">Shear: &#964; = P / (0.707 s l)  per weld</text><rect x="470" y="360" width="410" height="51.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="482" y="380" font-size="12" fill="#1f2328" text-anchor="start">Transverse fillet: P = 0.707 s l &#963;<tspan baseline-shift="sub" font-size="72%">t</tspan> ;  parallel: P = 0.707 s l &#964;</text><text x="482" y="398.6" font-size="12" fill="#1f2328" text-anchor="start">Combined (transverse + parallel): P = 0.707 s l (&#963;<tspan baseline-shift="sub" font-size="72%">t</tspan> + &#964;) approx.</text></svg>