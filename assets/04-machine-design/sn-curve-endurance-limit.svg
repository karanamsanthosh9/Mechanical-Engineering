<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">S-N Curve and Endurance Limit</text><line x1="100" y1="340" x2="754" y2="340" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="100" y1="340" x2="100" y2="86" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="752" y="364" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">log N (cycles)</text><text x="90" y="78" font-size="14" fill="#1f2328" text-anchor="start" font-style="italic">Stress amplitude</text><polyline points="100,160 228,184 356,216 484,240 612,240 740,240" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><polyline points="100,160 228,188 356,224 484,256 612,274 740,286" fill="none" stroke="#2e8b57" stroke-width="2.5" stroke-dasharray="7 4" stroke-linejoin="round"/><line x1="100" y1="240" x2="740" y2="240" stroke="#c0392b" stroke-width="1" stroke-dasharray="6 4"/><text x="748" y="244" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">&#963;<tspan baseline-shift="sub" font-size="72%">e</tspan></text><line x1="484" y1="340" x2="484" y2="240" stroke="#57606a" stroke-width="1" stroke-dasharray="4 3"/><text x="484" y="360" font-size="12" fill="#57606a" text-anchor="middle">10<tspan baseline-shift="super" font-size="72%">6</tspan></text><text x="637.6" y="228" font-size="12" fill="#3b82d4" text-anchor="middle" font-weight="bold">Steel: endurance limit</text><text x="612" y="296" font-size="12" fill="#2e8b57" text-anchor="middle" font-weight="bold">Non-ferrous: no endurance limit</text><text x="125.60000000000002" y="135.99999999999997" font-size="12" fill="#57606a" text-anchor="start">Low-cycle</text><text x="304.79999999999995" y="264" font-size="12" fill="#57606a" text-anchor="start">High-cycle (finite life)</text><text x="560.8" y="320" font-size="12" fill="#57606a" text-anchor="start">Infinite life</text><rect x="100" y="395" width="700" height="51.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="112" y="415" font-size="12" fill="#1f2328" text-anchor="start">Endurance limit of steel: &#963;<tspan baseline-shift="sub" font-size="72%">e</tspan>' about 0.5 &#963;<tspan baseline-shift="sub" font-size="72%">u</tspan>, then corrected: &#963;<tspan baseline-shift="sub" font-size="72%">e</tspan> = k<tspan baseline-shift="sub" font-size="72%">a</tspan> k<tspan baseline-shift="sub" font-size="72%">b</tspan> k<tspan baseline-shift="sub" font-size="72%">c</tspan> k<tspan baseline-shift="sub" font-size="72%">d</tspan> k<tspan baseline-shift="sub" font-size="72%">e</tspan> &#963;<tspan baseline-shift="sub" font-size="72%">e</tspan>'</text><text x="112" y="433.6" font-size="12" fill="#1f2328" text-anchor="start">k<tspan baseline-shift="sub" font-size="72%">a</tspan> surface, k<tspan baseline-shift="sub" font-size="72%">b</tspan> size, k<tspan baseline-shift="sub" font-size="72%">c</tspan> reliability, k<tspan baseline-shift="sub" font-size="72%">d</tspan> temperature, k<tspan baseline-shift="sub" font-size="72%">e</tspan> stress concentration (1/K<tspan baseline-shift="sub" font-size="72%">f</tspan>)</text></svg>