<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="520" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Spur Gear Terminology</text><circle cx="300" cy="290" r="200" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="300" cy="290" r="170" fill="none" stroke="#3b82d4" stroke-width="2.5"/><circle cx="300" cy="290" r="140" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="300" cy="290" r="160" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="8 3"/><circle cx="300" cy="290" r="4" fill="#1f2328"/><text x="450" y="115" font-size="12" fill="#57606a" text-anchor="start">Addendum circle</text><text x="475" y="298" font-size="12" fill="#3b82d4" text-anchor="end" font-weight="bold">Pitch</text><text x="420" y="318" font-size="12" fill="#c0392b" text-anchor="end">Base circle</text><text x="446" y="338" font-size="12" fill="#57606a" text-anchor="end">Root circle</text><line x1="300" y1="290" x2="500" y2="290" stroke="#57606a" stroke-width="1"/><text x="560" y="100" font-size="13" fill="#1f2328" text-anchor="start">Addendum a = 1 m</text><text x="560" y="122" font-size="13" fill="#1f2328" text-anchor="start">Dedendum = 1.25 m</text><text x="560" y="144" font-size="13" fill="#1f2328" text-anchor="start">Circular pitch p<tspan baseline-shift="sub" font-size="72%">c</tspan> = &#960; m</text><text x="560" y="166" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">Module m = d / T</text><text x="560" y="188" font-size="13" fill="#1f2328" text-anchor="start">Pressure angle &#966; = 20&#176;</text><rect x="540" y="262" width="340" height="107" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="552" y="282" font-size="12" fill="#1f2328" text-anchor="start">Velocity ratio = N<tspan baseline-shift="sub" font-size="72%">1</tspan>/N<tspan baseline-shift="sub" font-size="72%">2</tspan> = T<tspan baseline-shift="sub" font-size="72%">2</tspan>/T<tspan baseline-shift="sub" font-size="72%">1</tspan> = d<tspan baseline-shift="sub" font-size="72%">2</tspan>/d<tspan baseline-shift="sub" font-size="72%">1</tspan></text><text x="552" y="300.6" font-size="12" fill="#1f2328" text-anchor="start">Centre distance = m (T<tspan baseline-shift="sub" font-size="72%">1</tspan> + T<tspan baseline-shift="sub" font-size="72%">2</tspan>) / 2</text><text x="552" y="319.2" font-size="12" fill="#1f2328" text-anchor="start">Base circle radius = R cos &#966;</text><text x="552" y="337.8" font-size="12" fill="#1f2328" text-anchor="start">Law of gearing: common normal must pass through the</text><text x="552" y="356.4" font-size="12" fill="#1f2328" text-anchor="start">pitch point, giving constant velocity ratio (involute)</text><text x="560" y="400" font-size="13" fill="#3b82d4" text-anchor="start" font-weight="bold">Minimum teeth to avoid interference</text><text x="560" y="422" font-size="12" fill="#1f2328" text-anchor="start">T<tspan baseline-shift="sub" font-size="72%">min</tspan> = 2 / sin<tspan baseline-shift="super" font-size="72%">2</tspan>&#966; = 18 for 20&#176; full depth</text></svg>