<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="520" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Centrifugal Governors: Porter and Hartnell</text><text x="230" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Porter governor</text><line x1="230" y1="90" x2="230" y2="400" stroke="#57606a" stroke-width="1.5" stroke-dasharray="8 4"/><line x1="230" y1="110" x2="140" y2="220" stroke="#1f2328" stroke-width="3"/><line x1="230" y1="110" x2="320" y2="220" stroke="#1f2328" stroke-width="3"/><line x1="140" y1="220" x2="230" y2="290" stroke="#1f2328" stroke-width="2.5"/><line x1="320" y1="220" x2="230" y2="290" stroke="#1f2328" stroke-width="2.5"/><circle cx="140" cy="220" r="14" fill="#fde2e0" stroke="#c0392b" stroke-width="2.5"/><circle cx="320" cy="220" r="14" fill="#fde2e0" stroke="#c0392b" stroke-width="2.5"/><rect x="210" y="280" width="40" height="40" fill="#dcf3e4" stroke="#2e8b57" stroke-width="2.5"/><text x="230" y="304" font-size="13" fill="#2e8b57" text-anchor="middle" font-weight="bold">M</text><text x="122" y="224" font-size="13" fill="#c0392b" text-anchor="end" font-weight="bold">m</text><circle cx="230" cy="110" r="5" fill="#1f2328"/><line x1="320" y1="220" x2="390" y2="220" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#ae-blue)"/><text x="392" y="224" font-size="13" fill="#3b82d4" text-anchor="start" font-weight="bold">F<tspan baseline-shift="sub" font-size="72%">c</tspan></text><line x1="230" y1="380" x2="320" y2="380" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="267.425" y="371" width="15.15" height="18" fill="#ffffff" opacity="0.9"/><text x="275" y="384" font-size="13" fill="#1f2328" text-anchor="middle">r</text><text x="230" y="430" font-size="12" fill="#1f2328" text-anchor="middle">Equal arms and links: N<tspan baseline-shift="super" font-size="72%">2</tspan> = (m + M)/m x 895 / h</text><text x="230" y="452" font-size="12" fill="#57606a" text-anchor="middle">h = height of governor in metres, N in rpm</text><line x1="450" y1="60" x2="450" y2="480" stroke="#e5e7eb" stroke-width="1"/><text x="670" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Hartnell governor</text><line x1="600" y1="100" x2="600" y2="400" stroke="#57606a" stroke-width="1.5" stroke-dasharray="8 4"/><line x1="530" y1="150" x2="530" y2="250" stroke="#1f2328" stroke-width="3"/><line x1="530" y1="250" x2="580" y2="250" stroke="#1f2328" stroke-width="3"/><circle cx="530" cy="150" r="16" fill="#fde2e0" stroke="#c0392b" stroke-width="2.5"/><text x="508" y="154" font-size="13" fill="#c0392b" text-anchor="end" font-weight="bold">m</text><line x1="670" y1="150" x2="670" y2="250" stroke="#1f2328" stroke-width="3"/><line x1="670" y1="250" x2="620" y2="250" stroke="#1f2328" stroke-width="3"/><circle cx="670" cy="150" r="16" fill="#fde2e0" stroke="#c0392b" stroke-width="2.5"/><rect x="580" y="300" width="40" height="34" fill="#dcf3e4" stroke="#2e8b57" stroke-width="2.5"/><text x="600" y="322" font-size="11" fill="#2e8b57" text-anchor="middle" font-weight="bold">Sleeve</text><path d="M600,300 q15,-8 0,-16 q-15,-8 0,-16 q15,-8 0,-16 q-15,-8 0,-16" fill="none" stroke="#d98a1f" stroke-width="2.5" stroke-linejoin="round"/><text x="624" y="270" font-size="12" fill="#d98a1f" text-anchor="start">Spring</text><text x="530" y="290" font-size="11" fill="#57606a" text-anchor="middle">Bell crank lever</text><rect x="470" y="380" width="400" height="88.4" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="482" y="400" font-size="12" fill="#1f2328" text-anchor="start">Spring force controls the sleeve, so it can govern</text><text x="482" y="418.6" font-size="12" fill="#1f2328" text-anchor="start">a wide speed range and works at higher speeds</text><text x="482" y="437.2" font-size="12" fill="#1f2328" text-anchor="start">Sensitiveness = (N<tspan baseline-shift="sub" font-size="72%">2</tspan> - N<tspan baseline-shift="sub" font-size="72%">1</tspan>) / N<tspan baseline-shift="sub" font-size="72%">mean</tspan></text><text x="482" y="455.8" font-size="12" fill="#1f2328" text-anchor="start">Isochronous governor: range of speed = 0</text></svg>