<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="460" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Simple Epicyclic (Planetary) Gear Train</text><circle cx="260" cy="250" r="160" fill="#f7f8fa" stroke="#1f2328" stroke-width="3"/><text x="260" y="78" font-size="12" fill="#1f2328" text-anchor="middle">Annulus (internal gear)</text><circle cx="260" cy="250" r="55" fill="#dbeafe" stroke="#3b82d4" stroke-width="2.5"/><text x="260" y="254" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Sun</text><circle cx="365" cy="250" r="50" fill="#fdecc8" stroke="#d98a1f" stroke-width="2.5"/><text x="365" y="254" font-size="12" fill="#d98a1f" text-anchor="middle" font-weight="bold">Planet</text><line x1="260" y1="250" x2="365" y2="250" stroke="#c0392b" stroke-width="4"/><circle cx="260" cy="250" r="6" fill="#c0392b"/><circle cx="365" cy="250" r="5" fill="#c0392b"/><text x="312" y="238" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">Arm</text><text x="540" y="90" font-size="14" fill="#3b82d4" text-anchor="start" font-weight="bold">Tabular method (arm fixed, then arm rotates)</text><text x="540" y="125" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Step</text><text x="690" y="125" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Arm</text><text x="745" y="125" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Sun</text><text x="805" y="125" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Planet</text><text x="540" y="153" font-size="12" fill="#1f2328" text-anchor="start">1. Arm fixed, sun +1</text><text x="690" y="153" font-size="12" fill="#1f2328" text-anchor="start">0</text><text x="745" y="153" font-size="12" fill="#1f2328" text-anchor="start">+1</text><text x="805" y="153" font-size="12" fill="#1f2328" text-anchor="start">- T<tspan baseline-shift="sub" font-size="72%">S</tspan>/T<tspan baseline-shift="sub" font-size="72%">P</tspan></text><text x="540" y="181" font-size="12" fill="#1f2328" text-anchor="start">2. Multiply by x</text><text x="690" y="181" font-size="12" fill="#1f2328" text-anchor="start">0</text><text x="745" y="181" font-size="12" fill="#1f2328" text-anchor="start">+x</text><text x="805" y="181" font-size="12" fill="#1f2328" text-anchor="start">- x T<tspan baseline-shift="sub" font-size="72%">S</tspan>/T<tspan baseline-shift="sub" font-size="72%">P</tspan></text><text x="540" y="209" font-size="12" fill="#1f2328" text-anchor="start">3. Add y to all</text><text x="690" y="209" font-size="12" fill="#1f2328" text-anchor="start">+y</text><text x="745" y="209" font-size="12" fill="#1f2328" text-anchor="start">x + y</text><text x="805" y="209" font-size="12" fill="#1f2328" text-anchor="start">y - xT<tspan baseline-shift="sub" font-size="72%">S</tspan>/T<tspan baseline-shift="sub" font-size="72%">P</tspan></text><line x1="535" y1="133" x2="800" y2="133" stroke="#57606a" stroke-width="1"/><rect x="520" y="260" width="340" height="88.4" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="532" y="280" font-size="12" fill="#1f2328" text-anchor="start">Annulus: T<tspan baseline-shift="sub" font-size="72%">A</tspan> = T<tspan baseline-shift="sub" font-size="72%">S</tspan> + 2 T<tspan baseline-shift="sub" font-size="72%">P</tspan></text><text x="532" y="298.6" font-size="12" fill="#1f2328" text-anchor="start">Fixed annulus: arm = N<tspan baseline-shift="sub" font-size="72%">S</tspan> &#215; T<tspan baseline-shift="sub" font-size="72%">S</tspan> / (T<tspan baseline-shift="sub" font-size="72%">S</tspan> + T<tspan baseline-shift="sub" font-size="72%">A</tspan>)</text><text x="532" y="317.2" font-size="12" fill="#1f2328" text-anchor="start">Hence gear ratio sun:arm = 1 + T<tspan baseline-shift="sub" font-size="72%">A</tspan>/T<tspan baseline-shift="sub" font-size="72%">S</tspan></text><text x="532" y="335.8" font-size="12" fill="#1f2328" text-anchor="start">Planet turns about its own axis and also orbits</text></svg>