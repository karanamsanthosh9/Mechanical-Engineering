<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Dimensionless Numbers and Their Force Ratios</text><rect x="40" y="80" width="820" height="34" fill="#dbeafe" stroke="#e5e7eb" stroke-width="1.5"/><text x="60" y="103" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">Number</text><text x="250" y="103" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">Formula</text><text x="420" y="103" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">Force ratio</text><text x="640" y="103" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">Used for</text><rect x="40" y="114" width="820" height="38" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="60" y="138" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Reynolds Re</text><text x="250" y="138" font-size="12" fill="#1f2328" text-anchor="start">&#961; V L / &#956;</text><text x="420" y="138" font-size="12" fill="#1f2328" text-anchor="start">inertia / viscous</text><text x="640" y="138" font-size="12" fill="#1f2328" text-anchor="start">pipe flow, ship, aircraft models</text><rect x="40" y="152" width="820" height="38" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/><text x="60" y="176" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Froude Fr</text><text x="250" y="176" font-size="12" fill="#1f2328" text-anchor="start">V / &#8730;(g L)</text><text x="420" y="176" font-size="12" fill="#1f2328" text-anchor="start">inertia / gravity</text><text x="640" y="176" font-size="12" fill="#1f2328" text-anchor="start">free surface, ships, spillways</text><rect x="40" y="190" width="820" height="38" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="60" y="214" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Euler Eu</text><text x="250" y="214" font-size="12" fill="#1f2328" text-anchor="start">p / (&#961; V<tspan baseline-shift="super" font-size="72%">2</tspan>)</text><text x="420" y="214" font-size="12" fill="#1f2328" text-anchor="start">pressure / inertia</text><text x="640" y="214" font-size="12" fill="#1f2328" text-anchor="start">cavitation, pumps</text><rect x="40" y="228" width="820" height="38" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/><text x="60" y="252" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Weber We</text><text x="250" y="252" font-size="12" fill="#1f2328" text-anchor="start">&#961; V<tspan baseline-shift="super" font-size="72%">2</tspan> L / &#963;</text><text x="420" y="252" font-size="12" fill="#1f2328" text-anchor="start">inertia / surface tension</text><text x="640" y="252" font-size="12" fill="#1f2328" text-anchor="start">droplets, capillary waves</text><rect x="40" y="266" width="820" height="38" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="60" y="290" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Mach M</text><text x="250" y="290" font-size="12" fill="#1f2328" text-anchor="start">V / c</text><text x="420" y="290" font-size="12" fill="#1f2328" text-anchor="start">inertia / elastic</text><text x="640" y="290" font-size="12" fill="#1f2328" text-anchor="start">compressible flow</text><rect x="40" y="304" width="820" height="38" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/><text x="60" y="328" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Prandtl Pr</text><text x="250" y="328" font-size="12" fill="#1f2328" text-anchor="start">&#956; c<tspan baseline-shift="sub" font-size="72%">p</tspan> / k</text><text x="420" y="328" font-size="12" fill="#1f2328" text-anchor="start">momentum / thermal diffusivity</text><text x="640" y="328" font-size="12" fill="#1f2328" text-anchor="start">convection</text><rect x="40" y="360" width="820" height="67.475" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="380" font-size="11.5" fill="#1f2328" text-anchor="start">Buckingham pi: number of dimensionless groups = n - m (n variables, m fundamental dimensions)</text><text x="52" y="397.825" font-size="11.5" fill="#1f2328" text-anchor="start">Geometric similarity, kinematic similarity (same flow pattern) and dynamic similarity (same force ratios) are all needed</text><text x="52" y="415.65" font-size="11.5" fill="#1f2328" text-anchor="start">Model law: ships use Froude; pipes and aircraft (incompressible) use Reynolds; scale ratios from the governing number</text></svg>