<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Boundary Layer, Separation and Drag</text><text x="220" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Flat plate</text><line x1="40" y1="230" x2="420" y2="230" stroke="#1f2328" stroke-width="4"/><polyline points="40,230 50.5,215.74 61,209.84 71.5,205.31 82,201.48 92.5,198.12 103,195.08 113.5,192.28 124,189.67 134.5,187.23 145,184.91 155.5,182.71 166,180.61 176.5,178.59 187,176.65 197.5,174.78 208,172.97 218.5,171.21 229,169.51 239.5,167.85 250,166.24" fill="none" stroke="#3b82d4" stroke-width="2.5" stroke-linejoin="round"/><polyline points="250,200 257.5,199.4 265,198.8 272.5,198.2 280,197.6" fill="none" stroke="#d98a1f" stroke-width="2.5" stroke-linejoin="round"/><polyline points="250,178.99 267,174.74 284,170.49 301,166.24 318,161.99 335,157.74 352,153.49 369,149.24 386,144.99 403,140.74 420,136.49" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/><line x1="250" y1="235" x2="250" y2="215" stroke="#57606a" stroke-width="1.5" stroke-dasharray="3 3"/><text x="150" y="200" font-size="12" fill="#3b82d4" text-anchor="middle" font-weight="bold">Laminar</text><text x="335" y="170" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">Turbulent</text><text x="250" y="258" font-size="11" fill="#57606a" text-anchor="middle">Transition</text><text x="220" y="285" font-size="11" fill="#1f2328" text-anchor="middle">&#948;/x = 4.64 Re<tspan baseline-shift="sub" font-size="72%">x</tspan><tspan baseline-shift="super" font-size="72%">-1/2</tspan> (laminar);  0.37 Re<tspan baseline-shift="sub" font-size="72%">x</tspan><tspan baseline-shift="super" font-size="72%">-1/5</tspan> (turbulent)</text><text x="670" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Separation on a cylinder</text><circle cx="640" cy="200" r="45" fill="#f7f8fa" stroke="#1f2328" stroke-width="3"/><line x1="530" y1="140" x2="600" y2="160" stroke="#3b82d4" stroke-width="2" marker-end="url(#ae-blue)"/><line x1="530" y1="200" x2="595" y2="200" stroke="#3b82d4" stroke-width="2" marker-end="url(#ae-blue)"/><line x1="530" y1="260" x2="600" y2="240" stroke="#3b82d4" stroke-width="2" marker-end="url(#ae-blue)"/><path d="M 665 160 Q 740 140 780 150" fill="none" stroke="#3b82d4" stroke-width="2" stroke-linejoin="round"/><path d="M 665 240 Q 740 260 780 250" fill="none" stroke="#3b82d4" stroke-width="2" stroke-linejoin="round"/><polyline points="690,180 730,170 700,200 740,220 700,215" fill="none" stroke="#c0392b" stroke-width="2" stroke-linejoin="round"/><text x="745" y="205" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">Wake</text><text x="670" y="138" font-size="11" fill="#7c5cd8" text-anchor="middle" font-weight="bold">separation</text><rect x="40" y="315" width="820" height="82.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="335" font-size="11" fill="#1f2328" text-anchor="start">Separation occurs when the pressure gradient is adverse (dp/dx &gt; 0) and the near-wall fluid loses momentum; wall shear then drops to zero</text><text x="52" y="352.05" font-size="11" fill="#1f2328" text-anchor="start">Drag = friction drag + pressure (form) drag;  F<tspan baseline-shift="sub" font-size="72%">D</tspan> = C<tspan baseline-shift="sub" font-size="72%">D</tspan> (1/2) &#961; V<tspan baseline-shift="super" font-size="72%">2</tspan> A;  streamlining reduces the wake, so pressure drag</text><text x="52" y="369.1" font-size="11" fill="#1f2328" text-anchor="start">Turbulent boundary layer resists separation better (golf-ball dimples, vortex generators); Stokes law (Re &lt; 1): C<tspan baseline-shift="sub" font-size="72%">D</tspan> = 24/Re</text><text x="52" y="386.15" font-size="11" fill="#1f2328" text-anchor="start">Lift: F<tspan baseline-shift="sub" font-size="72%">L</tspan> = C<tspan baseline-shift="sub" font-size="72%">L</tspan> (1/2) &#961; V<tspan baseline-shift="super" font-size="72%">2</tspan> A; stall when the angle of attack is too high and the layer separates</text></svg>