<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Bernoulli Equation, Hydraulic and Energy Grade Lines</text><line x1="40" y1="330" x2="860" y2="330" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="860" y="346" font-size="11" fill="#57606a" text-anchor="end">Datum</text><polyline points="60,270 330,270 400,295 800,295" fill="none" stroke="#1f2328" stroke-width="4" stroke-linejoin="round"/><polyline points="60,255 330,255 400,285 800,285" fill="none" stroke="#1f2328" stroke-width="4" stroke-linejoin="round"/><line x1="60" y1="255" x2="60" y2="270" stroke="#1f2328" stroke-width="3"/><polyline points="60,120 800,190" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/><polyline points="60,165 330,190 400,130 800,215" fill="none" stroke="#3b82d4" stroke-width="3" stroke-dasharray="7 4" stroke-linejoin="round"/><text x="420" y="115" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">Energy grade line (EGL): p/&#961; g + V<tspan baseline-shift="super" font-size="72%">2</tspan>/2g + z</text><text x="520" y="262" font-size="12" fill="#3b82d4" text-anchor="start" font-weight="bold">HGL: p/&#961; g + z</text><line x1="360" y1="130" x2="360" y2="190" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><text x="368" y="168" font-size="12" fill="#1f2328" text-anchor="start">V<tspan baseline-shift="super" font-size="72%">2</tspan>/2g</text><line x1="60" y1="270" x2="60" y2="330" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="70.425" y="291" width="15.15" height="18" fill="#ffffff" opacity="0.9"/><text x="78" y="304" font-size="13" fill="#1f2328" text-anchor="middle">z</text><text x="60" y="100" font-size="12" fill="#57606a" text-anchor="start">Constant total head H in an ideal flow</text><rect x="40" y="360" width="820" height="82.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="380" font-size="11" fill="#1f2328" text-anchor="start">Bernoulli: p/&#961; g + V<tspan baseline-shift="super" font-size="72%">2</tspan>/2g + z = constant along a streamline (steady, incompressible, inviscid, no work or heat transfer)</text><text x="52" y="397.05" font-size="11" fill="#1f2328" text-anchor="start">EGL falls only through losses (slope = friction head loss per length); HGL lies V<tspan baseline-shift="super" font-size="72%">2</tspan>/2g below the EGL</text><text x="52" y="414.1" font-size="11" fill="#1f2328" text-anchor="start">HGL rises where V falls (e.g. a diverging section)</text><text x="52" y="431.15" font-size="11" fill="#1f2328" text-anchor="start">A pipe above the HGL has pressure below atmospheric: siphon summit and cavitation risk</text></svg>