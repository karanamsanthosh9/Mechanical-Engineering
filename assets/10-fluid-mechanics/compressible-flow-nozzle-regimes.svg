t="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Compressible Flow: Area-Velocity Relation and Shocks</text><text x="260" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Choked nozzle: M and p along the axis</text><line x1="100" y1="300" x2="434" y2="300" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="100" y1="300" x2="100" y2="106" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="432" y="324" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">Distance along nozzle</text><text x="90" y="98" font-size="14" fill="#1f2328" text-anchor="start" font-style="italic">M, p/p<tspan baseline-shift="sub" font-size="72%">0</tspan></text><polyline points="100,290.96 196,263.83 260,209.57 420,128.18" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><polyline points="100,136.36 196,152.73 260,213.27 420,280.36" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/><line x1="260" y1="300" x2="260" y2="136.36363636363637" stroke="#7c5cd8" stroke-width="1" stroke-dasharray="4 3"/><text x="266" y="132.36363636363637" font-size="11" fill="#7c5cd8" text-anchor="start" font-weight="bold">throat M = 1</text><text x="119.2" y="295.45454545454544" font-size="12" fill="#3b82d4" text-anchor="start" font-weight="bold">M</text><text x="340" y="230" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">p/p<tspan baseline-shift="sub" font-size="72%">0</tspan></text><rect x="520" y="90" width="330" height="100" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="685" y="129.2" font-size="12" fill="#1f2328" text-anchor="middle"><tspan x="685" dy="0">Area-velocity:  dA/A = (M<tspan baseline-shift="super" font-size="72%">2</tspan> - 1) dV/V</tspan><tspan x="685" dy="15">M &lt; 1: area falls, V rises (nozzle)</tspan><tspan x="685" dy="15">M &gt; 1: area rises, V rises (nozzle)</tspan></text><rect x="520" y="205" width="330" height="99.25" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="532" y="225" font-size="11" fill="#1f2328" text-anchor="start">Normal shock: M<tspan baseline-shift="sub" font-size="72%">1</tspan> &gt; 1 to M<tspan baseline-shift="sub" font-size="72%">2</tspan> &lt; 1</text><text x="532" y="242.05" font-size="11" fill="#1f2328" text-anchor="start">p, T, &#961; rise; stagnation pressure falls;</text><text x="532" y="259.1" font-size="11" fill="#1f2328" text-anchor="start">entropy increases; stagnation T constant</text><text x="532" y="276.15" font-size="11" fill="#1f2328" text-anchor="start">M<tspan baseline-shift="sub" font-size="72%">2</tspan><tspan baseline-shift="super" font-size="72%">2</tspan> = (M<tspan baseline-shift="sub" font-size="72%">1</tspan><tspan baseline-shift="super" font-size="72%">2</tspan> + 2/(&#947;-1)) /</text><text x="532" y="293.2" font-size="11" fill="#1f2328" text-anchor="start">(2&#947; M<tspan baseline-shift="sub" font-size="72%">1</tspan><tspan baseline-shift="super" font-size="72%">2</tspan>/(&#947;-1) - 1)</text><rect x="40" y="345" width="820" height="65.15" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="365" font-size="11" fill="#1f2328" text-anchor="start">Isentropic relations: T<tspan baseline-shift="sub" font-size="72%">0</tspan>/T = 1 + (&#947;-1)M<tspan baseline-shift="super" font-size="72%">2</tspan>/2;  p<tspan baseline-shift="sub" font-size="72%">0</tspan>/p = (T<tspan baseline-shift="sub" font-size="72%">0</tspan>/T)<tspan baseline-shift="super" font-size="72%">&#947;/(&#947;-1)</tspan>;  Mach number M = V / c, c = &#8730;(&#947; R T)</text><text x="52" y="382.05" font-size="11" fill="#1f2328" text-anchor="start">Mach regimes: subsonic &lt; 0.8, transonic 0.8-1.2, supersonic 1.2-5, hypersonic &gt; 5;  Mach angle &#956; = sin<tspan baseline-shift="super" font-size="72%">-1</tspan>(1/M)</text><text x="52" y="399.1" font-size="11" fill="#1f2328" text-anchor="start">Fanno flow: adiabatic with friction, moves to M = 1;  Rayleigh flow: frictionless with heat addition, moves to M = 1 (choking)</text></svg>