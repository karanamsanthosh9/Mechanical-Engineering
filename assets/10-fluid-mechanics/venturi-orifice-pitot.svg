<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Flow Measurement: Venturimeter, Orifice Meter and Pitot Tube</text><text x="210" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Venturimeter</text><polyline points="40,130 140,130 210,170 260,170 350,130 400,130" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><polyline points="40,250 140,250 210,210 260,210 350,250 400,250" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><line x1="100" y1="130" x2="100" y2="80" stroke="#1f2328" stroke-width="2"/><line x1="235" y1="170" x2="235" y2="110" stroke="#1f2328" stroke-width="2"/><line x1="100" y1="90" x2="108" y2="90" stroke="#57606a" stroke-width="1.5"/><line x1="235" y1="120" x2="243" y2="120" stroke="#57606a" stroke-width="1.5"/><line x1="75" y1="90" x2="75" y2="120" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><text x="30" y="108" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">&#916; h</text><text x="100" y="72" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">1</text><text x="235" y="102" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">2 (throat)</text><line x1="15" y1="190" x2="45" y2="190" stroke="#3b82d4" stroke-width="2.5" marker-end="url(#ae-blue)"/><text x="210" y="280" font-size="12" fill="#1f2328" text-anchor="middle">Q = C<tspan baseline-shift="sub" font-size="72%">d</tspan> a<tspan baseline-shift="sub" font-size="72%">1</tspan> a<tspan baseline-shift="sub" font-size="72%">2</tspan> &#8730;(2 g h) / &#8730;(a<tspan baseline-shift="sub" font-size="72%">1</tspan><tspan baseline-shift="super" font-size="72%">2</tspan> - a<tspan baseline-shift="sub" font-size="72%">2</tspan><tspan baseline-shift="super" font-size="72%">2</tspan>)</text><text x="210" y="300" font-size="11" fill="#57606a" text-anchor="middle">C<tspan baseline-shift="sub" font-size="72%">d</tspan> about 0.95-0.99; pressure recovery in diffuser</text><text x="650" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Orifice meter</text><text x="650" y="330" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Pitot tube</text><polyline points="470,130 830,130" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><polyline points="470,250 830,250" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><rect x="640" y="130" width="10" height="50" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="640" y="200" width="10" height="50" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><text x="650" y="280" font-size="11" fill="#1f2328" text-anchor="middle">Q = C<tspan baseline-shift="sub" font-size="72%">d</tspan> a<tspan baseline-shift="sub" font-size="72%">0</tspan>&#8730;(2gh)/ &#8730;(1 - (a<tspan baseline-shift="sub" font-size="72%">0</tspan>/A)<tspan baseline-shift="super" font-size="72%">2</tspan>)</text><text x="650" y="298" font-size="11" fill="#57606a" text-anchor="middle">C<tspan baseline-shift="sub" font-size="72%">d</tspan> about 0.6-0.65 (vena contracta, large loss)</text><text x="650" y="355" font-size="11.5" fill="#1f2328" text-anchor="middle">V = C<tspan baseline-shift="sub" font-size="72%">v</tspan>&#8730;(2 g h);  stagnation head - static head = V<tspan baseline-shift="super" font-size="72%">2</tspan>/2g</text><line x1="470" y1="190" x2="510" y2="190" stroke="#3b82d4" stroke-width="2.5" marker-end="url(#ae-blue)"/><rect x="40" y="385" width="820" height="49.65" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="405" font-size="11.5" fill="#1f2328" text-anchor="start">Venturi: lowest head loss, costly. Orifice: cheapest, highest loss. Rotameter: variable area, constant pressure drop</text><text x="52" y="422.825" font-size="11.5" fill="#1f2328" text-anchor="start">Pitot-static: velocity at a point (traverse for average)</text></svg>