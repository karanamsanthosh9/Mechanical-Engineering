<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Buoyancy, Stability and Metacentric Height</text><text x="230" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Tilted floating body</text><rect x="40" y="230" width="380" height="120" fill="#dbeafe" stroke="none" stroke-width="1.5"/><line x1="40" y1="230" x2="420" y2="230" stroke="#3b82d4" stroke-width="2"/><polygon points="150,180 310,150 340,270 180,300" fill="#f7f8fa" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><circle cx="245" cy="225" r="5" fill="#2e8b57"/><circle cx="262" cy="262" r="5" fill="#c0392b"/><circle cx="238" cy="90" r="5" fill="#7c5cd8"/><text x="255" y="220" font-size="14" fill="#2e8b57" text-anchor="start" font-weight="bold">G</text><text x="275" y="268" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">B<tspan baseline-shift="sub" font-size="72%">1</tspan></text><text x="250" y="86" font-size="14" fill="#7c5cd8" text-anchor="start" font-weight="bold">M</text><line x1="245" y1="225" x2="238" y2="90" stroke="#7c5cd8" stroke-width="1.5" stroke-dasharray="5 3"/><line x1="262" y1="262" x2="262" y2="215" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><text x="215" y="200" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">W</text><line x1="245" y1="225" x2="245" y2="270" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="380" y="130" font-size="12" fill="#7c5cd8" text-anchor="start" font-weight="bold">GM</text><rect x="500" y="90" width="350" height="80" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="675" y="126.425" font-size="13" fill="#1f2328" text-anchor="middle"><tspan x="675" dy="0">Archimedes principle</tspan><tspan x="675" dy="16.25">F<tspan baseline-shift="sub" font-size="72%">B</tspan> = weight of liquid displaced = &#961; g V<tspan baseline-shift="sub" font-size="72%">disp</tspan></tspan></text><rect x="500" y="190" width="350" height="103.125" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="512" y="210" font-size="11.5" fill="#1f2328" text-anchor="start">Metacentric height GM = BM - BG</text><text x="512" y="227.825" font-size="11.5" fill="#1f2328" text-anchor="start">BM = I / V (I = second moment of waterline area)</text><text x="512" y="245.65" font-size="11.5" fill="#1f2328" text-anchor="start">M above G: stable; M below G: unstable;</text><text x="512" y="263.475" font-size="11.5" fill="#1f2328" text-anchor="start">M at G: neutral equilibrium</text><text x="512" y="281.3" font-size="11.5" fill="#1f2328" text-anchor="start">Rolling period T = 2&#960; k / &#8730;(g GM)</text><rect x="40" y="375" width="820" height="49.65" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="395" font-size="11.5" fill="#1f2328" text-anchor="start">Submerged body: stable if G is below B (centre of buoyancy); a floating body is stable if M lies above G</text><text x="52" y="412.825" font-size="11.5" fill="#1f2328" text-anchor="start">Righting couple = W x GM x sin&#952;; floating means weight = buoyant force, with the same line of action when upright</text></svg>