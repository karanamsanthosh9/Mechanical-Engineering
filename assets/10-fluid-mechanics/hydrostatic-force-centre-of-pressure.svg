<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Hydrostatic Force on a Plane Surface</text><rect x="60" y="100" width="160" height="260" fill="#dbeafe" stroke="none" stroke-width="1.5"/><line x1="60" y1="100" x2="220" y2="100" stroke="#3b82d4" stroke-width="2"/><text x="65" y="94" font-size="11" fill="#3b82d4" text-anchor="start" font-weight="bold">Free surface</text><line x1="220" y1="100" x2="360" y2="330" stroke="#1f2328" stroke-width="6"/><circle cx="280" cy="200" r="4" fill="#2e8b57"/><circle cx="302" cy="238" r="4" fill="#c0392b"/><text x="292" y="195" font-size="12" fill="#2e8b57" text-anchor="start" font-weight="bold">G (centroid)</text><text x="312" y="244" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">C.P.</text><line x1="250" y1="100" x2="250" y2="200" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><text x="256" y="150" font-size="12" fill="#1f2328" text-anchor="start">h<tspan baseline-shift="sub" font-size="72%">c</tspan></text><line x1="302" y1="238" x2="255" y2="262" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><text x="215" y="285" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">F</text><text x="430" y="130" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">Total force:  F = &#961; g A h<tspan baseline-shift="sub" font-size="72%">c</tspan></text><text x="430" y="160" font-size="12" fill="#1f2328" text-anchor="start">Centre of pressure (measured along the plate):</text><text x="430" y="190" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">h* = h<tspan baseline-shift="sub" font-size="72%">c</tspan> + I<tspan baseline-shift="sub" font-size="72%">G</tspan> sin<tspan baseline-shift="super" font-size="72%">2</tspan>&#952; / (A h<tspan baseline-shift="sub" font-size="72%">c</tspan>)</text><text x="430" y="225" font-size="12" fill="#57606a" text-anchor="start">h<tspan baseline-shift="sub" font-size="72%">c</tspan> = depth of the centroid below the free surface</text><text x="430" y="245" font-size="12" fill="#57606a" text-anchor="start">I<tspan baseline-shift="sub" font-size="72%">G</tspan> = second moment of area about the centroidal axis</text><rect x="430" y="275" width="400" height="82.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="442" y="295" font-size="11" fill="#1f2328" text-anchor="start">Rectangle (width b, depth d, vertical, top at surface):</text><text x="442" y="312.05" font-size="11" fill="#1f2328" text-anchor="start">F = &#961; g b d<tspan baseline-shift="super" font-size="72%">2</tspan> / 2;  acts at 2d/3 from the top</text><text x="442" y="329.1" font-size="11" fill="#1f2328" text-anchor="start">Rectangle I<tspan baseline-shift="sub" font-size="72%">G</tspan> = b d<tspan baseline-shift="super" font-size="72%">3</tspan>/12;  triangle I<tspan baseline-shift="sub" font-size="72%">G</tspan> = b d<tspan baseline-shift="super" font-size="72%">3</tspan>/36</text><text x="442" y="346.15" font-size="11" fill="#1f2328" text-anchor="start">Centre of pressure is always below G (equal only if horizontal)</text><rect x="40" y="395" width="820" height="49.65" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="415" font-size="11.5" fill="#1f2328" text-anchor="start">Pressure diagram is triangular for a vertical plane; the resultant passes through its centroid</text><text x="52" y="432.825" font-size="11.5" fill="#1f2328" text-anchor="start">Curved surface: horizontal force = force on the vertical projection; vertical force = weight of liquid above</text></svg>