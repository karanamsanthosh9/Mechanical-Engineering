t="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Pipe Flow: Laminar and Turbulent Velocity Profiles</text><text x="170" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Velocity profiles</text><line x1="40" y1="120" x2="300" y2="120" stroke="#1f2328" stroke-width="4"/><line x1="40" y1="260" x2="300" y2="260" stroke="#1f2328" stroke-width="4"/><line x1="40" y1="190" x2="300" y2="190" stroke="#57606a" stroke-width="1" stroke-dasharray="4 3"/><polyline points="100,120 122.8,127 143.2,134 161.2,141 176.8,148 190,155 200.8,162 209.2,169 215.2,176 218.8,183 220,190 218.8,197 215.2,204 209.2,211 200.8,218 190,225 176.8,232 161.2,239 143.2,246 122.8,253 100,260" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><polyline points="127.94,122 173.35,126.53 200.92,131.07 217.04,135.6 226.05,140.13 230.82,144.67 233.2,149.2 234.3,153.73 234.76,158.27 234.93,162.8 234.98,167.33 235,171.87 235,176.4 235,180.93 235,185.47 235,190 235,194.53 235,199.07 235,203.6 235,208.13 234.98,212.67 234.93,217.2 234.76,221.73 234.3,226.27 233.2,230.8 230.82,235.33 226.05,239.87 217.04,244.4 200.92,248.93 173.35,253.47 127.94,258" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 3" stroke-linejoin="round"/><text x="60" y="300" font-size="12" fill="#3b82d4" text-anchor="start" font-weight="bold">Laminar: V<tspan baseline-shift="sub" font-size="72%">max</tspan> = 2 V<tspan baseline-shift="sub" font-size="72%">avg</tspan></text><text x="60" y="318" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">Turbulent: V<tspan baseline-shift="sub" font-size="72%">max</tspan> about 1.2 V<tspan baseline-shift="sub" font-size="72%">avg</tspan></text><text x="650" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Friction factor f against Re</text><line x1="480" y1="290" x2="834" y2="290" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="480" y1="290" x2="480" y2="76" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="832" y="314" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">Reynolds number Re (log)</text><text x="470" y="68" font-size="14" fill="#1f2328" text-anchor="start" font-style="italic">f</text><polyline points="486.8,129.64 499.72,135.85 512.64,142.07 525.56,148.29 538.48,154.51 551.4,160.73 564.32,166.95 577.24,173.16 590.16,179.38 603.08,185.6 616,191.82" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><polyline points="616,190 629.6,162.73 650,208.18 684,226.36 752,235.45 820,239.09" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/><polyline points="650,208.18 718,240.91 820,250" fill="none" stroke="#d98a1f" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round"/><text x="507.2" y="162.72727272727275" font-size="12" fill="#3b82d4" text-anchor="start" font-weight="bold">f = 64/Re</text><text x="629.6" y="126" font-size="11" fill="#57606a" text-anchor="middle">critical zone</text><text x="718" y="211.27272727272725" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold">smooth pipes</text><text x="758.8" y="259.6363636363636" font-size="11" fill="#d98a1f" text-anchor="start" font-weight="bold">rough: f constant</text><rect x="40" y="345" width="820" height="65.15" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="365" font-size="11" fill="#1f2328" text-anchor="start">Hagen-Poiseuille (laminar): &#916; p = 32 &#956; L V / D<tspan baseline-shift="super" font-size="72%">2</tspan>;  Darcy: h<tspan baseline-shift="sub" font-size="72%">f</tspan> = f L V<tspan baseline-shift="super" font-size="72%">2</tspan> / (2 g D);  laminar f = 64/Re (Re &lt; 2000)</text><text x="52" y="382.05" font-size="11" fill="#1f2328" text-anchor="start">Blasius smooth turbulent: f = 0.316 Re<tspan baseline-shift="super" font-size="72%">-1/4</tspan> (4000 &lt; Re &lt; 10<tspan baseline-shift="super" font-size="72%">5</tspan>);  fully rough: f depends only on relative roughness &#949; / D</text><text x="52" y="399.1" font-size="11" fill="#1f2328" text-anchor="start">Minor losses: sudden expansion h = (V<tspan baseline-shift="sub" font-size="72%">1</tspan> - V<tspan baseline-shift="sub" font-size="72%">2</tspan>)<tspan baseline-shift="super" font-size="72%">2</tspan>/2g;  exit loss V<tspan baseline-shift="super" font-size="72%">2</tspan>/2g;  entrance 0.5 V<tspan baseline-shift="super" font-size="72%">2</tspan>/2g</text></svg>