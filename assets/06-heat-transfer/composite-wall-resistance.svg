<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Composite Wall and Thermal Resistance Network</text><rect x="150" y="90" width="70" height="150" fill="#fde2e0" stroke="#1f2328" stroke-width="2"/><rect x="220" y="90" width="90" height="150" fill="#fdecc8" stroke="#1f2328" stroke-width="2"/><rect x="310" y="90" width="60" height="150" fill="#dbeafe" stroke="#1f2328" stroke-width="2"/><text x="185" y="165" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold"><tspan x="185" dy="0">A</tspan><tspan x="185" dy="15">k<tspan baseline-shift="sub" font-size="72%">1</tspan></tspan></text><text x="265" y="165" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold"><tspan x="265" dy="0">B</tspan><tspan x="265" dy="15">k<tspan baseline-shift="sub" font-size="72%">2</tspan></tspan></text><text x="340" y="165" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold"><tspan x="340" dy="0">C</tspan><tspan x="340" dy="15">k<tspan baseline-shift="sub" font-size="72%">3</tspan></tspan></text><line x1="70" y1="165" x2="148" y2="165" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><line x1="372" y1="165" x2="450" y2="165" stroke="#3b82d4" stroke-width="3" marker-end="url(#ae-blue)"/><text x="110" y="150" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">Q</text><text x="150" y="80" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">T<tspan baseline-shift="sub" font-size="72%">1</tspan></text><text x="220" y="80" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">T<tspan baseline-shift="sub" font-size="72%">2</tspan></text><text x="310" y="80" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">T<tspan baseline-shift="sub" font-size="72%">3</tspan></text><text x="370" y="80" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">T<tspan baseline-shift="sub" font-size="72%">4</tspan></text><polyline points="150,110 220,140 310,180 370,195" fill="none" stroke="#1f2328" stroke-width="2.5" stroke-dasharray="6 3" stroke-linejoin="round"/><line x1="150" y1="262" x2="220" y2="262" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="173.85" y="253" width="22.3" height="18" fill="#ffffff" opacity="0.9"/><text x="185" y="266" font-size="13" fill="#1f2328" text-anchor="middle">L<tspan baseline-shift="sub" font-size="72%">1</tspan></text><line x1="220" y1="262" x2="310" y2="262" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="253.85" y="253" width="22.3" height="18" fill="#ffffff" opacity="0.9"/><text x="265" y="266" font-size="13" fill="#1f2328" text-anchor="middle">L<tspan baseline-shift="sub" font-size="72%">2</tspan></text><line x1="310" y1="262" x2="370" y2="262" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="328.85" y="253" width="22.3" height="18" fill="#ffffff" opacity="0.9"/><text x="340" y="266" font-size="13" fill="#1f2328" text-anchor="middle">L<tspan baseline-shift="sub" font-size="72%">3</tspan></text><text x="260" y="62" font-size="12" fill="#57606a" text-anchor="middle">Temperature profile (steeper in poorer conductors)</text><rect x="520" y="90" width="80" height="40" rx="5" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5"/><text x="560" y="114.55" font-size="13" fill="#1f2328" text-anchor="middle">R<tspan baseline-shift="sub" font-size="72%">1</tspan></text><rect x="630" y="90" width="80" height="40" rx="5" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><text x="670" y="114.55" font-size="13" fill="#1f2328" text-anchor="middle">R<tspan baseline-shift="sub" font-size="72%">2</tspan></text><rect x="740" y="90" width="80" height="40" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="780" y="114.55" font-size="13" fill="#1f2328" text-anchor="middle">R<tspan baseline-shift="sub" font-size="72%">3</tspan></text><line x1="480" y1="110" x2="520" y2="110" stroke="#1f2328" stroke-width="2"/><line x1="600" y1="110" x2="630" y2="110" stroke="#1f2328" stroke-width="2"/><line x1="710" y1="110" x2="740" y2="110" stroke="#1f2328" stroke-width="2"/><line x1="820" y1="110" x2="850" y2="110" stroke="#1f2328" stroke-width="2"/><text x="480" y="98" font-size="12" fill="#1f2328" text-anchor="middle">T<tspan baseline-shift="sub" font-size="72%">1</tspan></text><text x="850" y="98" font-size="12" fill="#1f2328" text-anchor="middle">T<tspan baseline-shift="sub" font-size="72%">4</tspan></text><text x="560" y="158" font-size="11" fill="#57606a" text-anchor="middle">L<tspan baseline-shift="sub" font-size="72%">1</tspan>/(k<tspan baseline-shift="sub" font-size="72%">1</tspan>A)</text><text x="670" y="158" font-size="11" fill="#57606a" text-anchor="middle">L<tspan baseline-shift="sub" font-size="72%">2</tspan>/(k<tspan baseline-shift="sub" font-size="72%">2</tspan>A)</text><text x="780" y="158" font-size="11" fill="#57606a" text-anchor="middle">L<tspan baseline-shift="sub" font-size="72%">3</tspan>/(k<tspan baseline-shift="sub" font-size="72%">3</tspan>A)</text><rect x="40" y="300" width="820" height="88.4" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="320" font-size="12" fill="#1f2328" text-anchor="start">Series: Q = (T<tspan baseline-shift="sub" font-size="72%">1</tspan> - T<tspan baseline-shift="sub" font-size="72%">4</tspan>) / (R<tspan baseline-shift="sub" font-size="72%">1</tspan> + R<tspan baseline-shift="sub" font-size="72%">2</tspan> + R<tspan baseline-shift="sub" font-size="72%">3</tspan>),   R = L / (k A)  (plane wall)</text><text x="52" y="338.6" font-size="12" fill="#1f2328" text-anchor="start">Same Q passes through every layer; temperature drop in a layer = Q x R of that layer</text><text x="52" y="357.2" font-size="12" fill="#1f2328" text-anchor="start">Contact resistance adds in series where layers meet; with convection on both faces add 1/(h<tspan baseline-shift="sub" font-size="72%">i</tspan>A) and 1/(h<tspan baseline-shift="sub" font-size="72%">o</tspan>A)</text><text x="52" y="375.8" font-size="12" fill="#1f2328" text-anchor="start">Overall coefficient: 1/U = 1/h<tspan baseline-shift="sub" font-size="72%">i</tspan> + &#931;(L/k) + 1/h<tspan baseline-shift="sub" font-size="72%">o</tspan></text></svg>