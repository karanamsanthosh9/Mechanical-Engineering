<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="440" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Block on a Rough Inclined Plane</text><polygon points="110,380 570,380 570,114.42" fill="#f7f8fa" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><polygon points="293.6,274 359.42,236 336.42,196.16 270.6,234.16" fill="#dbeafe" stroke="#3b82d4" stroke-width="2" stroke-linejoin="round"/><line x1="315.0063509461097" y1="235.08141571295792" x2="315.0063509461097" y2="340.0814157129579" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ae-red)"/><text x="325.0063509461097" y="353.0814157129579" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold">W</text><line x1="315.0063509461097" y1="235.08141571295792" x2="265.0063509461097" y2="148.47887533451404" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#ae-green)"/><text x="255.0063509461097" y="140.47887533451404" font-size="15" fill="#2e8b57" text-anchor="end" font-weight="bold">N</text><line x1="315.0063509461097" y1="235.08141571295792" x2="397.2787643056314" y2="187.58141571295792" stroke="#d98a1f" stroke-width="2.5" marker-end="url(#ae-orange)"/><text x="392.2787643056314" y="157.58141571295792" font-size="14" fill="#d98a1f" text-anchor="middle" font-weight="bold">F (friction)</text><line x1="315.0063509461097" y1="235.08141571295792" x2="254.384572681199" y2="270.0814157129579" stroke="#3b82d4" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ae-blue)"/><text x="248.384572681199" y="288.0814157129579" font-size="13" fill="#3b82d4" text-anchor="end">W sin &#952;</text><line x1="315.0063509461097" y1="235.08141571295792" x2="360.0063509461097" y2="313.0237020535574" stroke="#3b82d4" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ae-blue)"/><text x="368.0063509461097" y="329.0237020535574" font-size="13" fill="#3b82d4" text-anchor="start">W cos &#952;</text><path d="M180.00,380.00 A70,70 0 0 0 170.62,345.00" fill="none" stroke="#1f2328" stroke-width="1.2" stroke-linejoin="round"/><text x="191.13776940828174" y="362.25920021138825" font-size="13" fill="#1f2328" text-anchor="middle">&#952;</text><text x="325" y="408" font-size="12" fill="#57606a" text-anchor="middle">Rough plane (coefficient of friction &#956;)</text><rect x="600" y="110" width="280" height="162.8" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="612" y="130" font-size="12" fill="#1f2328" text-anchor="start">Equilibrium on the incline:</text><text x="612" y="148.6" font-size="12" fill="#1f2328" text-anchor="start">N = W cos &#952;</text><text x="612" y="167.2" font-size="12" fill="#1f2328" text-anchor="start">F = W sin &#952;</text><text x="612" y="185.8" font-size="12" fill="#1f2328" text-anchor="start">Limiting friction: F = &#956; N</text><text x="612" y="204.4" font-size="12" fill="#1f2328" text-anchor="start">so tan &#952; = &#956;</text><text x="612" y="223" font-size="12" fill="#1f2328" text-anchor="start">tan &#966; = &#956;</text><text x="612" y="241.60000000000002" font-size="12" fill="#1f2328" text-anchor="start">(&#966; = angle of friction)</text><text x="612" y="260.20000000000005" font-size="12" fill="#1f2328" text-anchor="start">Angle of repose = &#966;</text></svg>