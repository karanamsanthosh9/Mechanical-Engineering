 stroke-width="1"/><text x="532" y="130" font-size="12" fill="#1f2328" text-anchor="start">Reactions: R<tspan baseline-shift="sub" font-size="72%">A</tspan> = R<tspan baseline-shift="sub" font-size="72%">B</tspan> = W/2</text><text x="532" y="148.6" font-size="12" fill="#1f2328" text-anchor="start">Joint C (vertical):</text><text x="532" y="167.2" font-size="12" fill="#1f2328" text-anchor="start">2 F<tspan baseline-shift="sub" font-size="72%">AC</tspan> sin 45&#176; = W</text><text x="532" y="185.8" font-size="12" fill="#1f2328" text-anchor="start">F<tspan baseline-shift="sub" font-size="72%">AC</tspan> = F<tspan baseline-shift="sub" font-size="72%">BC</tspan> = 0.707 W (C)</text><text x="532" y="204.4" font-size="12" fill="#1f2328" text-anchor="start">Joint A (horizontal):</text><text x="532" y="223" font-size="12" fill="#1f2328" text-anchor="start">F<tspan baseline-shift="sub" font-size="72%">AB</tspan> = F<tspan baseline-shift="sub" font-size="72%">AC</tspan> cos 45&#176; = 0.5 W (T)</text><text x="532" y="241.60000000000002" font-size="12" fill="#1f2328" text-anchor="start">Perfect frame: m = 2j - 3</text><text x="532" y="260.20000000000005" font-size="12" fill="#1f2328" text-anchor="start">3 = 2(3) - 3</text></svg>