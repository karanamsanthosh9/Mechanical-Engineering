<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="470" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Centroids of Standard Shapes</text><text x="130" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Rectangle</text><rect x="60" y="110" width="140" height="100" fill="#dbeafe" stroke="#3b82d4" stroke-width="2"/><circle cx="130" cy="160" r="5" fill="#c0392b"/><line x1="60" y1="160" x2="200" y2="160" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="130" y1="110" x2="130" y2="210" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="225" y1="210" x2="225" y2="160" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="210.275" y="176" width="29.450000000000003" height="18" fill="#ffffff" opacity="0.9"/><text x="225" y="189" font-size="13" fill="#1f2328" text-anchor="middle">h/2</text><text x="130" y="240" font-size="12" fill="#1f2328" text-anchor="middle">x = b/2 , y = h/2</text><line x1="60" y1="260" x2="200" y2="260" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="122.425" y="251" width="15.15" height="18" fill="#ffffff" opacity="0.9"/><text x="130" y="264" font-size="13" fill="#1f2328" text-anchor="middle">b</text><text x="330" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Triangle</text><polygon points="250,210 410,210 310,110" fill="#dbeafe" stroke="#3b82d4" stroke-width="2" stroke-linejoin="round"/><circle cx="323" cy="177" r="5" fill="#c0392b"/><line x1="250" y1="177" x2="410" y2="177" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="432" y1="210" x2="432" y2="177" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="417.275" y="184.5" width="29.450000000000003" height="18" fill="#ffffff" opacity="0.9"/><text x="432" y="197.5" font-size="13" fill="#1f2328" text-anchor="middle">h/3</text><text x="330" y="240" font-size="12" fill="#1f2328" text-anchor="middle">y = h/3 from the base</text><text x="330" y="262" font-size="12" fill="#1f2328" text-anchor="middle">Area = b h / 2</text><text x="580" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Semicircle</text><path d="M500,210 A80,80 0 0 1 660,210 Z" fill="#dbeafe" stroke="#3b82d4" stroke-width="2" stroke-linejoin="round"/><circle cx="580" cy="176.046945473729" r="5" fill="#c0392b"/><line x1="500" y1="210" x2="660" y2="210" stroke="#1f2328" stroke-width="2"/><line x1="620" y1="210" x2="620" y2="176.046945473729" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><text x="612" y="196" font-size="12" fill="#1f2328" text-anchor="end">4R/3&#960;</text><text x="580" y="240" font-size="12" fill="#1f2328" text-anchor="middle">y = 4R / (3&#960;) = 0.424 R</text><text x="580" y="262" font-size="12" fill="#57606a" text-anchor="middle">from the diameter</text><text x="790" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Quarter circle</text><path d="M730,210 L730,130 A80,80 0 0 1 810,210 Z" fill="#dbeafe" stroke="#3b82d4" stroke-width="2" stroke-linejoin="round"/><circle cx="763.953054526271" cy="176.046945473729" r="5" fill="#c0392b"/><text x="790" y="240" font-size="12" fill="#1f2328" text-anchor="middle">x = y = 4R / (3&#960;)</text><text x="790" y="262" font-size="12" fill="#57606a" text-anchor="middle">from each straight edge</text><rect x="40" y="330" width="820" height="74.45" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="350" font-size="13" fill="#1f2328" text-anchor="start">Composite body: x<tspan baseline-shift="sub" font-size="72%">bar</tspan> = &#931;(A x) / &#931; A   and   y<tspan baseline-shift="sub" font-size="72%">bar</tspan> = &#931;(A y) / &#931; A</text><text x="52" y="370.15" font-size="13" fill="#1f2328" text-anchor="start">Hole or cut-out: treat its area as negative.  Axis of symmetry always contains the centroid.</text><text x="52" y="390.3" font-size="13" fill="#1f2328" text-anchor="start">Pappus-Guldinus: surface area = path length of centroid x generating length; volume = path length x area</text></svg>