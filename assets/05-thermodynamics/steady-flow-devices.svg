<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Steady-Flow Devices and their Energy Equations</text><rect x="60" y="60" width="250" height="70" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="185" y="99.55" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">Nozzle / Diffuser</text><line x1="20" y1="95" x2="60" y2="95" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="310" y1="95" x2="350" y2="95" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="185" y="152" font-size="12" fill="#3b82d4" text-anchor="middle" font-weight="bold">V<tspan baseline-shift="sub" font-size="72%">2</tspan> = &#8730;(2 (h<tspan baseline-shift="sub" font-size="72%">1</tspan> - h<tspan baseline-shift="sub" font-size="72%">2</tspan>) + V<tspan baseline-shift="sub" font-size="72%">1</tspan><tspan baseline-shift="super" font-size="72%">2</tspan>)</text><text x="185" y="170" font-size="11" fill="#57606a" text-anchor="middle">q = 0, w = 0; nozzle: pressure falls, velocity rises</text><rect x="60" y="210" width="250" height="70" rx="5" fill="#dcf3e4" stroke="#2e8b57" stroke-width="1.5"/><text x="185" y="249.55" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">Turbine</text><line x1="20" y1="245" x2="60" y2="245" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="310" y1="245" x2="350" y2="245" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="185" y="302" font-size="12" fill="#2e8b57" text-anchor="middle" font-weight="bold">w = h<tspan baseline-shift="sub" font-size="72%">1</tspan> - h<tspan baseline-shift="sub" font-size="72%">2</tspan>  (adiabatic)</text><text x="185" y="320" font-size="11" fill="#57606a" text-anchor="middle">work output, h falls; K.E. change neglected</text><rect x="60" y="360" width="250" height="70" rx="5" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><text x="185" y="399.55" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">Compressor / Pump</text><line x1="20" y1="395" x2="60" y2="395" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="310" y1="395" x2="350" y2="395" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="185" y="452" font-size="12" fill="#d98a1f" text-anchor="middle" font-weight="bold">w = h<tspan baseline-shift="sub" font-size="72%">2</tspan> - h<tspan baseline-shift="sub" font-size="72%">1</tspan>  (work input)</text><text x="185" y="470" font-size="11" fill="#57606a" text-anchor="middle">pump: w = v &#916; p for incompressible liquid</text><rect x="520" y="60" width="250" height="70" rx="5" fill="#e9e3fa" stroke="#7c5cd8" stroke-width="1.5"/><text x="645" y="99.55" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">Throttle valve</text><line x1="480" y1="95" x2="520" y2="95" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="770" y1="95" x2="810" y2="95" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="645" y="152" font-size="12" fill="#7c5cd8" text-anchor="middle" font-weight="bold">h<tspan baseline-shift="sub" font-size="72%">1</tspan> = h<tspan baseline-shift="sub" font-size="72%">2</tspan></text><text x="645" y="170" font-size="11" fill="#57606a" text-anchor="middle">isenthalpic; q = 0, w = 0; pressure drops, entropy rises</text><rect x="520" y="210" width="250" height="70" rx="5" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5"/><text x="645" y="249.55" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">Heat exchanger</text><line x1="480" y1="245" x2="520" y2="245" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="770" y1="245" x2="810" y2="245" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="645" y="302" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">m<tspan baseline-shift="sub" font-size="72%">h</tspan>(h<tspan baseline-shift="sub" font-size="72%">h1</tspan> - h<tspan baseline-shift="sub" font-size="72%">h2</tspan>) = m<tspan baseline-shift="sub" font-size="72%">c</tspan>(h<tspan baseline-shift="sub" font-size="72%">c2</tspan> - h<tspan baseline-shift="sub" font-size="72%">c1</tspan>)</text><text x="645" y="320" font-size="11" fill="#57606a" text-anchor="middle">no work; each stream has its own inlet and outlet</text><rect x="520" y="360" width="340" height="67.475" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="532" y="380" font-size="11.5" fill="#1f2328" text-anchor="start">General SFEE per kg:</text><text x="532" y="397.825" font-size="11.5" fill="#1f2328" text-anchor="start">q + h<tspan baseline-shift="sub" font-size="72%">1</tspan> + V<tspan baseline-shift="sub" font-size="72%">1</tspan><tspan baseline-shift="super" font-size="72%">2</tspan>/2 + g z<tspan baseline-shift="sub" font-size="72%">1</tspan> = w + h<tspan baseline-shift="sub" font-size="72%">2</tspan> + V<tspan baseline-shift="sub" font-size="72%">2</tspan><tspan baseline-shift="super" font-size="72%">2</tspan>/2 + g z<tspan baseline-shift="sub" font-size="72%">2</tspan></text><text x="532" y="415.65" font-size="11.5" fill="#1f2328" text-anchor="start">Flow work p v is included in h = u + p v</text></svg>