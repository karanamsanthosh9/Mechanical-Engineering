t="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">CPM / PERT Network with Critical Path</text><line x1="110.68642116378646" y1="207.83151696247856" x2="237.589710405898" y2="133.18252329064825" stroke="#c0392b" stroke-width="3.5" marker-end="url(#ae-red)"/><text x="175" y="156" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">A (4)</text><line x1="110.68642116378646" y1="232.16848303752144" x2="237.589710405898" y2="306.81747670935175" stroke="#3b82d4" stroke-width="2" marker-end="url(#ae-blue)"/><text x="175" y="298" font-size="12" fill="#3b82d4" text-anchor="middle" font-weight="bold">B (3)</text><line x1="281.23803733716755" y1="131.17791438798292" x2="426.99212621806845" y2="207.8905927463518" stroke="#c0392b" stroke-width="3.5" marker-end="url(#ae-red)"/><text x="355" y="156" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">C (6)</text><line x1="281.23803733716755" y1="308.8220856120171" x2="426.99212621806845" y2="232.1094072536482" stroke="#3b82d4" stroke-width="2" marker-end="url(#ae-blue)"/><text x="355" y="298" font-size="12" fill="#3b82d4" text-anchor="middle" font-weight="bold">D (5)</text><line x1="474" y1="220" x2="614" y2="220" stroke="#c0392b" stroke-width="3.5" marker-end="url(#ae-red)"/><text x="545" y="206" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">E (7)</text><line x1="664" y1="220" x2="774" y2="220" stroke="#c0392b" stroke-width="3.5" marker-end="url(#ae-red)"/><text x="720" y="206" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">F (3)</text><circle cx="90" cy="220" r="22" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><text x="90" y="225" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">1</text><circle cx="260" cy="120" r="22" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><text x="260" y="125" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">2</text><circle cx="260" cy="320" r="22" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><text x="260" y="325" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">3</text><circle cx="450" cy="220" r="22" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><text x="450" y="225" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">4</text><circle cx="640" cy="220" r="22" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><text x="640" y="225" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">5</text><circle cx="800" cy="220" r="22" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><text x="800" y="225" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">6</text><text x="90" y="262" font-size="10.5" fill="#57606a" text-anchor="middle">E=0  L=0</text><text x="260" y="162" font-size="10.5" fill="#57606a" text-anchor="middle">E=4  L=4</text><text x="260" y="362" font-size="10.5" fill="#57606a" text-anchor="middle">E=3  L=5</text><text x="450" y="262" font-size="10.5" fill="#57606a" text-anchor="middle">E=10  L=10</text><text x="640" y="262" font-size="10.5" fill="#57606a" text-anchor="middle">E=17  L=17</text><text x="800" y="262" font-size="10.5" fill="#57606a" text-anchor="middle">E=20  L=20</text><text x="450" y="90" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">Critical path 1-2-4-5-6: duration 4 + 6 + 7 + 3 = 20</text><rect x="40" y="385" width="820" height="65.15" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="405" font-size="11" fill="#1f2328" text-anchor="start">Total float = LFT - EST - duration; free float = EST(head) - EST(tail) - duration; critical activities have zero float</text><text x="52" y="422.05" font-size="11" fill="#1f2328" text-anchor="start">PERT: expected time t<tspan baseline-shift="sub" font-size="72%">e</tspan> = (t<tspan baseline-shift="sub" font-size="72%">o</tspan> + 4 t<tspan baseline-shift="sub" font-size="72%">m</tspan> + t<tspan baseline-shift="sub" font-size="72%">p</tspan>)/6;  variance = ((t<tspan baseline-shift="sub" font-size="72%">p</tspan> - t<tspan baseline-shift="sub" font-size="72%">o</tspan>)/6)<tspan baseline-shift="super" font-size="72%">2</tspan>;  project variance = sum along the critical path</text><text x="52" y="439.1" font-size="11" fill="#1f2328" text-anchor="start">Probability of completion: Z = (T<tspan baseline-shift="sub" font-size="72%">s</tspan> - T<tspan baseline-shift="sub" font-size="72%">e</tspan>) / &#963;<tspan baseline-shift="sub" font-size="72%">project</tspan></text></svg>