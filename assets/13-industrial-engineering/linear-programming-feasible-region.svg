t="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Linear Programming: Graphical Solution</text><line x1="90" y1="330" x2="504" y2="330" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="90" y1="330" x2="90" y2="66" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="502" y="354" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">x<tspan baseline-shift="sub" font-size="72%">1</tspan></text><text x="80" y="58" font-size="14" fill="#1f2328" text-anchor="start" font-style="italic">x<tspan baseline-shift="sub" font-size="72%">2</tspan></text><polygon points="90,330 450,330 152.2,160.8 90,148.18" fill="#dbeafe" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><polyline points="90,125.45 450,330" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/><polyline points="90,148.18 470,225.26" fill="none" stroke="#2e8b57" stroke-width="2.5" stroke-linejoin="round"/><polyline points="90,330 450,330 152.2,160.8 90,148.18 90,330" fill="none" stroke="#3b82d4" stroke-width="3.5" stroke-linejoin="round"/><circle cx="90" cy="330" r="4.5" fill="#7c5cd8"/><circle cx="450" cy="330" r="4.5" fill="#7c5cd8"/><circle cx="152.2" cy="160.79545454545456" r="4.5" fill="#d98a1f"/><circle cx="90" cy="148.1818181818182" r="4.5" fill="#7c5cd8"/><polyline points="90,205 420,330" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3" stroke-linejoin="round"/><polyline points="90,136.82 600,330" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3" stroke-linejoin="round"/><polyline points="90,137.22 598.93,330" fill="none" stroke="#d98a1f" stroke-width="2" stroke-dasharray="6 3" stroke-linejoin="round"/><text x="164.2" y="150.79545454545456" font-size="11" fill="#d98a1f" text-anchor="start" font-weight="bold">Optimum corner</text><text x="210" y="284.54545454545456" font-size="12" fill="#3b82d4" text-anchor="start" font-weight="bold">Feasible region</text><text x="450" y="317.45454545454544" font-size="10.5" fill="#c0392b" text-anchor="end">x<tspan baseline-shift="sub" font-size="72%">1</tspan> + x<tspan baseline-shift="sub" font-size="72%">2</tspan> &lt;= 0.9</text><rect x="540" y="90" width="320" height="140" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="700" y="141.7" font-size="12" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">Maximise Z = 2x<tspan baseline-shift="sub" font-size="72%">1</tspan> + 3x<tspan baseline-shift="sub" font-size="72%">2</tspan>  (c<tspan baseline-shift="sub" font-size="72%">1</tspan>, c<tspan baseline-shift="sub" font-size="72%">2</tspan>)</tspan><tspan x="700" dy="15">subject to a<tspan baseline-shift="sub" font-size="72%">i1</tspan>x<tspan baseline-shift="sub" font-size="72%">1</tspan> + a<tspan baseline-shift="sub" font-size="72%">i2</tspan>x<tspan baseline-shift="sub" font-size="72%">2</tspan> &lt;= b<tspan baseline-shift="sub" font-size="72%">i</tspan></tspan><tspan x="700" dy="15">x<tspan baseline-shift="sub" font-size="72%">1</tspan>, x<tspan baseline-shift="sub" font-size="72%">2</tspan> &gt;= 0</tspan><tspan x="700" dy="15">Optimum at an extreme point</tspan></text><rect x="540" y="245" width="320" height="95.37500000000001" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="552" y="265" font-size="10.5" fill="#1f2328" text-anchor="start">Simplex: slack variables for &lt;=, surplus + artificial for &gt;=;</text><text x="552" y="281.275" font-size="10.5" fill="#1f2328" text-anchor="start">Big-M or two-phase method; optimal when all Z<tspan baseline-shift="sub" font-size="72%">j</tspan> - C<tspan baseline-shift="sub" font-size="72%">j</tspan> &gt;= 0 (max)</text><text x="552" y="297.55" font-size="10.5" fill="#1f2328" text-anchor="start">Duality: primal max has a dual min with the same optimum</text><text x="552" y="313.825" font-size="10.5" fill="#1f2328" text-anchor="start">Unbounded: objective improves without limit;</text><text x="552" y="330.1" font-size="10.5" fill="#1f2328" text-anchor="start">infeasible: no common region</text><rect x="40" y="400" width="820" height="46.550000000000004" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="420" font-size="10.5" fill="#1f2328" text-anchor="start">Transportation: find initial feasible by NWCR, LCM or VAM, optimise with MODI; Assignment: Hungarian method;</text><text x="52" y="436.275" font-size="10.5" fill="#1f2328" text-anchor="start">balanced problem needs sum supply = sum demand</text></svg>