<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Queuing Model M/M/1 and Plant Layout Types</text><text x="220" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">M/M/1 queue</text><line x1="30" y1="140" x2="90" y2="140" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="30" y="128" font-size="11" fill="#1f2328" text-anchor="start">&#955; arrivals</text><rect x="100" y="120" width="22" height="40" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><rect x="130" y="120" width="22" height="40" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><rect x="160" y="120" width="22" height="40" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><rect x="190" y="120" width="22" height="40" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="260" cy="140" r="28" fill="#dcf3e4" stroke="#2e8b57" stroke-width="2"/><text x="260" y="145" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="bold">Server</text><line x1="290" y1="140" x2="340" y2="140" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="300" y="128" font-size="12" fill="#1f2328" text-anchor="start">&#956;</text><text x="40" y="200" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Utilisation &#961; = &#955; / &#956; &lt; 1</text><text x="40" y="222" font-size="12" fill="#1f2328" text-anchor="start">L<tspan baseline-shift="sub" font-size="72%">s</tspan> = &#961; / (1 - &#961;);  L<tspan baseline-shift="sub" font-size="72%">q</tspan> = &#961;<tspan baseline-shift="super" font-size="72%">2</tspan> / (1 - &#961;)</text><text x="40" y="244" font-size="12" fill="#1f2328" text-anchor="start">W<tspan baseline-shift="sub" font-size="72%">s</tspan> = 1 / (&#956; - &#955;);  W<tspan baseline-shift="sub" font-size="72%">q</tspan> = &#961; / (&#956; - &#955;)</text><text x="40" y="266" font-size="12" fill="#7c5cd8" text-anchor="start" font-weight="bold">Little: L = &#955; W</text><text x="670" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Layouts</text><rect x="480" y="100" width="90" height="34" rx="5" fill="#fdecc8" stroke="#57606a" stroke-width="1.5"/><text x="525" y="120.85" font-size="11" fill="#1f2328" text-anchor="middle">M1</text><line x1="570" y1="117" x2="600" y2="117" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><rect x="600" y="100" width="90" height="34" rx="5" fill="#fdecc8" stroke="#57606a" stroke-width="1.5"/><text x="645" y="120.85" font-size="11" fill="#1f2328" text-anchor="middle">M2</text><line x1="690" y1="117" x2="720" y2="117" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><rect x="720" y="100" width="90" height="34" rx="5" fill="#fdecc8" stroke="#57606a" stroke-width="1.5"/><text x="765" y="120.85" font-size="11" fill="#1f2328" text-anchor="middle">M3</text><text x="480" y="155" font-size="10.5" fill="#1f2328" text-anchor="start">Product (line): high volume, one product</text><text x="480" y="172" font-size="10.5" fill="#1f2328" text-anchor="start">Process (functional): turning, milling, grinding departments; job shop</text><text x="480" y="189" font-size="10.5" fill="#1f2328" text-anchor="start">Fixed position: ship, aircraft, bridge; work stays, resources move</text><text x="480" y="206" font-size="10.5" fill="#1f2328" text-anchor="start">Group (cellular): similar parts in a cell; group technology</text><rect x="40" y="300" width="820" height="82.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="320" font-size="11" fill="#1f2328" text-anchor="start">Queue: Poisson arrival, exponential service; M/M/1 steady state needs &#961; &lt; 1</text><text x="52" y="337.05" font-size="11" fill="#1f2328" text-anchor="start">Layout selection: product layout lowest handling cost; process layout most flexible;</text><text x="52" y="354.1" font-size="11" fill="#1f2328" text-anchor="start">line balancing efficiency = sum task times / (stations x cycle time)</text><text x="52" y="371.15" font-size="11" fill="#1f2328" text-anchor="start">Plant location factors: raw material, labour, power, transport, market, climate; location break-even analysis</text></svg>