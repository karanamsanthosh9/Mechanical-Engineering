<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Break-Even Analysis</text><line x1="100" y1="330" x2="594" y2="330" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="100" y1="330" x2="100" y2="76" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="592" y="354" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">Output (units)</text><text x="90" y="68" font-size="14" fill="#1f2328" text-anchor="start" font-style="italic">Cost / revenue</text><polyline points="100,330 580,111.82" fill="none" stroke="#2e8b57" stroke-width="3" stroke-linejoin="round"/><polyline points="100,264.55 580,151.09" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/><polyline points="100,264.55 580,264.55" fill="none" stroke="#57606a" stroke-width="2" stroke-dasharray="5 3" stroke-linejoin="round"/><polygon points="400,193.64 580,151.09 580,111.82" fill="#dcf3e4" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><polygon points="100,264.55 400,193.64 100,330" fill="#fde2e0" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><circle cx="400" cy="193.63636363636365" r="4.5" fill="#7c5cd8"/><text x="408" y="183.63636363636365" font-size="13" fill="#7c5cd8" text-anchor="start" font-weight="bold">BEP</text><line x1="400" y1="330" x2="400" y2="193.63636363636365" stroke="#7c5cd8" stroke-width="1" stroke-dasharray="4 3"/><text x="532" y="103.81818181818181" font-size="12" fill="#2e8b57" text-anchor="end" font-weight="bold">Sales revenue</text><text x="532" y="173.09090909090912" font-size="12" fill="#c0392b" text-anchor="end" font-weight="bold">Total cost</text><text x="109.6" y="258.54545454545456" font-size="11" fill="#57606a" text-anchor="start">Fixed cost</text><text x="474.40000000000003" y="129.63636363636365" font-size="12" fill="#2e8b57" text-anchor="start" font-weight="bold">Profit</text><text x="172" y="308.1818181818182" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">Loss</text><line x1="586" y1="151.09090909090912" x2="586" y2="111.81818181818181" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><text x="592" y="135.45454545454547" font-size="10.5" fill="#1f2328" text-anchor="start">Margin</text><rect x="640" y="90" width="220" height="150" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="750" y="139.2" font-size="12" fill="#1f2328" text-anchor="middle"><tspan x="750" dy="0">BEP (units) = F / (s - v)</tspan><tspan x="750" dy="15">BEP (value) = F / (1 - v/s)</tspan><tspan x="750" dy="15">Contribution = s - v</tspan><tspan x="750" dy="15">P/V ratio = (s - v)/s</tspan><tspan x="750" dy="15">Margin of safety = actual - BEP</tspan></text><rect x="40" y="380" width="820" height="48.1" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="400" font-size="11" fill="#1f2328" text-anchor="start">F = fixed cost, s = selling price per unit, v = variable cost per unit.</text><text x="52" y="417.05" font-size="11" fill="#1f2328" text-anchor="start">Angle of incidence: angle between revenue and total cost lines; large angle means high profit rate</text></svg>