<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Statistical Process Control Charts</text><line x1="90" y1="310" x2="624" y2="310" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="90" y1="310" x2="90" y2="76" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="622" y="334" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">Sample number</text><text x="80" y="68" font-size="14" fill="#1f2328" text-anchor="start" font-style="italic">Sample mean</text><line x1="90" y1="200" x2="610" y2="200" stroke="#2e8b57" stroke-width="2"/><line x1="90" y1="130" x2="610" y2="130" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/><line x1="90" y1="270" x2="610" y2="270" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/><polyline points="110.8,210 142,186 173.2,214 204.4,198 235.6,190 266.8,220 298,206 329.2,178 360.4,162 391.6,150 422.8,140 454,120 485.2,170 516.4,194 547.6,210 578.8,200" fill="none" stroke="#3b82d4" stroke-width="2" stroke-linejoin="round"/><circle cx="110.8" cy="210" r="4.5" fill="#3b82d4"/><circle cx="142" cy="186" r="4.5" fill="#3b82d4"/><circle cx="173.2" cy="214" r="4.5" fill="#3b82d4"/><circle cx="204.4" cy="198" r="4.5" fill="#3b82d4"/><circle cx="235.60000000000002" cy="190" r="4.5" fill="#3b82d4"/><circle cx="266.8" cy="220" r="4.5" fill="#3b82d4"/><circle cx="298" cy="206" r="4.5" fill="#3b82d4"/><circle cx="329.20000000000005" cy="178" r="4.5" fill="#3b82d4"/><circle cx="360.40000000000003" cy="162.00000000000003" r="4.5" fill="#3b82d4"/><circle cx="391.59999999999997" cy="150" r="4.5" fill="#3b82d4"/><circle cx="422.8" cy="140.00000000000003" r="4.5" fill="#3b82d4"/><circle cx="454" cy="120.00000000000003" r="4.5" fill="#c0392b"/><circle cx="485.2" cy="170.00000000000003" r="4.5" fill="#3b82d4"/><circle cx="516.4" cy="194" r="4.5" fill="#3b82d4"/><circle cx="547.6" cy="210" r="4.5" fill="#3b82d4"/><circle cx="578.8" cy="200" r="4.5" fill="#3b82d4"/><text x="618" y="134" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">UCL</text><text x="618" y="204" font-size="13" fill="#2e8b57" text-anchor="start" font-weight="bold">CL</text><text x="618" y="274" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">LCL</text><text x="434" y="108.00000000000003" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold">out of control</text><text x="326" y="186" font-size="11" fill="#d98a1f" text-anchor="start" font-weight="bold">run of rising points (trend)</text><rect x="660" y="90" width="200" height="140" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="760" y="136.35" font-size="11" fill="#1f2328" text-anchor="middle"><tspan x="760" dy="0">X-bar chart:</tspan><tspan x="760" dy="13.75">UCL = X-bar + A<tspan baseline-shift="sub" font-size="72%">2</tspan> R-bar</tspan><tspan x="760" dy="13.75">LCL = X-bar - A<tspan baseline-shift="sub" font-size="72%">2</tspan> R-bar</tspan><tspan x="760" dy="13.75">R chart: D<tspan baseline-shift="sub" font-size="72%">4</tspan> R-bar, D<tspan baseline-shift="sub" font-size="72%">3</tspan> R-bar</tspan><tspan x="760" dy="13.75">p chart: p +- 3 sqrt(p(1-p)/n)</tspan></text><rect x="40" y="365" width="820" height="65.15" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="385" font-size="11" fill="#1f2328" text-anchor="start">Variables: X-bar and R (or s) charts; attributes: p, np (defectives) and c, u (defects). Natural variation is within 3 sigma limits</text><text x="52" y="402.05" font-size="11" fill="#1f2328" text-anchor="start">Process capability C<tspan baseline-shift="sub" font-size="72%">p</tspan> = (USL - LSL)/(6 &#963;);  C<tspan baseline-shift="sub" font-size="72%">pk</tspan> = min(USL - &#956;, &#956; - LSL)/(3 &#963;); C<tspan baseline-shift="sub" font-size="72%">p</tspan> &gt;= 1.33 considered capable</text><text x="52" y="419.1" font-size="11" fill="#1f2328" text-anchor="start">Acceptance sampling: OC curve, producer risk &#945; (AQL) and consumer risk &#946; (LTPD)</text></svg>