<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Sheet Metal: Blanking, Bending and Deep Drawing</text><text x="150" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Blanking / piercing</text><rect x="120" y="100" width="40" height="80" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="60" y="190" width="70" height="40" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="150" y="190" width="70" height="40" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="60" y="180" width="160" height="10" fill="#dbeafe" stroke="#3b82d4" stroke-width="2"/><text x="150" y="255" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="bold">Clearance c each side</text><text x="150" y="275" font-size="11" fill="#1f2328" text-anchor="middle">F = &#964;<tspan baseline-shift="sub" font-size="72%">s</tspan> &#960; d t (blank of diameter d)</text><text x="150" y="295" font-size="10.5" fill="#57606a" text-anchor="middle">Blanking: die size = blank, punch smaller</text><text x="150" y="310" font-size="10.5" fill="#57606a" text-anchor="middle">Piercing: punch size = hole, die larger</text><text x="450" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Bending and springback</text><polyline points="360,200 420,200 450,160 480,200 540,200" fill="none" stroke="#3b82d4" stroke-width="4" stroke-linejoin="round"/><polyline points="360,200 425,190 450,150 475,190 540,200" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3" stroke-linejoin="round"/><text x="450" y="135" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="bold">Springback</text><text x="450" y="260" font-size="11" fill="#1f2328" text-anchor="middle">Neutral axis shifts; bend allowance = &#952; (R + k t)</text><text x="450" y="280" font-size="10.5" fill="#57606a" text-anchor="middle">k = 0.33-0.5; compensate by over-bending</text><text x="750" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Deep drawing</text><rect x="710" y="100" width="30" height="70" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="670" y="180" width="40" height="20" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="740" y="180" width="40" height="20" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><polyline points="670,180 710,180 710,250 740,250 740,180 780,180" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><text x="750" y="285" font-size="10.5" fill="#1f2328" text-anchor="middle">Draw ratio = D/d; limiting draw ratio about 1.8-2.2</text><text x="750" y="303" font-size="10.5" fill="#57606a" text-anchor="middle">Blank holder prevents wrinkling</text><rect x="40" y="335" width="820" height="65.15" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="355" font-size="11" fill="#1f2328" text-anchor="start">Punch force = shear strength x perimeter x thickness; reduced by shear on punch or die (shear angle); work = 0.4-0.6 F t</text><text x="52" y="372.05" font-size="11" fill="#1f2328" text-anchor="start">Clearance (5-10% of sheet thickness each side); too small gives secondary shear; too large gives burrs and poor edge</text><text x="52" y="389.1" font-size="11" fill="#1f2328" text-anchor="start">Deep-drawing defects: wrinkling (flange), tearing (cup wall), earing (anisotropy); Lubrication is critical; redrawing needs annealing</text></svg>