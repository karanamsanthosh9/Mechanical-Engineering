<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Single-Point Cutting Tool Geometry</text><text x="220" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Side view (orthogonal section)</text><polygon points="100,230 330,230 330,150 180,150 150,190" fill="#f7f8fa" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><line x1="100" y1="230" x2="150" y2="190" stroke="#1f2328" stroke-width="3"/><line x1="150" y1="190" x2="180" y2="150" stroke="#1f2328" stroke-width="3"/><line x1="150" y1="190" x2="220" y2="120" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="150" y1="190" x2="150" y2="120" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="150" y1="190" x2="100" y2="190" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="150" y1="190" x2="150" y2="270" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M150.00,152.00 A38,38 0 0 0 131.00,157.09" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-linejoin="round"/><text x="100" y="150" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold">Back rake &#945;<tspan baseline-shift="sub" font-size="72%">b</tspan></text><path d="M120.89,214.43 A38,38 0 0 0 150.00,228.00" fill="none" stroke="#3b82d4" stroke-width="1.2" stroke-linejoin="round"/><text x="76" y="275" font-size="11" fill="#3b82d4" text-anchor="start" font-weight="bold">Clearance &#945;</text><text x="300" y="130" font-size="11" fill="#57606a" text-anchor="end">Rake face (chip flows)</text><text x="60" y="215" font-size="11" fill="#57606a" text-anchor="start">Flank</text><text x="220" y="255" font-size="11" fill="#1f2328" text-anchor="middle">Tool shank</text><text x="670" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Plan view</text><polygon points="540,240 800,240 800,160 640,160 610,200" fill="#f7f8fa" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><line x1="540" y1="240" x2="610" y2="200" stroke="#1f2328" stroke-width="3"/><line x1="610" y1="200" x2="640" y2="160" stroke="#1f2328" stroke-width="3"/><text x="530" y="260" font-size="11" fill="#d98a1f" text-anchor="start" font-weight="bold">End cutting edge angle (ECEA)</text><text x="690" y="140" font-size="11" fill="#2e8b57" text-anchor="start" font-weight="bold">Side cutting edge angle (SCEA)</text><text x="540" y="285" font-size="11" fill="#57606a" text-anchor="start">Larger nose radius: better finish, more chatter</text><rect x="40" y="320" width="820" height="65.15" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="340" font-size="11" fill="#1f2328" text-anchor="start">Tool signature (ASA): back rake - side rake - end relief - side relief - ECEA - SCEA - nose radius, e.g. 8-14-6-6-6-15-0.8 mm</text><text x="52" y="357.05" font-size="11" fill="#1f2328" text-anchor="start">Rake angle: positive reduces cutting force but weakens the edge; negative for brittle tools such as carbide and ceramics, giving strength</text><text x="52" y="374.1" font-size="11" fill="#1f2328" text-anchor="start">Clearance angle prevents rubbing of the flank on the work; too large weakens the tool</text></svg>