<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Limits, Fits and Tolerances (Hole-Basis System)</text><line x1="40" y1="220" x2="440" y2="220" stroke="#1f2328" stroke-width="2"/><text x="445" y="224" font-size="11" fill="#1f2328" text-anchor="start">Basic size (zero line)</text><rect x="80" y="220" width="60" height="50" fill="#dbeafe" stroke="#3b82d4" stroke-width="2"/><text x="110" y="295" font-size="12" fill="#3b82d4" text-anchor="middle" font-weight="bold">Hole (H)</text><rect x="190" y="160" width="60" height="45" fill="#dcf3e4" stroke="#2e8b57" stroke-width="2"/><text x="220" y="140" font-size="11" fill="#2e8b57" text-anchor="middle" font-weight="bold">Shaft: clearance</text><rect x="290" y="195" width="60" height="55" fill="#fdecc8" stroke="#d98a1f" stroke-width="2"/><text x="320" y="280" font-size="11" fill="#d98a1f" text-anchor="middle" font-weight="bold">Shaft: transition</text><rect x="390" y="245" width="60" height="45" fill="#fde2e0" stroke="#c0392b" stroke-width="2"/><text x="420" y="315" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="bold">Shaft: interference</text><line x1="60" y1="220" x2="60" y2="270" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><text x="30" y="250" font-size="10.5" fill="#1f2328" text-anchor="start">Tol.</text><rect x="540" y="90" width="320" height="120" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="700" y="131.7" font-size="12" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">Hole-basis: lower deviation of hole = 0 (H)</tspan><tspan x="700" dy="15">Clearance: shaft always smaller than hole</tspan><tspan x="700" dy="15">Interference: shaft always larger</tspan><tspan x="700" dy="15">Transition: may be either</tspan></text><rect x="540" y="225" width="320" height="99.25" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="552" y="245" font-size="11" fill="#1f2328" text-anchor="start">Tolerance = upper limit - lower limit</text><text x="552" y="262.05" font-size="11" fill="#1f2328" text-anchor="start">Allowance = min. hole - max. shaft (tightest fit)</text><text x="552" y="279.1" font-size="11" fill="#1f2328" text-anchor="start">IT grades: IT01 - IT16; small number, finer fit</text><text x="552" y="296.15" font-size="11" fill="#1f2328" text-anchor="start">Examples: H7/g6 sliding, H7/k6 transition,</text><text x="552" y="313.2" font-size="11" fill="#1f2328" text-anchor="start">H7/p6 or s6 interference (press fit)</text><rect x="40" y="335" width="820" height="48.1" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="355" font-size="11" fill="#1f2328" text-anchor="start">Max. clearance = max. hole - min. shaft;  min. clearance = min. hole - max. shaft;  Max. interference = max. shaft - min. hole</text><text x="52" y="372.05" font-size="11" fill="#1f2328" text-anchor="start">Unilateral tolerance: variation on one side of basic size; bilateral: on both sides; hole-basis preferred (reamers and drills fixed size)</text></svg>