<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Bulk Forming: Rolling, Forging, Extrusion and Drawing</text><text x="120" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Rolling</text><circle cx="120" cy="130" r="38" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><circle cx="120" cy="218" r="38" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="30" y="164" width="90" height="20" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><rect x="120" y="168" width="100" height="12" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="120" y="275" font-size="11" fill="#1f2328" text-anchor="middle">h<tspan baseline-shift="sub" font-size="72%">0</tspan> to h<tspan baseline-shift="sub" font-size="72%">f</tspan>;  draft = h<tspan baseline-shift="sub" font-size="72%">0</tspan> - h<tspan baseline-shift="sub" font-size="72%">f</tspan></text><text x="120" y="292" font-size="11" fill="#57606a" text-anchor="middle">Max draft = &#956;<tspan baseline-shift="super" font-size="72%">2</tspan> R</text><text x="340" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Forging</text><rect x="290" y="100" width="100" height="30" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="290" y="200" width="100" height="30" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="300" y="140" width="80" height="50" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><line x1="340" y1="80" x2="340" y2="98" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><text x="340" y="255" font-size="11" fill="#1f2328" text-anchor="middle">Upsetting: reduces height,</text><text x="340" y="272" font-size="11" fill="#1f2328" text-anchor="middle">increases cross-section</text><text x="340" y="292" font-size="11" fill="#57606a" text-anchor="middle">Open die / closed die / press</text><text x="560" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Extrusion</text><polygon points="480,120 570,120 570,220 480,220" fill="#f7f8fa" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><rect x="485" y="140" width="55" height="60" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><rect x="440" y="150" width="45" height="40" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5"/><polygon points="570,150 640,160 640,180 570,190" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5" stroke-linejoin="round"/><text x="560" y="255" font-size="11" fill="#1f2328" text-anchor="middle">Direct (forward): billet moves with ram,</text><text x="560" y="272" font-size="11" fill="#1f2328" text-anchor="middle">Indirect: die moves; less friction</text><text x="560" y="292" font-size="11" fill="#57606a" text-anchor="middle">Extrusion ratio R = A<tspan baseline-shift="sub" font-size="72%">0</tspan>/A<tspan baseline-shift="sub" font-size="72%">f</tspan></text><text x="790" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Wire drawing</text><polygon points="750,140 810,160 810,180 750,200" fill="#f7f8fa" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><rect x="700" y="150" width="55" height="40" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><rect x="810" y="163" width="60" height="14" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><line x1="810" y1="170" x2="880" y2="170" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><text x="790" y="255" font-size="11" fill="#1f2328" text-anchor="middle">Reduction = (A<tspan baseline-shift="sub" font-size="72%">0</tspan> - A<tspan baseline-shift="sub" font-size="72%">f</tspan>)/A<tspan baseline-shift="sub" font-size="72%">0</tspan></text><text x="790" y="272" font-size="11" fill="#57606a" text-anchor="middle">Drawing stress &lt; yield of product</text><rect x="40" y="320" width="820" height="82.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="340" font-size="11" fill="#1f2328" text-anchor="start">Hot working: above recrystallisation temperature (0.5-0.7 T<tspan baseline-shift="sub" font-size="72%">m</tspan>); no strain hardening, closes porosity</text><text x="52" y="357.05" font-size="11" fill="#1f2328" text-anchor="start">Cold working: better finish and accuracy, but strain hardening</text><text x="52" y="374.1" font-size="11" fill="#1f2328" text-anchor="start">Rolling defects: edge cracks, alligatoring, wavy edges; Forging defects: flash, cold shut, scale pits | Extrusion: centre-burst (chevron) crack</text><text x="52" y="391.15" font-size="11" fill="#1f2328" text-anchor="start">True strain &#949; = ln(l/l<tspan baseline-shift="sub" font-size="72%">0</tspan>) = ln(A<tspan baseline-shift="sub" font-size="72%">0</tspan>/A);  work of deformation per unit volume = &#963;<tspan baseline-shift="sub" font-size="72%">avg</tspan> &#949;</text></svg>