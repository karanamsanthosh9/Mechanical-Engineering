<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Orthogonal Cutting: Shear Plane and Merchant Force Circle</text><text x="230" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Chip formation</text><polygon points="50,260 420,260 420,200 50,200" fill="#fdecc8" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><polygon points="200,200 260,200 300,140 240,140" fill="#f7f8fa" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><line x1="200" y1="200" x2="270" y2="150" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5 3"/><polygon points="200,200 160,160 175,140 210,175" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5" stroke-linejoin="round"/><line x1="430" y1="230" x2="360" y2="230" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="380" y="248" font-size="11" fill="#1f2328" text-anchor="start">V (cutting speed)</text><path d="M230.00,200.00 A30,30 0 0 0 224.27,182.37" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-linejoin="round"/><text x="241.84648671698676" y="190.4032522475023" font-size="13" fill="#c0392b" text-anchor="middle">&#966;</text><text x="268" y="148" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold">Shear plane</text><text x="100" y="135" font-size="11" fill="#1f2328" text-anchor="start">Chip thickness t<tspan baseline-shift="sub" font-size="72%">c</tspan> &gt; t</text><text x="100" y="280" font-size="11" fill="#1f2328" text-anchor="start">Uncut thickness t</text><text x="230" y="300" font-size="11.5" fill="#1f2328" text-anchor="middle">Chip thickness ratio r = t / t<tspan baseline-shift="sub" font-size="72%">c</tspan> = sin&#966; / cos(&#966; - &#945;)</text><text x="230" y="320" font-size="11.5" fill="#57606a" text-anchor="middle">tan&#966; = r cos&#945; / (1 - r sin&#945;)</text><text x="670" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Force circle</text><circle cx="700" cy="210" r="90" fill="none" stroke="#57606a" stroke-width="1.5"/><line x1="610" y1="280" x2="700" y2="210" stroke="#1f2328" stroke-width="3" marker-end="url(#ae-ink)"/><line x1="610" y1="280" x2="790" y2="280" stroke="#3b82d4" stroke-width="2" marker-end="url(#ae-blue)"/><line x1="610" y1="280" x2="610" y2="140" stroke="#2e8b57" stroke-width="2" marker-end="url(#ae-green)"/><text x="790" y="300" font-size="11" fill="#3b82d4" text-anchor="end" font-weight="bold">F<tspan baseline-shift="sub" font-size="72%">c</tspan> (cutting force)</text><text x="575" y="150" font-size="11" fill="#2e8b57" text-anchor="start" font-weight="bold">F<tspan baseline-shift="sub" font-size="72%">t</tspan></text><text x="715" y="215" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">R</text><rect x="40" y="345" width="820" height="65.15" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="365" font-size="11" fill="#1f2328" text-anchor="start">Resultant R = &#8730;(F<tspan baseline-shift="sub" font-size="72%">c</tspan><tspan baseline-shift="super" font-size="72%">2</tspan> + F<tspan baseline-shift="sub" font-size="72%">t</tspan><tspan baseline-shift="super" font-size="72%">2</tspan>);  F<tspan baseline-shift="sub" font-size="72%">s</tspan> = F<tspan baseline-shift="sub" font-size="72%">c</tspan> cos&#966; - F<tspan baseline-shift="sub" font-size="72%">t</tspan> sin&#966;;  friction angle &#946;, &#956; = tan&#946; = (F<tspan baseline-shift="sub" font-size="72%">t</tspan> + F<tspan baseline-shift="sub" font-size="72%">c</tspan> tan&#945;)/(F<tspan baseline-shift="sub" font-size="72%">c</tspan> - F<tspan baseline-shift="sub" font-size="72%">t</tspan> tan&#945;)</text><text x="52" y="382.05" font-size="11" fill="#1f2328" text-anchor="start">Merchant: &#966; = 45 deg + &#945;/2 - &#946;/2;  Lee and Shaffer: &#966; = 45 deg + &#945; - &#946;</text><text x="52" y="399.1" font-size="11" fill="#1f2328" text-anchor="start">Power = F<tspan baseline-shift="sub" font-size="72%">c</tspan> V;  Specific cutting energy = F<tspan baseline-shift="sub" font-size="72%">c</tspan>/(b t);  most energy (about 70%) is shear, rest friction on the rake face</text></svg>