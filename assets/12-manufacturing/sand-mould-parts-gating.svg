<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Sand Mould: Parts of the Gating and Riser System</text><rect x="100" y="120" width="500" height="100" fill="#fdecc8" stroke="#1f2328" stroke-width="2"/><rect x="100" y="220" width="500" height="100" fill="#fdecc8" stroke="#1f2328" stroke-width="2"/><text x="60" y="175" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">Cope</text><text x="60" y="275" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">Drag</text><line x1="100" y1="220" x2="600" y2="220" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 3"/><text x="612" y="224" font-size="11" fill="#57606a" text-anchor="start">Parting line</text><polygon points="150,90 230,90 215,120 165,120" fill="#dbeafe" stroke="#3b82d4" stroke-width="2" stroke-linejoin="round"/><text x="190" y="82" font-size="11" fill="#3b82d4" text-anchor="middle" font-weight="bold">Pouring basin</text><polygon points="180,120 200,120 196,260 184,260" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5" stroke-linejoin="round"/><text x="236" y="170" font-size="11" fill="#3b82d4" text-anchor="start" font-weight="bold">Sprue</text><rect x="184" y="260" width="160" height="14" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="250" y="296" font-size="11" fill="#3b82d4" text-anchor="middle" font-weight="bold">Runner</text><rect x="344" y="255" width="40" height="24" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="364" y="300" font-size="11" fill="#3b82d4" text-anchor="middle" font-weight="bold">Gate</text><rect x="384" y="230" width="130" height="70" fill="#fde2e0" stroke="#c0392b" stroke-width="2"/><text x="449" y="270" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">Casting cavity</text><polygon points="470,230 510,230 506,140 474,140" fill="#dcf3e4" stroke="#2e8b57" stroke-width="2" stroke-linejoin="round"/><text x="490" y="130" font-size="12" fill="#2e8b57" text-anchor="middle" font-weight="bold">Riser</text><rect x="300" y="232" width="60" height="12" fill="#f7f8fa" stroke="#1f2328" stroke-width="1"/><line x1="190" y1="70" x2="190" y2="100" stroke="#3b82d4" stroke-width="2.5" marker-end="url(#ae-blue)"/><text x="300" y="345" font-size="12" fill="#57606a" text-anchor="start">Molten metal flows: basin &gt; sprue &gt; runner &gt; gate &gt; cavity &gt; riser</text><rect x="40" y="365" width="820" height="82.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="385" font-size="11" fill="#1f2328" text-anchor="start">Sprue is tapered (narrower at bottom) to avoid aspiration</text><text x="52" y="402.05" font-size="11" fill="#1f2328" text-anchor="start">Gating ratio sprue : runner : gate = 1 : 2 : 2 or 1 : 3 : 3 (unpressurised); 3 : 2 : 1 (pressurised)</text><text x="52" y="419.1" font-size="11" fill="#1f2328" text-anchor="start">Riser feeds shrinkage: solidifies last; Chvorinov t = B (V/A)<tspan baseline-shift="super" font-size="72%">2</tspan>; riser volume/surface-area ratio must exceed that of the casting</text><text x="52" y="436.15" font-size="11" fill="#1f2328" text-anchor="start">Chills (metal inserts) promote directional solidification toward the riser</text></svg>