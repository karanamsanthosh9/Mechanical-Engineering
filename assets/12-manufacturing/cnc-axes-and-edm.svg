t="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">CNC Axes, Coordinate Systems and EDM Principle</text><text x="190" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">CNC milling axes</text><line x1="190" y1="220" x2="190" y2="110" stroke="#3b82d4" stroke-width="3" marker-end="url(#ae-blue)"/><line x1="190" y1="220" x2="310" y2="220" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><line x1="190" y1="220" x2="130" y2="270" stroke="#2e8b57" stroke-width="3" marker-end="url(#ae-green)"/><text x="190" y="100" font-size="12" fill="#3b82d4" text-anchor="middle" font-weight="bold">Z (spindle axis)</text><text x="315" y="224" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">X</text><text x="118" y="285" font-size="13" fill="#2e8b57" text-anchor="start" font-weight="bold">Y</text><text x="40" y="320" font-size="11" fill="#1f2328" text-anchor="start">A, B, C: rotation about X, Y, Z (right-hand rule)</text><text x="40" y="338" font-size="11" fill="#57606a" text-anchor="start">G90 absolute, G91 incremental; G00 rapid, G01 linear feed</text><text x="40" y="356" font-size="11" fill="#57606a" text-anchor="start">G02/G03 circular CW/CCW; M03 spindle on; M05 stop; M30 end</text><text x="650" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Electrical discharge machining</text><rect x="560" y="90" width="60" height="30" fill="#f7f8fa" stroke="#1f2328" stroke-width="1.5"/><polygon points="570,120 610,120 610,160 570,160" fill="#fdecc8" stroke="#d98a1f" stroke-width="2" stroke-linejoin="round"/><rect x="530" y="190" width="250" height="40" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="600" y="180" width="80" height="12" fill="#dbeafe" stroke="none" stroke-width="1.5"/><polyline points="600,160 595,172 605,176 598,186" fill="none" stroke="#c0392b" stroke-width="2" stroke-linejoin="round"/><text x="640" y="175" font-size="10" fill="#c0392b" text-anchor="start" font-weight="bold">spark gap about 0.01-0.5 mm</text><text x="590" y="82" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">Tool (electrode)</text><text x="540" y="250" font-size="11" fill="#3b82d4" text-anchor="start">Workpiece in dielectric (kerosene / deionised water)</text><text x="540" y="268" font-size="11" fill="#57606a" text-anchor="start">Material removed by melting and vaporisation</text><rect x="40" y="385" width="820" height="46.550000000000004" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="405" font-size="10.5" fill="#1f2328" text-anchor="start">Unconventional: USM (abrasive slurry, brittle), AJM, ECM (anodic dissolution, no tool wear), EDM, LBM, EBM (vacuum), PAM</text><text x="52" y="421.275" font-size="10.5" fill="#1f2328" text-anchor="start">MRR: ECM = A I / (Z F &#961;);  EDM electrode wear is low with graphite/copper; Powder metallurgy: blend, compact, sinter, size</text></svg>