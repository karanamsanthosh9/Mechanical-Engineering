<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Chip Types and Tool Life</text><text x="150" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Chip types</text><polyline points="40,120 80,108 120,128 160,112 200,132 240,118" fill="none" stroke="#3b82d4" stroke-width="4" stroke-linejoin="round"/><text x="40" y="160" font-size="10.5" fill="#1f2328" text-anchor="start">Continuous: ductile metals, high speed, sharp tool</text><polyline points="40,200 70,190 90,210 110,192 130,212 160,198" fill="none" stroke="#d98a1f" stroke-width="4" stroke-linejoin="round"/><polygon points="30,190 50,180 50,205" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5" stroke-linejoin="round"/><text x="40" y="238" font-size="10.5" fill="#1f2328" text-anchor="start">With built-up edge: low speed, poor finish</text><polygon points="60,285 84,280 88,297 64,302" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5" stroke-linejoin="round"/><polygon points="100,285 124,280 128,297 104,302" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5" stroke-linejoin="round"/><polygon points="140,285 164,280 168,297 144,302" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5" stroke-linejoin="round"/><polygon points="180,285 204,280 208,297 184,302" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5" stroke-linejoin="round"/><polygon points="220,285 244,280 248,297 224,302" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5" stroke-linejoin="round"/><text x="40" y="322" font-size="10.5" fill="#1f2328" text-anchor="start">Discontinuous: brittle metals, low speed, large feed</text><text x="515" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Flank wear against time</text><line x1="420" y1="250" x2="624" y2="250" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="420" y1="250" x2="420" y2="86" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="622" y="274" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">Time</text><text x="410" y="78" font-size="14" fill="#1f2328" text-anchor="start" font-style="italic">VB</text><polyline points="420,236.36 435.2,211.82 448.5,206.36 553,165.45 581.5,147.73 600.5,106.82" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><line x1="420" y1="154.54545454545456" x2="610" y2="154.54545454545456" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/><text x="427.6" y="195.45454545454544" font-size="12" fill="#57606a" text-anchor="start" font-weight="bold">I</text><text x="496" y="195.45454545454544" font-size="11" fill="#57606a" text-anchor="middle" font-weight="bold">II (steady)</text><text x="591" y="134.09090909090912" font-size="12" fill="#57606a" text-anchor="start" font-weight="bold">III</text><text x="423.8" y="150.54545454545456" font-size="10" fill="#c0392b" text-anchor="start">VB limit</text><text x="770" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Taylor: V T<tspan baseline-shift="super" font-size="72%">n</tspan> = C</text><line x1="690" y1="250" x2="864" y2="250" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="690" y1="250" x2="690" y2="86" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="862" y="274" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">log T</text><text x="680" y="78" font-size="14" fill="#1f2328" text-anchor="start" font-style="italic">log V</text><polyline points="698,120.45 842,229.55" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><text x="780" y="165" font-size="11" fill="#3b82d4" text-anchor="start" font-weight="bold">slope = -n</text><rect x="40" y="335" width="820" height="65.15" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="355" font-size="11" fill="#1f2328" text-anchor="start">Taylor: V T<tspan baseline-shift="super" font-size="72%">n</tspan> = C; n: HSS 0.08-0.2, carbide 0.2-0.5, ceramic 0.5-0.7; extended: V T<tspan baseline-shift="super" font-size="72%">n</tspan> f<tspan baseline-shift="super" font-size="72%">a</tspan> d<tspan baseline-shift="super" font-size="72%">b</tspan> = C</text><text x="52" y="372.05" font-size="11" fill="#1f2328" text-anchor="start">Cutting speed has the largest effect on tool life, then feed, then depth of cut; tool life ends at VB = 0.3 mm (uniform) or 0.6 mm (non-uniform)</text><text x="52" y="389.1" font-size="11" fill="#1f2328" text-anchor="start">Minimum cost tool life: T = (1/n - 1)(t<tspan baseline-shift="sub" font-size="72%">ch</tspan> + C<tspan baseline-shift="sub" font-size="72%">t</tspan>/C<tspan baseline-shift="sub" font-size="72%">m</tspan>) t<tspan baseline-shift="sub" font-size="72%">ch</tspan> = tool change time, C<tspan baseline-shift="sub" font-size="72%">t</tspan> tool cost per edge, C<tspan baseline-shift="sub" font-size="72%">m</tspan> machine rate</text></svg>