<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Oxy-Acetylene Flames: Neutral, Carburising and Oxidising</text><text x="110" y="90" font-size="14" fill="#3b82d4" text-anchor="middle" font-weight="bold">Neutral</text><rect x="30" y="140" width="50" height="30" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><polygon points="80,145 200,155 200,165 80,165" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="80,148 230,154 230,166 80,162" fill="#fdecc8" stroke="#d98a1f" stroke-width="1" stroke-linejoin="round"/><polygon points="80,152 160,156 160,162 80,160" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5" stroke-linejoin="round"/><text x="110" y="215" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">O2 : C2H2 = 1 : 1</text><text x="110" y="235" font-size="11" fill="#57606a" text-anchor="middle">Used for steel, cast iron, copper</text><text x="400" y="90" font-size="14" fill="#d98a1f" text-anchor="middle" font-weight="bold">Carburising (reducing)</text><rect x="320" y="140" width="50" height="30" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><polygon points="370,145 490,155 490,165 370,165" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="370,148 520,154 520,166 370,162" fill="#fdecc8" stroke="#d98a1f" stroke-width="1" stroke-linejoin="round"/><polygon points="370,152 480,156 480,162 370,160" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5" stroke-linejoin="round"/><text x="400" y="215" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">O2 : C2H2 &lt; 1</text><text x="400" y="235" font-size="11" fill="#57606a" text-anchor="middle">Excess acetylene: Monel, nickel, hard facing</text><text x="690" y="90" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">Oxidising</text><rect x="610" y="140" width="50" height="30" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><polygon points="660,145 780,155 780,165 660,165" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="660,148 810,154 810,166 660,162" fill="#fdecc8" stroke="#d98a1f" stroke-width="1" stroke-linejoin="round"/><polygon points="660,152 710,156 710,162 660,160" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5" stroke-linejoin="round"/><text x="690" y="215" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">O2 : C2H2 &gt; 1.15</text><text x="690" y="235" font-size="11" fill="#57606a" text-anchor="middle">Excess oxygen: brass, bronze (hot, short flame)</text><rect x="40" y="280" width="820" height="65.15" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="300" font-size="11" fill="#1f2328" text-anchor="start">Neutral flame: inner cone (about 3200 C) is bright blue with a sharp outline; outer envelope light blue</text><text x="52" y="317.05" font-size="11" fill="#1f2328" text-anchor="start">Carburising flame: acetylene feather extends beyond the inner cone; adds carbon; oxidising flame: short, hissing, pointed inner cone</text><text x="52" y="334.1" font-size="11" fill="#1f2328" text-anchor="start">Leftward (forward) welding: thin sheets up to 5 mm; Rightward (backward): thicker plate, uses less filler</text></svg>