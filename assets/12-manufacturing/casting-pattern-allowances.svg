<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Pattern Allowances and Core Prints</text><polygon points="80,240 80,140 170,140 170,100 290,100 290,240" fill="#dbeafe" stroke="#3b82d4" stroke-width="2" stroke-linejoin="round"/><polygon points="60,255 60,125 150,125 150,85 310,85 310,255" fill="none" stroke="#d98a1f" stroke-width="1.5" stroke-dasharray="6 3" stroke-linejoin="round"/><text x="185" y="190" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Casting</text><text x="185" y="275" font-size="12" fill="#d98a1f" text-anchor="middle" font-weight="bold">Pattern (dashed) larger by allowances</text><polygon points="430,240 430,120 560,120 560,240" fill="#f7f8fa" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><polygon points="420,240 440,120 550,120 570,240" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3" stroke-linejoin="round"/><text x="495" y="185" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">Draft</text><text x="495" y="275" font-size="11" fill="#57606a" text-anchor="middle">taper helps pattern withdrawal (0.5-2 deg)</text><rect x="660" y="140" width="120" height="80" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="780" y="165" width="40" height="30" fill="#fdecc8" stroke="#d98a1f" stroke-width="2"/><rect x="620" y="165" width="40" height="30" fill="#fdecc8" stroke="#d98a1f" stroke-width="2"/><text x="720" y="185" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">Pattern</text><text x="800" y="210" font-size="11" fill="#d98a1f" text-anchor="middle" font-weight="bold">Core print</text><text x="720" y="262" font-size="11" fill="#57606a" text-anchor="middle">Core prints support the core</text><rect x="40" y="300" width="820" height="99.25" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="320" font-size="11" fill="#1f2328" text-anchor="start">Shrinkage allowance: pattern larger by a contraction fraction (cast iron 1%, steel 2%, aluminium 1.3%) - use a shrink rule</text><text x="52" y="337.05" font-size="11" fill="#1f2328" text-anchor="start">Machining allowance: extra stock for finishing; Draft allowance: taper on vertical faces; Shake (rapping) allowance: pattern made smaller</text><text x="52" y="354.1" font-size="11" fill="#1f2328" text-anchor="start">Distortion allowance: for U or V shaped castings that warp on cooling</text><text x="52" y="371.15" font-size="11" fill="#1f2328" text-anchor="start">Pattern materials: wood (few castings), metal (production), wax (investment), plastics</text><text x="52" y="388.2" font-size="11" fill="#1f2328" text-anchor="start">Pattern colour code: red = machined surfaces, black = unmachined, yellow = core prints</text></svg>