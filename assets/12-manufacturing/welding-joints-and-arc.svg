ont-size="11" fill="#1f2328" text-anchor="start">Reverse polarity (electrode positive): more heat at the electrode, better surface cleaning</text><text x="52" y="429.1" font-size="11" fill="#1f2328" text-anchor="start">Zones: fusion zone, heat affected zone (microstructure change), base metal; Preheat and post-heat reduce cracking in steels</text></svg>