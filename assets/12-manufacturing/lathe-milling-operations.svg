<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Lathe, Drilling and Milling Operations</text><text x="220" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Lathe layout</text><rect x="40" y="180" width="380" height="30" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="40" y="120" width="70" height="60" fill="#dbeafe" stroke="#3b82d4" stroke-width="2"/><rect x="360" y="140" width="60" height="40" fill="#dcf3e4" stroke="#2e8b57" stroke-width="2"/><rect x="150" y="110" width="130" height="70" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><text x="75" y="155" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="bold"><tspan x="75" dy="0">Head-</tspan><tspan x="75" dy="13.125">stock</tspan></text><text x="390" y="165" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="bold"><tspan x="390" dy="0">Tail-</tspan><tspan x="390" dy="13.125">stock</tspan></text><text x="215" y="150" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">Workpiece</text><rect x="190" y="90" width="60" height="20" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5"/><text x="220" y="80" font-size="10.5" fill="#c0392b" text-anchor="middle">Tool post + cross slide + carriage</text><text x="230" y="232" font-size="10.5" fill="#57606a" text-anchor="middle">Bed (guideways), lead screw, feed rod</text><text x="40" y="262" font-size="10.5" fill="#1f2328" text-anchor="start">Operations: facing, turning, taper turning, threading, knurling, boring, parting</text><text x="40" y="280" font-size="10.5" fill="#57606a" text-anchor="start">Taper by tailstock offset / compound slide / taper attachment</text><text x="690" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Milling: up and down</text><circle cx="620" cy="160" r="40" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="550" y="205" width="140" height="25" fill="#fdecc8" stroke="#d98a1f" stroke-width="2"/><text x="620" y="165" font-size="10" fill="#1f2328" text-anchor="middle">Cutter</text><line x1="550" y1="245" x2="600" y2="245" stroke="#3b82d4" stroke-width="2" marker-end="url(#ae-blue)"/><text x="550" y="262" font-size="10.5" fill="#3b82d4" text-anchor="start" font-weight="bold">Feed (up milling)</text><circle cx="790" cy="160" r="40" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><rect x="720" y="205" width="140" height="25" fill="#fdecc8" stroke="#d98a1f" stroke-width="2"/><line x1="850" y1="245" x2="800" y2="245" stroke="#2e8b57" stroke-width="2" marker-end="url(#ae-green)"/><text x="720" y="262" font-size="10.5" fill="#2e8b57" text-anchor="start" font-weight="bold">Feed (down milling)</text><rect x="40" y="300" width="820" height="82.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="320" font-size="11" fill="#1f2328" text-anchor="start">Up milling: cutter rotation opposes feed; chip thin to thick; tends to lift the work, better for hard skins and backlash</text><text x="52" y="337.05" font-size="11" fill="#1f2328" text-anchor="start">Down milling: rotation along the feed; chip thick to thin, better finish, longer tool life, needs a backlash eliminator</text><text x="52" y="354.1" font-size="11" fill="#1f2328" text-anchor="start">Cutting speed V = &#960; D N / 1000 (m/min);  Turning: MRR = V f d (mm^3/min);  Drilling time = L/(f N)</text><text x="52" y="371.15" font-size="11" fill="#1f2328" text-anchor="start">Milling machine indexing: simple N<tspan baseline-shift="sub" font-size="72%">index</tspan> = 40 / z turns of crank; angular: 40 x &#952; / 360 = &#952;/9 turns</text></svg>