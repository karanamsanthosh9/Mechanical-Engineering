<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Gas Turbine Plant and Turbojet Layout</text><text x="230" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Open-cycle gas turbine</text><rect x="60" y="120" width="90" height="60" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="105" y="154.55" font-size="13" fill="#1f2328" text-anchor="middle">Compressor</text><rect x="190" y="90" width="100" height="40" rx="5" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><text x="240" y="114.55" font-size="13" fill="#1f2328" text-anchor="middle">Combustor</text><rect x="330" y="120" width="90" height="60" rx="5" fill="#dcf3e4" stroke="#2e8b57" stroke-width="1.5"/><text x="375" y="154.55" font-size="13" fill="#1f2328" text-anchor="middle">Turbine</text><line x1="20" y1="150" x2="60" y2="150" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="8" y="140" font-size="11" fill="#1f2328" text-anchor="start">Air</text><line x1="150" y1="135" x2="190" y2="110" stroke="#1f2328" stroke-width="2"/><line x1="290" y1="110" x2="330" y2="135" stroke="#c0392b" stroke-width="2" marker-end="url(#ae-red)"/><line x1="420" y1="150" x2="470" y2="150" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="430" y="140" font-size="11" fill="#1f2328" text-anchor="start">Exhaust</text><line x1="240" y1="60" x2="240" y2="90" stroke="#c0392b" stroke-width="2" marker-end="url(#ae-red)"/><text x="248" y="74" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold">Fuel</text><line x1="150" y1="165" x2="330" y2="165" stroke="#7c5cd8" stroke-width="3"/><text x="240" y="185" font-size="11" fill="#7c5cd8" text-anchor="middle">common shaft (compressor takes about 50-60% of turbine work)</text><text x="230" y="220" font-size="12" fill="#57606a" text-anchor="middle">Net output = turbine work - compressor work</text><text x="670" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Turbojet</text><rect x="520" y="100" width="70" height="50" rx="5" fill="#f7f8fa" stroke="#57606a" stroke-width="1.5"/><text x="555" y="122.25" font-size="10" fill="#1f2328" text-anchor="middle"><tspan x="555" dy="0">Diffuser</tspan><tspan x="555" dy="12.5">(intake)</tspan></text><rect x="595" y="100" width="80" height="50" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="635" y="128.85" font-size="11" fill="#1f2328" text-anchor="middle">Compressor</text><rect x="680" y="100" width="70" height="50" rx="5" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><text x="715" y="128.85" font-size="11" fill="#1f2328" text-anchor="middle">Burner</text><rect x="755" y="100" width="60" height="50" rx="5" fill="#dcf3e4" stroke="#2e8b57" stroke-width="1.5"/><text x="785" y="128.5" font-size="10" fill="#1f2328" text-anchor="middle">Turbine</text><rect x="820" y="100" width="60" height="50" rx="5" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5"/><text x="850" y="128.5" font-size="10" fill="#1f2328" text-anchor="middle">Nozzle</text><line x1="490" y1="125" x2="520" y2="125" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="880" y1="125" x2="895" y2="125" stroke="#c0392b" stroke-width="2" marker-end="url(#ae-red)"/><text x="570" y="180" font-size="11.5" fill="#1f2328" text-anchor="middle">Thrust F = m[(1+f) V<tspan baseline-shift="sub" font-size="72%">j</tspan> - V<tspan baseline-shift="sub" font-size="72%">a</tspan>] + (p<tspan baseline-shift="sub" font-size="72%">j</tspan> - p<tspan baseline-shift="sub" font-size="72%">a</tspan>) A<tspan baseline-shift="sub" font-size="72%">j</tspan></text><text x="700" y="200" font-size="11.5" fill="#1f2328" text-anchor="middle">Propulsive efficiency &#951;<tspan baseline-shift="sub" font-size="72%">p</tspan> = 2 / (1 + V<tspan baseline-shift="sub" font-size="72%">j</tspan>/V<tspan baseline-shift="sub" font-size="72%">a</tspan>)</text><rect x="40" y="260" width="820" height="85.3" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="280" font-size="11.5" fill="#1f2328" text-anchor="start">Improvements to a gas turbine cycle: regeneration (heat exchanger using exhaust), intercooling, reheating</text><text x="52" y="297.825" font-size="11.5" fill="#1f2328" text-anchor="start">Closed cycle: working fluid recirculates, external heating, clean air, e.g. helium; open cycle: simple, light, common for jets</text><text x="52" y="315.65" font-size="11.5" fill="#1f2328" text-anchor="start">Turboprop: propeller via reduction gear; Turbofan: bypass air, lower noise and fuel use</text><text x="52" y="333.475" font-size="11.5" fill="#1f2328" text-anchor="start">Ramjet: no moving parts, needs forward speed; Rocket: carries its own oxidiser</text><rect x="40" y="380" width="820" height="31.825" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="400" font-size="11.5" fill="#1f2328" text-anchor="start">Specific impulse = thrust / (weight flow of propellant); ramjet works above about Mach 1; scramjet above about Mach 5</text></svg>