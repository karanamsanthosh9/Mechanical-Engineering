<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Boiler Types: Fire-Tube and Water-Tube</text><text x="230" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Fire-tube boiler</text><rect x="60" y="100" width="340" height="150" rx="40" fill="#dbeafe" stroke="#1f2328" stroke-width="3"/><rect x="90" y="120" width="280" height="20" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><line x1="95" y1="130" x2="365" y2="130" stroke="#c0392b" stroke-width="2" marker-end="url(#ae-red)"/><rect x="90" y="165" width="280" height="20" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><line x1="95" y1="175" x2="365" y2="175" stroke="#c0392b" stroke-width="2" marker-end="url(#ae-red)"/><rect x="90" y="210" width="280" height="20" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><line x1="95" y1="220" x2="365" y2="220" stroke="#c0392b" stroke-width="2" marker-end="url(#ae-red)"/><text x="230" y="120" font-size="12" fill="#3b82d4" text-anchor="middle" font-weight="bold">Water</text><text x="230" y="270" font-size="12" fill="#57606a" text-anchor="middle">Hot gas through tubes, water around them</text><text x="60" y="295" font-size="12" fill="#1f2328" text-anchor="start">Examples: Cochran, Lancashire, Locomotive</text><text x="60" y="315" font-size="12" fill="#57606a" text-anchor="start">Low pressure (up to about 20 bar), small capacity</text><text x="670" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Water-tube boiler</text><circle cx="670" cy="100" r="28" fill="#dbeafe" stroke="#3b82d4" stroke-width="2"/><circle cx="740" cy="250" r="22" fill="#dbeafe" stroke="#3b82d4" stroke-width="2"/><line x1="620" y1="128" x2="650" y2="230" stroke="#3b82d4" stroke-width="3"/><line x1="650" y1="128" x2="680" y2="230" stroke="#3b82d4" stroke-width="3"/><line x1="680" y1="128" x2="710" y2="230" stroke="#3b82d4" stroke-width="3"/><line x1="710" y1="128" x2="740" y2="230" stroke="#3b82d4" stroke-width="3"/><rect x="580" y="130" width="190" height="100" fill="none" stroke="#d98a1f" stroke-width="1.5" stroke-dasharray="5 3"/><line x1="570" y1="230" x2="570" y2="150" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><text x="670" y="104" font-size="11" fill="#3b82d4" text-anchor="middle" font-weight="bold">Steam drum</text><text x="740" y="254" font-size="11" fill="#3b82d4" text-anchor="middle" font-weight="bold">Mud drum</text><text x="540" y="190" font-size="12" fill="#c0392b" text-anchor="end" font-weight="bold"><tspan x="540" dy="0">Flue</tspan><tspan x="540" dy="15">gas</tspan></text><text x="580" y="295" font-size="12" fill="#1f2328" text-anchor="start">Examples: Babcock-Wilcox, Stirling</text><text x="580" y="315" font-size="12" fill="#57606a" text-anchor="start">High pressure and capacity, faster steaming</text><rect x="40" y="350" width="820" height="51.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="370" font-size="12" fill="#1f2328" text-anchor="start">Boiler mountings (safety): safety valve, water-level gauge, pressure gauge, stop valve, fusible plug, blow-off cock</text><text x="52" y="388.6" font-size="12" fill="#1f2328" text-anchor="start">Accessories (efficiency): economiser, air preheater, superheater, feed pump, injector</text></svg>