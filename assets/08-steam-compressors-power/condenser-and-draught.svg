<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Condensers and Draught</text><text x="230" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Surface condenser</text><rect x="80" y="100" width="300" height="160" rx="18" fill="#f7f8fa" stroke="#1f2328" stroke-width="3"/><line x1="95" y1="135" x2="365" y2="135" stroke="#3b82d4" stroke-width="4"/><line x1="95" y1="165" x2="365" y2="165" stroke="#3b82d4" stroke-width="4"/><line x1="95" y1="195" x2="365" y2="195" stroke="#3b82d4" stroke-width="4"/><line x1="95" y1="225" x2="365" y2="225" stroke="#3b82d4" stroke-width="4"/><line x1="230" y1="60" x2="230" y2="100" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><text x="250" y="78" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">Exhaust steam from turbine</text><line x1="40" y1="150" x2="95" y2="150" stroke="#3b82d4" stroke-width="2.5" marker-end="url(#ae-blue)"/><text x="40" y="140" font-size="11" fill="#3b82d4" text-anchor="start">Cooling water in</text><line x1="365" y1="210" x2="420" y2="210" stroke="#3b82d4" stroke-width="2.5" marker-end="url(#ae-blue)"/><text x="380" y="232" font-size="11" fill="#3b82d4" text-anchor="start">Cooling water out</text><line x1="150" y1="260" x2="150" y2="300" stroke="#2e8b57" stroke-width="3" marker-end="url(#ae-green)"/><text x="160" y="296" font-size="12" fill="#2e8b57" text-anchor="start" font-weight="bold">Condensate to feed pump</text><line x1="330" y1="260" x2="330" y2="300" stroke="#57606a" stroke-width="2" marker-end="url(#ae-grey)"/><text x="340" y="296" font-size="12" fill="#57606a" text-anchor="start">Air extraction</text><text x="690" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Chimney draught</text><polyline points="650,330 660,120 720,120 730,330" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><line x1="690" y1="330" x2="690" y2="130" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><text x="745" y="200" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">Hot flue gas rises</text><line x1="760" y1="120" x2="760" y2="330" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="752.425" y="216" width="15.15" height="18" fill="#ffffff" opacity="0.9"/><text x="760" y="229" font-size="13" fill="#1f2328" text-anchor="middle">H</text><text x="690" y="350" font-size="11.5" fill="#57606a" text-anchor="middle">Draught = H (&#961;<tspan baseline-shift="sub" font-size="72%">a</tspan> - &#961;<tspan baseline-shift="sub" font-size="72%">g</tspan>) g</text><rect x="40" y="370" width="820" height="82.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="390" font-size="11" fill="#1f2328" text-anchor="start">Jet condenser: steam mixes with cooling water; Surface condenser: steam condenses on tubes, condensate reused (preferred for boilers)</text><text x="52" y="407.05" font-size="11" fill="#1f2328" text-anchor="start">Condenser pressure = p<tspan baseline-shift="sub" font-size="72%">steam</tspan> + p<tspan baseline-shift="sub" font-size="72%">air</tspan> (Dalton); vacuum efficiency = actual vacuum / ideal vacuum</text><text x="52" y="424.1" font-size="11" fill="#1f2328" text-anchor="start">Condenser efficiency = cooling water temperature rise / (saturation temperature - inlet temperature)</text><text x="52" y="441.15" font-size="11" fill="#1f2328" text-anchor="start">Natural draught: no fan; Forced / induced draught: fans give controlled draught; balanced draught uses both</text></svg>