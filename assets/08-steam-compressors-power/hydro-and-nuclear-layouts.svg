<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Hydroelectric and Nuclear (PWR) Plant Layouts</text><text x="230" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Hydroelectric plant</text><polyline points="40,120 160,120 160,90 40,90" fill="none" stroke="#3b82d4" stroke-width="2" stroke-linejoin="round"/><rect x="40" y="90" width="120" height="30" fill="#dbeafe" stroke="none" stroke-width="1.5"/><line x1="160" y1="120" x2="330" y2="280" stroke="#1f2328" stroke-width="5"/><text x="250" y="180" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold" transform="rotate(45 250 180)">Penstock</text><rect x="330" y="270" width="90" height="50" rx="5" fill="#dcf3e4" stroke="#2e8b57" stroke-width="1.5"/><text x="375" y="291.975" font-size="11" fill="#1f2328" text-anchor="middle"><tspan x="375" dy="0">Turbine +</tspan><tspan x="375" dy="13.75">generator</tspan></text><line x1="420" y1="300" x2="470" y2="300" stroke="#3b82d4" stroke-width="3" marker-end="url(#ae-blue)"/><text x="420" y="340" font-size="11" fill="#3b82d4" text-anchor="start">Tail race</text><line x1="70" y1="120" x2="70" y2="300" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="44.55" y="201" width="50.900000000000006" height="18" fill="#ffffff" opacity="0.9"/><text x="70" y="214" font-size="13" fill="#1f2328" text-anchor="middle">Head H</text><text x="40" y="80" font-size="12" fill="#3b82d4" text-anchor="start" font-weight="bold">Reservoir</text><text x="40" y="230" font-size="12" fill="#1f2328" text-anchor="start">P = &#961; g Q H &#951;</text><text x="690" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Pressurised water reactor</text><rect x="560" y="100" width="100" height="80" rx="5" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><text x="610" y="131" font-size="10" fill="#1f2328" text-anchor="middle"><tspan x="610" dy="0">Reactor core</tspan><tspan x="610" dy="12.5">(UO2, moderator</tspan><tspan x="610" dy="12.5">= coolant)</tspan></text><rect x="710" y="100" width="100" height="80" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="760" y="136.975" font-size="11" fill="#1f2328" text-anchor="middle"><tspan x="760" dy="0">Steam</tspan><tspan x="760" dy="13.75">generator</tspan></text><line x1="660" y1="120" x2="710" y2="120" stroke="#c0392b" stroke-width="2.5"/><line x1="710" y1="160" x2="660" y2="160" stroke="#3b82d4" stroke-width="2.5"/><text x="685" y="112" font-size="10" fill="#c0392b" text-anchor="middle">hot</text><text x="685" y="176" font-size="10" fill="#3b82d4" text-anchor="middle">cold</text><line x1="810" y1="120" x2="850" y2="120" stroke="#c0392b" stroke-width="2" marker-end="url(#ae-red)"/><text x="850" y="108" font-size="10" fill="#c0392b" text-anchor="end">steam out</text><text x="610" y="215" font-size="11" fill="#57606a" text-anchor="start">Primary loop: high pressure, no boiling</text><rect x="40" y="345" width="820" height="65.15" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="365" font-size="11" fill="#1f2328" text-anchor="start">Hydro: high head - Pelton; medium - Francis; low head, large flow - Kaplan. Needs a surge tank to absorb water hammer</text><text x="52" y="382.05" font-size="11" fill="#1f2328" text-anchor="start">PWR: moderator and coolant is light water; control rods absorb neutrons; BWR boils water in the core; CANDU: heavy water, natural uranium</text><text x="52" y="399.1" font-size="11" fill="#1f2328" text-anchor="start">Fission: U-235 absorbs a thermal neutron, releases about 200 MeV and 2-3 neutrons; chain reaction when k = 1; fuel enrichment 3-5% for PWR</text></svg>