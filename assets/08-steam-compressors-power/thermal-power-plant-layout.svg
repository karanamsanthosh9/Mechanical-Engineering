<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Thermal Power Plant: Four Circuits</text><rect x="40" y="100" width="90" height="50" rx="5" fill="#f7f8fa" stroke="#57606a" stroke-width="1.5"/><text x="85" y="121.975" font-size="11" fill="#1f2328" text-anchor="middle"><tspan x="85" dy="0">Coal</tspan><tspan x="85" dy="13.75">handling</tspan></text><rect x="160" y="100" width="100" height="50" rx="5" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><text x="210" y="121.975" font-size="11" fill="#1f2328" text-anchor="middle"><tspan x="210" dy="0">Boiler</tspan><tspan x="210" dy="13.75">(furnace)</tspan></text><rect x="290" y="100" width="90" height="50" rx="5" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5"/><text x="335" y="121.975" font-size="11" fill="#1f2328" text-anchor="middle"><tspan x="335" dy="0">Super-</tspan><tspan x="335" dy="13.75">heater</tspan></text><rect x="410" y="100" width="90" height="50" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="455" y="128.85" font-size="11" fill="#1f2328" text-anchor="middle">Turbine</text><rect x="530" y="100" width="90" height="50" rx="5" fill="#e9e3fa" stroke="#7c5cd8" stroke-width="1.5"/><text x="575" y="128.85" font-size="11" fill="#1f2328" text-anchor="middle">Generator</text><line x1="130" y1="125" x2="160" y2="125" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="260" y1="125" x2="290" y2="125" stroke="#c0392b" stroke-width="2" marker-end="url(#ae-red)"/><line x1="380" y1="125" x2="410" y2="125" stroke="#c0392b" stroke-width="2" marker-end="url(#ae-red)"/><line x1="500" y1="125" x2="530" y2="125" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="620" y1="125" x2="680" y2="125" stroke="#7c5cd8" stroke-width="3" marker-end="url(#ae-purple)"/><text x="640" y="112" font-size="11" fill="#7c5cd8" text-anchor="start" font-weight="bold">Power</text><rect x="410" y="220" width="90" height="50" rx="5" fill="#dcf3e4" stroke="#2e8b57" stroke-width="1.5"/><text x="455" y="248.85" font-size="11" fill="#1f2328" text-anchor="middle">Condenser</text><rect x="290" y="220" width="90" height="50" rx="5" fill="#dcf3e4" stroke="#2e8b57" stroke-width="1.5"/><text x="335" y="241.975" font-size="11" fill="#1f2328" text-anchor="middle"><tspan x="335" dy="0">Feed pump +</tspan><tspan x="335" dy="13.75">heaters</tspan></text><rect x="160" y="220" width="100" height="50" rx="5" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><text x="210" y="248.85" font-size="11" fill="#1f2328" text-anchor="middle">Economiser</text><line x1="455" y1="150" x2="455" y2="220" stroke="#3b82d4" stroke-width="2" marker-end="url(#ae-blue)"/><line x1="410" y1="245" x2="380" y2="245" stroke="#2e8b57" stroke-width="2" marker-end="url(#ae-green)"/><line x1="290" y1="245" x2="260" y2="245" stroke="#2e8b57" stroke-width="2" marker-end="url(#ae-green)"/><line x1="210" y1="220" x2="210" y2="150" stroke="#2e8b57" stroke-width="2" marker-end="url(#ae-green)"/><rect x="540" y="220" width="100" height="50" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="590" y="241.975" font-size="11" fill="#1f2328" text-anchor="middle"><tspan x="590" dy="0">Cooling tower</tspan><tspan x="590" dy="13.75">+ CW pump</tspan></text><line x1="540" y1="245" x2="500" y2="245" stroke="#3b82d4" stroke-width="2" marker-end="url(#ae-blue)"/><line x1="500" y1="255" x2="540" y2="255" stroke="#3b82d4" stroke-width="2" marker-end="url(#ae-blue)"/><rect x="160" y="330" width="100" height="40" rx="5" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><text x="210" y="353.85" font-size="11" fill="#1f2328" text-anchor="middle">Air preheater</text><rect x="300" y="330" width="90" height="40" rx="5" fill="#f7f8fa" stroke="#57606a" stroke-width="1.5"/><text x="345" y="353.85" font-size="11" fill="#1f2328" text-anchor="middle">ESP</text><rect x="420" y="330" width="100" height="40" rx="5" fill="#f7f8fa" stroke="#57606a" stroke-width="1.5"/><text x="470" y="353.85" font-size="11" fill="#1f2328" text-anchor="middle">Chimney</text><line x1="210" y1="270" x2="210" y2="330" stroke="#c0392b" stroke-width="2" marker-end="url(#ae-red)"/><line x1="260" y1="350" x2="300" y2="350" stroke="#c0392b" stroke-width="2" marker-end="url(#ae-red)"/><line x1="390" y1="350" x2="420" y2="350" stroke="#c0392b" stroke-width="2" marker-end="url(#ae-red)"/><text x="100" y="390" font-size="11" fill="#c0392b" text-anchor="start">Flue gas path: furnace &gt; superheater &gt; economiser &gt; air preheater &gt; ESP &gt; ID fan &gt; chimney</text><rect x="40" y="410" width="820" height="65.15" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="430" font-size="11" fill="#1f2328" text-anchor="start">Four circuits: coal and ash; air and flue gas; feed water and steam; cooling water. Overall efficiency = boiler x turbine x generator x auxiliaries</text><text x="52" y="447.05" font-size="11" fill="#1f2328" text-anchor="start">Load factor = average load / peak load; utilisation factor = max demand / capacity</text><text x="52" y="464.1" font-size="11" fill="#1f2328" text-anchor="start">Diversity factor = sum of individual maxima / system maximum demand</text></svg>