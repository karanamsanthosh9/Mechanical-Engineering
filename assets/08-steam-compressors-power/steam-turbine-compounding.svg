<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Compounding of Impulse Turbines</text><text x="180" y="80" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Pressure compounding</text><line x1="60" y1="330" x2="314" y2="330" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="60" y1="330" x2="60" y2="146" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="312" y="354" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">Stages</text><polyline points="60,175.45 120,221.82 180,260.45 240,296 300,322.27" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/><polyline points="60,314.55 88.8,206.36 120,314.55 148.8,206.36 180,314.55 208.8,206.36 240,314.55 268.8,206.36 300,314.55" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><text x="460" y="80" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Velocity compounding</text><line x1="340" y1="330" x2="594" y2="330" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="340" y1="330" x2="340" y2="146" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="592" y="354" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">Stages</text><polyline points="340,175.45 392.8,322.27 580,322.27" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/><polyline points="340,314.55 400,175.45 460,245 520,253.5 580,314.55" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><text x="740" y="80" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Pressure-velocity</text><line x1="620" y1="330" x2="874" y2="330" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="620" y1="330" x2="620" y2="146" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="872" y="354" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">Stages</text><polyline points="620,175.45 656,245 740,245 776,299.09 860,299.09" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/><polyline points="620,314.55 648.8,206.36 692,268.18 740,299.09 752,221.82 800,283.64 860,314.55" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><text x="60" y="118" font-size="12" fill="#1f2328" text-anchor="start">Red: pressure</text><text x="60" y="138" font-size="12" fill="#1f2328" text-anchor="start">Blue: steam velocity</text><rect x="40" y="370" width="820" height="67.475" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="390" font-size="11.5" fill="#1f2328" text-anchor="start">Pressure compounding (Rateau): several nozzle-blade stages; velocity drop and speed small in each stage (lower rpm, longer machine)</text><text x="52" y="407.825" font-size="11.5" fill="#1f2328" text-anchor="start">Velocity compounding (Curtis): one nozzle, rows of moving blades with fixed guide blades between; blades see high speed, so efficiency lower</text><text x="52" y="425.65" font-size="11.5" fill="#1f2328" text-anchor="start">Reason for compounding: a single stage gives rotor speed too high (about 30,000 rpm for full expansion)</text></svg>