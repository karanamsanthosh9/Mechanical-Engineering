t="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Reciprocating Compressor: P-V Diagram with Clearance</text><line x1="100" y1="330" x2="514" y2="330" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="100" y1="330" x2="100" y2="76" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="512" y="354" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">Volume V</text><text x="90" y="68" font-size="14" fill="#1f2328" text-anchor="start" font-style="italic">Pressure p</text><polygon points="500,297.27 491.26,296.32 482.51,295.31 473.77,294.26 465.03,293.14 456.28,291.96 447.54,290.71 438.8,289.39 430.05,287.98 421.31,286.49 412.57,284.9 403.82,283.21 395.08,281.4 386.34,279.46 377.59,277.38 368.85,275.14 360.11,272.73 351.36,270.13 342.62,267.31 333.88,264.25 325.13,260.91 316.39,257.26 307.65,253.25 298.9,248.84 290.16,243.95 281.42,238.52 272.67,232.46 263.93,225.64 255.19,217.93 246.44,209.16 237.7,199.09 148,199.09 151.05,209.16 154.1,217.93 157.14,225.64 160.19,232.46 163.24,238.52 166.29,243.95 169.33,248.84 172.38,253.25 175.43,257.26 178.48,260.91 181.53,264.25 184.57,267.31 187.62,270.13 190.67,272.73 193.72,275.14 196.76,277.38 199.81,279.46 202.86,281.4 205.91,283.21 208.96,284.9 212,286.49 215.05,287.98 218.1,289.39 221.15,290.71 224.19,291.96 227.24,293.14 230.29,294.26 233.34,295.31 236.38,296.32 239.43,297.27 239.43,297.27" fill="#dbeafe" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><polyline points="500,297.27 491.26,296.32 482.51,295.31 473.77,294.26 465.03,293.14 456.28,291.96 447.54,290.71 438.8,289.39 430.05,287.98 421.31,286.49 412.57,284.9 403.82,283.21 395.08,281.4 386.34,279.46 377.59,277.38 368.85,275.14 360.11,272.73 351.36,270.13 342.62,267.31 333.88,264.25 325.13,260.91 316.39,257.26 307.65,253.25 298.9,248.84 290.16,243.95 281.42,238.52 272.67,232.46 263.93,225.64 255.19,217.93 246.44,209.16 237.7,199.09" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><polyline points="237.7,199.09 148,199.09" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/><polyline points="148,199.09 151.05,209.16 154.1,217.93 157.14,225.64 160.19,232.46 163.24,238.52 166.29,243.95 169.33,248.84 172.38,253.25 175.43,257.26 178.48,260.91 181.53,264.25 184.57,267.31 187.62,270.13 190.67,272.73 193.72,275.14 196.76,277.38 199.81,279.46 202.86,281.4 205.91,283.21 208.96,284.9 212,286.49 215.05,287.98 218.1,289.39 221.15,290.71 224.19,291.96 227.24,293.14 230.29,294.26 233.34,295.31 236.38,296.32 239.43,297.27" fill="none" stroke="#d98a1f" stroke-width="3" stroke-linejoin="round"/><polyline points="239.43,297.27 500,297.27" fill="none" stroke="#2e8b57" stroke-width="3" stroke-linejoin="round"/><line x1="148" y1="330" x2="148" y2="199.0909090909091" stroke="#57606a" stroke-width="1" stroke-dasharray="4 3"/><text x="144" y="348" font-size="11" fill="#57606a" text-anchor="middle">V<tspan baseline-shift="sub" font-size="72%">c</tspan></text><text x="486" y="366" font-size="11" fill="#57606a" text-anchor="middle">V<tspan baseline-shift="sub" font-size="72%">1</tspan></text><line x1="100" y1="199.0909090909091" x2="148" y2="199.0909090909091" stroke="#57606a" stroke-width="1" stroke-dasharray="4 3"/><text x="76" y="203.0909090909091" font-size="12" fill="#57606a" text-anchor="start">p<tspan baseline-shift="sub" font-size="72%">2</tspan></text><line x1="100" y1="297.27272727272725" x2="239.43259418697517" y2="297.27272727272725" stroke="#57606a" stroke-width="1" stroke-dasharray="4 3"/><text x="76" y="301.27272727272725" font-size="12" fill="#57606a" text-anchor="start">p<tspan baseline-shift="sub" font-size="72%">1</tspan></text><text x="508" y="301.27272727272725" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">1</text><text x="245.70094511942693" y="193.0909090909091" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">2</text><text x="134" y="193.0909090909091" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">3</text><text x="235.43259418697517" y="315.27272727272725" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">4</text><line x1="239.43259418697517" y1="338" x2="500" y2="338" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><text x="369.7162970934876" y="356" font-size="11" fill="#7c5cd8" text-anchor="middle">Induced volume</text><text x="272" y="177.2727272727273" font-size="10.5" fill="#1f2328" text-anchor="start">1-2 compression, 2-3 delivery</text><text x="272" y="159.8181818181818" font-size="10.5" fill="#1f2328" text-anchor="start">3-4 re-expansion, 4-1 suction</text><rect x="560" y="90" width="300" height="130" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="710" y="129.2" font-size="12" fill="#1f2328" text-anchor="middle"><tspan x="710" dy="0">Swept volume V<tspan baseline-shift="sub" font-size="72%">s</tspan> = V<tspan baseline-shift="sub" font-size="72%">1</tspan> - V<tspan baseline-shift="sub" font-size="72%">3</tspan></tspan><tspan x="710" dy="15">Clearance volume V<tspan baseline-shift="sub" font-size="72%">c</tspan> = V<tspan baseline-shift="sub" font-size="72%">3</tspan></tspan><tspan x="710" dy="15">Clearance ratio c = V<tspan baseline-shift="sub" font-size="72%">c</tspan>/V<tspan baseline-shift="sub" font-size="72%">s</tspan></tspan><tspan x="710" dy="15">Volumetric efficiency</tspan><tspan x="710" dy="15">&#951;<tspan baseline-shift="sub" font-size="72%">v</tspan> = 1 + c - c (p<tspan baseline-shift="sub" font-size="72%">2</tspan>/p<tspan baseline-shift="sub" font-size="72%">1</tspan>)<tspan baseline-shift="super" font-size="72%">1/n</tspan></tspan></text><rect x="560" y="240" width="300" height="82.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="572" y="260" font-size="11" fill="#1f2328" text-anchor="start">Higher delivery pressure: re-expansion</text><text x="572" y="277.05" font-size="11" fill="#1f2328" text-anchor="start">takes more of the stroke, so &#951;<tspan baseline-shift="sub" font-size="72%">v</tspan></text><text x="572" y="294.1" font-size="11" fill="#1f2328" text-anchor="start">falls; at a limit pressure, no free air</text><text x="572" y="311.15" font-size="11" fill="#1f2328" text-anchor="start">is delivered. Remedy: multi-stage.</text><rect x="40" y="390" width="820" height="31.825" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="410" font-size="11.5" fill="#1f2328" text-anchor="start">Work per cycle (polytropic, per kg) W = n/(n-1) p<tspan baseline-shift="sub" font-size="72%">1</tspan>V<tspan baseline-shift="sub" font-size="72%">1</tspan>[(p<tspan baseline-shift="sub" font-size="72%">2</tspan>/p<tspan baseline-shift="sub" font-size="72%">1</tspan>)<tspan baseline-shift="super" font-size="72%">(n-1)/n</tspan> - 1];  clearance volume does not change work per kg of delivered air</text></svg>