<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Convergent-Divergent Nozzle: Pressure and Velocity</text><polyline points="70,150 200,150 330,190 560,120" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><polyline points="70,290 200,290 330,250 560,320" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><polyline points="200,150 330,190" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><line x1="30" y1="220" x2="90" y2="220" stroke="#3b82d4" stroke-width="3" marker-end="url(#ae-blue)"/><line x1="570" y1="220" x2="630" y2="220" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><line x1="330" y1="140" x2="330" y2="300" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="330" y="130" font-size="12" fill="#7c5cd8" text-anchor="middle" font-weight="bold">Throat: M = 1</text><text x="150" y="135" font-size="12" fill="#3b82d4" text-anchor="middle" font-weight="bold">Convergent (M &lt; 1)</text><text x="450" y="110" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">Divergent (M &gt; 1)</text><text x="70" y="170" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">p<tspan baseline-shift="sub" font-size="72%">1</tspan></text><text x="570" y="190" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">p<tspan baseline-shift="sub" font-size="72%">2</tspan></text><rect x="40" y="345" width="820" height="31.825" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="365" font-size="11.5" fill="#1f2328" text-anchor="start">Critical pressure ratio p*/p<tspan baseline-shift="sub" font-size="72%">1</tspan> = (2/(n+1))<tspan baseline-shift="super" font-size="72%">n/(n-1)</tspan>: 0.528 air (n = 1.4), 0.546 superheated steam (1.3), 0.577 wet steam (1.135)</text><rect x="40" y="385" width="820" height="49.65" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="405" font-size="11.5" fill="#1f2328" text-anchor="start">Convergent nozzle: p<tspan baseline-shift="sub" font-size="72%">2</tspan> &gt;= p* (exit never above M = 1); if back pressure &lt; p*, flow chokes and exit pressure stays at p*</text><text x="52" y="422.825" font-size="11.5" fill="#1f2328" text-anchor="start">Convergent-divergent: expand fully when back pressure is design value; over-expansion or under-expansion gives shocks outside the exit</text><text x="700" y="120" font-size="12" fill="#7c5cd8" text-anchor="start" font-weight="bold">Mass flow is maximum</text><text x="700" y="138" font-size="12" fill="#7c5cd8" text-anchor="start">at the throat (choked)</text><text x="670" y="220" font-size="12" fill="#1f2328" text-anchor="start">p falls,</text><text x="670" y="238" font-size="12" fill="#1f2328" text-anchor="start">V rises</text></svg>