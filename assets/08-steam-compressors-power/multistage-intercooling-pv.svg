t="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Two-Stage Compression with Intercooling</text><line x1="100" y1="330" x2="514" y2="330" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="100" y1="330" x2="100" y2="76" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="512" y="354" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">Volume V</text><text x="90" y="68" font-size="14" fill="#1f2328" text-anchor="start" font-style="italic">Pressure p</text><polyline points="500,303.82 490.59,303 481.18,302.13 471.78,301.21 462.37,300.23 452.96,299.19 443.55,298.09 434.15,296.92 424.74,295.67 415.33,294.33 405.92,292.9 396.52,291.36 387.11,289.71 377.7,287.92 368.29,286 358.89,283.91 349.48,281.63 340.07,279.16 330.66,276.44 321.25,273.47 311.85,270.18 302.44,266.54 293.03,262.49 283.62,257.96 274.22,252.86 264.81,247.09" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><polyline points="264.81,266.46 260.96,264.94 257.11,263.34 253.26,261.67 249.41,259.91 245.56,258.05 241.71,256.1 237.86,254.04 234.01,251.85 230.17,249.54 226.32,247.09" fill="none" stroke="#7c5cd8" stroke-width="2.5" stroke-dasharray="5 3" stroke-linejoin="round"/><polyline points="226.32,247.09 223.66,244.77 221.01,242.34 218.36,239.77 215.71,237.08 213.05,234.23 210.4,231.23 207.75,228.06 205.1,224.7 202.45,221.14 199.79,217.37 197.14,213.35 194.49,209.08 191.84,204.52 189.18,199.65 186.53,194.43 183.88,188.83 181.23,182.81 178.57,176.32 175.92,169.3 173.27,161.7 170.62,153.43 167.97,144.42 165.31,134.57 162.66,123.75 160.01,111.82" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><polyline points="500,303.82 488.67,303.05 477.33,302.25 466,301.39 454.67,300.47 443.33,299.5 432,298.46 420.67,297.34 409.34,296.14 398,294.86 386.67,293.47 375.34,291.96 364,290.33 352.67,288.55 341.34,286.61 330,284.47 318.67,282.11 307.34,279.49 296.01,276.57 284.67,273.29 273.34,269.58 262.01,265.36 250.67,260.49 239.34,254.84 228.01,248.19 216.67,240.24 205.34,230.58 194.01,218.6 182.67,203.33 171.34,183.2 160.01,155.48" fill="none" stroke="#2e8b57" stroke-width="2.5" stroke-dasharray="5 3" stroke-linejoin="round"/><polyline points="500,303.82 488.39,302.8 476.77,301.7 465.16,300.53 453.55,299.26 441.93,297.9 430.32,296.42 418.71,294.82 407.1,293.08 395.48,291.19 383.87,289.11 372.26,286.83 360.64,284.31 349.03,281.52 337.42,278.42 325.8,274.94 314.19,271.03 302.58,266.6 290.96,261.54 279.35,255.72 267.74,248.97 256.13,241.05 244.51,231.64 232.9,220.33 221.29,206.48 209.67,189.22 198.06,167.17 186.45,138.18 174.83,98.61 163.22,41.89 151.61,-45.1" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="2 3" stroke-linejoin="round"/><line x1="100" y1="247.09090909090912" x2="226.31578947368422" y2="247.09090909090912" stroke="#57606a" stroke-width="1" stroke-dasharray="4 3"/><text x="78" y="251.09090909090912" font-size="12" fill="#57606a" text-anchor="start">p<tspan baseline-shift="sub" font-size="72%">i</tspan></text><line x1="100" y1="111.81818181818181" x2="160.0087048392388" y2="111.81818181818181" stroke="#57606a" stroke-width="1" stroke-dasharray="4 3"/><text x="78" y="115.81818181818181" font-size="12" fill="#57606a" text-anchor="start">p<tspan baseline-shift="sub" font-size="72%">3</tspan></text><text x="78" y="307.8181818181818" font-size="12" fill="#57606a" text-anchor="start">p<tspan baseline-shift="sub" font-size="72%">1</tspan></text><text x="348" y="194.72727272727275" font-size="11" fill="#2e8b57" text-anchor="start" font-weight="bold">Isothermal</text><text x="360" y="264.54545454545456" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold"><tspan x="360" dy="0">Single stage</tspan><tspan x="360" dy="13.75">polytropic</tspan></text><text x="220" y="203.45454545454547" font-size="11" fill="#3b82d4" text-anchor="start" font-weight="bold"><tspan x="220" dy="0">LP + HP</tspan><tspan x="220" dy="13.75">with intercooler</tspan></text><rect x="560" y="90" width="300" height="120" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="710" y="131.7" font-size="12" fill="#1f2328" text-anchor="middle"><tspan x="710" dy="0">Intermediate pressure</tspan><tspan x="710" dy="15">p<tspan baseline-shift="sub" font-size="72%">i</tspan> = &#8730;(p<tspan baseline-shift="sub" font-size="72%">1</tspan> p<tspan baseline-shift="sub" font-size="72%">3</tspan>)  (min. work)</tspan><tspan x="710" dy="15">Stage ratio r = (p<tspan baseline-shift="sub" font-size="72%">N+1</tspan>/p<tspan baseline-shift="sub" font-size="72%">1</tspan>)<tspan baseline-shift="super" font-size="72%">1/N</tspan></tspan><tspan x="710" dy="15">W = N n/(n-1) p<tspan baseline-shift="sub" font-size="72%">1</tspan>V<tspan baseline-shift="sub" font-size="72%">1</tspan> (r<tspan baseline-shift="super" font-size="72%">(n-1)/n</tspan> - 1)</tspan></text><rect x="560" y="225" width="300" height="82.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="572" y="245" font-size="11" fill="#1f2328" text-anchor="start">Benefits of multi-staging:</text><text x="572" y="262.05" font-size="11" fill="#1f2328" text-anchor="start">lower work, lower delivery temperature,</text><text x="572" y="279.1" font-size="11" fill="#1f2328" text-anchor="start">better &#951;<tspan baseline-shift="sub" font-size="72%">v</tspan>, smaller cylinder stress</text><text x="572" y="296.15" font-size="11" fill="#1f2328" text-anchor="start">(lighter mechanical design)</text><rect x="40" y="385" width="820" height="49.65" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="405" font-size="11.5" fill="#1f2328" text-anchor="start">Perfect intercooling: air returns to initial temperature before the HP stage (T<tspan baseline-shift="sub" font-size="72%">2</tspan> = T<tspan baseline-shift="sub" font-size="72%">1</tspan>); work equal in each stage at optimum p<tspan baseline-shift="sub" font-size="72%">i</tspan></text><text x="52" y="422.825" font-size="11.5" fill="#1f2328" text-anchor="start">Isothermal efficiency = isothermal work / actual work  (compressor with water cooling jacket and intercooler)</text></svg>