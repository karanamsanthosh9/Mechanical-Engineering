<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Load Curve, Load Duration Curve and Plant Factors</text><text x="240" y="80" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Daily load curve</text><line x1="70" y1="330" x2="424" y2="330" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="70" y1="330" x2="70" y2="116" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="422" y="354" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">Time of day (0 to 24 h)</text><text x="60" y="108" font-size="14" fill="#1f2328" text-anchor="start" font-style="italic">Load</text><polygon points="70,330 70,266.36 104,275.45 138,271.82 172,220.91 206,202.73 240,211.82 274,220.91 308,193.64 342,157.27 376,202.73 410,257.27 410,330" fill="#dbeafe" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><polyline points="70,266.36 104,275.45 138,271.82 172,220.91 206,202.73 240,211.82 274,220.91 308,193.64 342,157.27 376,202.73 410,257.27" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><line x1="70" y1="157.27272727272728" x2="410" y2="157.27272727272728" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/><text x="80.8" y="153.27272727272728" font-size="11" fill="#c0392b" text-anchor="start">Peak load</text><line x1="70" y1="224.54545454545456" x2="410" y2="224.54545454545456" stroke="#2e8b57" stroke-width="1" stroke-dasharray="4 3"/><text x="80.8" y="220.54545454545456" font-size="11" fill="#2e8b57" text-anchor="start">Average load</text><text x="660" y="80" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Load duration curve</text><line x1="490" y1="330" x2="844" y2="330" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="490" y1="330" x2="490" y2="116" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="842" y="354" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">Hours (0 to 24 h, descending load)</text><text x="480" y="108" font-size="14" fill="#1f2328" text-anchor="start" font-style="italic">Load</text><polygon points="490,330 490,157.27 524,193.64 575,202.73 626,211.82 677,220.91 728,257.27 779,271.82 830,275.45 830,330" fill="#dcf3e4" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><polyline points="490,157.27 524,193.64 575,202.73 626,211.82 677,220.91 728,257.27 779,271.82 830,275.45" fill="none" stroke="#2e8b57" stroke-width="3" stroke-linejoin="round"/><text x="576.8" y="293.6363636363636" font-size="11" fill="#2e8b57" text-anchor="start" font-weight="bold">Area = energy generated</text><text x="728" y="293.6363636363636" font-size="11" fill="#3b82d4" text-anchor="start" font-weight="bold">Base load</text><rect x="40" y="365" width="820" height="65.15" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="385" font-size="11" fill="#1f2328" text-anchor="start">Load factor = average load / peak load;  Capacity factor = actual output / (rated capacity x time)</text><text x="52" y="402.05" font-size="11" fill="#1f2328" text-anchor="start">Demand factor = max demand / connected load;  Diversity factor = sum of individual maxima / simultaneous maximum</text><text x="52" y="419.1" font-size="11" fill="#1f2328" text-anchor="start">Plant use factor = output / (capacity x hours of operation);  Reserve = installed capacity - peak</text></svg>