<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Velocity Triangles: Impulse and Reaction Turbines</text><text x="230" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Inlet triangle (impulse stage)</text><line x1="90" y1="220" x2="330" y2="100" stroke="#3b82d4" stroke-width="3" marker-end="url(#ae-blue)"/><line x1="90" y1="220" x2="250" y2="220" stroke="#1f2328" stroke-width="3" marker-end="url(#ae-ink)"/><line x1="250" y1="220" x2="330" y2="100" stroke="#2e8b57" stroke-width="3" marker-end="url(#ae-green)"/><text x="215" y="150" font-size="14" fill="#3b82d4" text-anchor="start" font-weight="bold">V<tspan baseline-shift="sub" font-size="72%">1</tspan></text><text x="170" y="242" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">U (blade speed)</text><text x="310" y="170" font-size="14" fill="#2e8b57" text-anchor="start" font-weight="bold">V<tspan baseline-shift="sub" font-size="72%">r1</tspan></text><path d="M130.00,220.00 A40,40 0 0 0 125.64,201.84" fill="none" stroke="#1f2328" stroke-width="1.2" stroke-linejoin="round"/><text x="142.50797570147455" y="211.39395035178111" font-size="13" fill="#1f2328" text-anchor="middle">&#945;<tspan baseline-shift="sub" font-size="72%">1</tspan></text><path d="M278.00,220.00 A28,28 0 0 0 265.66,196.79" fill="none" stroke="#1f2328" stroke-width="1.2" stroke-linejoin="round"/><text x="278" y="214" font-size="12" fill="#1f2328" text-anchor="start">&#946;<tspan baseline-shift="sub" font-size="72%">1</tspan></text><line x1="90" y1="270" x2="330" y2="270" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="170.25" y="261" width="79.5" height="18" fill="#ffffff" opacity="0.9"/><text x="210" y="274" font-size="13" fill="#1f2328" text-anchor="middle">V<tspan baseline-shift="sub" font-size="72%">w1</tspan> (whirl)</text><text x="670" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Outlet triangle</text><line x1="560" y1="100" x2="760" y2="220" stroke="#2e8b57" stroke-width="3" marker-end="url(#ae-green)"/><line x1="840" y1="220" x2="760" y2="220" stroke="#1f2328" stroke-width="3" marker-end="url(#ae-ink)"/><line x1="840" y1="220" x2="560" y2="100" stroke="#c0392b" stroke-width="3" marker-end="url(#ae-red)"/><text x="740" y="140" font-size="14" fill="#2e8b57" text-anchor="start" font-weight="bold">V<tspan baseline-shift="sub" font-size="72%">r2</tspan></text><text x="670" y="160" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">V<tspan baseline-shift="sub" font-size="72%">2</tspan></text><text x="800" y="242" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">U</text><rect x="40" y="300" width="820" height="69.80000000000001" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="320" font-size="12" fill="#1f2328" text-anchor="start">Work per kg of steam:  W = U (V<tspan baseline-shift="sub" font-size="72%">w1</tspan> + V<tspan baseline-shift="sub" font-size="72%">w2</tspan>) ;  V<tspan baseline-shift="sub" font-size="72%">w2</tspan> is positive if it points opposite to U</text><text x="52" y="338.6" font-size="12" fill="#1f2328" text-anchor="start">Axial thrust = m (V<tspan baseline-shift="sub" font-size="72%">f1</tspan> - V<tspan baseline-shift="sub" font-size="72%">f2</tspan>);  tangential force = m (V<tspan baseline-shift="sub" font-size="72%">w1</tspan> + V<tspan baseline-shift="sub" font-size="72%">w2</tspan>)</text><text x="52" y="357.2" font-size="12" fill="#1f2328" text-anchor="start">Blade efficiency = 2 U (V<tspan baseline-shift="sub" font-size="72%">w1</tspan> + V<tspan baseline-shift="sub" font-size="72%">w2</tspan>) / V<tspan baseline-shift="sub" font-size="72%">1</tspan><tspan baseline-shift="super" font-size="72%">2</tspan></text><rect x="40" y="380" width="820" height="49.65" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="400" font-size="11.5" fill="#1f2328" text-anchor="start">Impulse (symmetrical blades, &#946;<tspan baseline-shift="sub" font-size="72%">1</tspan> = &#946;<tspan baseline-shift="sub" font-size="72%">2</tspan>, no friction): max blade efficiency at U/V<tspan baseline-shift="sub" font-size="72%">1</tspan> = cos&#945;<tspan baseline-shift="sub" font-size="72%">1</tspan> / 2,  &#951; = cos<tspan baseline-shift="super" font-size="72%">2</tspan>&#945;<tspan baseline-shift="sub" font-size="72%">1</tspan></text><text x="52" y="417.825" font-size="11.5" fill="#1f2328" text-anchor="start">Parsons reaction (50% reaction): max at U/V<tspan baseline-shift="sub" font-size="72%">1</tspan> = cos&#945;<tspan baseline-shift="sub" font-size="72%">1</tspan>, &#951; = 2cos<tspan baseline-shift="super" font-size="72%">2</tspan>&#945;<tspan baseline-shift="sub" font-size="72%">1</tspan> / (1 + cos<tspan baseline-shift="super" font-size="72%">2</tspan>&#945;<tspan baseline-shift="sub" font-size="72%">1</tspan>)</text></svg>