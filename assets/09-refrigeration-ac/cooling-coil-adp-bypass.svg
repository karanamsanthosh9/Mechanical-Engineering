ctor</tspan><tspan x="720" dy="15">BF = (t<tspan baseline-shift="sub" font-size="72%">out</tspan> - t<tspan baseline-shift="sub" font-size="72%">ADP</tspan>) / (t<tspan baseline-shift="sub" font-size="72%">in</tspan> - t<tspan baseline-shift="sub" font-size="72%">ADP</tspan>)</tspan><tspan x="720" dy="15">Contact factor  1 - BF</tspan><tspan x="720" dy="15">Deeper coil / lower velocity: smaller BF</tspan></text><rect x="580" y="225" width="280" height="82.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="592" y="245" font-size="11" fill="#1f2328" text-anchor="start">SHF = sensible / (sensible + latent)</text><text x="592" y="262.05" font-size="11" fill="#1f2328" text-anchor="start">The coil process line goes from entering</text><text x="592" y="279.1" font-size="11" fill="#1f2328" text-anchor="start">state through leaving state to ADP;</text><text x="592" y="296.15" font-size="11" fill="#1f2328" text-anchor="start">its slope is set by the SHF of the room</text><rect x="40" y="395" width="820" height="31.825" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="415" font-size="11.5" fill="#1f2328" text-anchor="start">Room SHF line on the chart through the room state; ADP found where this line (extended) meets the saturation curve</text></svg>