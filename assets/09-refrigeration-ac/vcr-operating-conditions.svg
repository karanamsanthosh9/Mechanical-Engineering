alls (smaller effect, more work)</text><text x="52" y="382.05" font-size="11" fill="#1f2328" text-anchor="start">Subcooling: no extra compressor work, effect rises, COP improves;  superheating: useful only if it cools the space</text><text x="52" y="399.1" font-size="11" fill="#1f2328" text-anchor="start">Refrigerant needs: high latent heat, low freezing point, positive evaporator pressure, low specific volume, low GWP and ODP</text></svg>