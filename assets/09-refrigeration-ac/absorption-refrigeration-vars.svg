<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Vapour Absorption Refrigeration System (NH3-Water)</text><rect x="60" y="90" width="110" height="70" rx="5" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><text x="115" y="121.7" font-size="12" fill="#1f2328" text-anchor="middle"><tspan x="115" dy="0">Generator</tspan><tspan x="115" dy="15">(heat Q<tspan baseline-shift="sub" font-size="72%">G</tspan>)</tspan></text><rect x="210" y="80" width="90" height="40" rx="5" fill="#f7f8fa" stroke="#57606a" stroke-width="1.5"/><text x="255" y="103.85" font-size="11" fill="#1f2328" text-anchor="middle">Rectifier</text><rect x="340" y="80" width="110" height="50" rx="5" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5"/><text x="395" y="109.2" font-size="12" fill="#1f2328" text-anchor="middle">Condenser</text><rect x="340" y="230" width="110" height="50" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="395" y="259.2" font-size="12" fill="#1f2328" text-anchor="middle">Evaporator</text><rect x="60" y="230" width="110" height="70" rx="5" fill="#dcf3e4" stroke="#2e8b57" stroke-width="1.5"/><text x="115" y="261.7" font-size="12" fill="#1f2328" text-anchor="middle"><tspan x="115" dy="0">Absorber</tspan><tspan x="115" dy="15">(heat out)</tspan></text><rect x="210" y="180" width="90" height="40" rx="5" fill="#e9e3fa" stroke="#7c5cd8" stroke-width="1.5"/><text x="255" y="203.85" font-size="11" fill="#1f2328" text-anchor="middle">Pump</text><line x1="170" y1="110" x2="210" y2="100" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ae-red)"/><line x1="300" y1="100" x2="340" y2="105" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ae-red)"/><line x1="450" y1="105" x2="480" y2="105" stroke="#c0392b" stroke-width="2.5"/><line x1="480" y1="105" x2="480" y2="180" stroke="#c0392b" stroke-width="2.5"/><line x1="480" y1="180" x2="395" y2="180" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ae-red)"/><line x1="395" y1="180" x2="395" y2="230" stroke="#d98a1f" stroke-width="2.5" marker-end="url(#ae-orange)"/><text x="405" y="210" font-size="10" fill="#d98a1f" text-anchor="start" font-weight="bold">expansion valve</text><line x1="340" y1="255" x2="250" y2="255" stroke="#3b82d4" stroke-width="2.5"/><line x1="250" y1="255" x2="170" y2="265" stroke="#3b82d4" stroke-width="2.5" marker-end="url(#ae-blue)"/><line x1="115" y1="230" x2="115" y2="200" stroke="#2e8b57" stroke-width="2.5"/><line x1="115" y1="200" x2="210" y2="200" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#ae-green)"/><line x1="300" y1="200" x2="330" y2="200" stroke="#2e8b57" stroke-width="0.1" marker-end="url(#ae-green)"/><line x1="255" y1="180" x2="255" y2="140" stroke="#2e8b57" stroke-width="2.5"/><line x1="255" y1="140" x2="140" y2="140" stroke="#2e8b57" stroke-width="0.1" marker-end="url(#ae-green)"/><line x1="60" y1="150" x2="30" y2="150" stroke="#d98a1f" stroke-width="2.5"/><line x1="30" y1="150" x2="30" y2="270" stroke="#d98a1f" stroke-width="2.5"/><line x1="30" y1="270" x2="60" y2="270" stroke="#d98a1f" stroke-width="2.5" marker-end="url(#ae-orange)"/><text x="110" y="70" font-size="12" fill="#d98a1f" text-anchor="start" font-weight="bold">Heat source</text><text x="395" y="70" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">Q<tspan baseline-shift="sub" font-size="72%">C</tspan></text><text x="395" y="305" font-size="12" fill="#3b82d4" text-anchor="middle" font-weight="bold">Q<tspan baseline-shift="sub" font-size="72%">E</tspan> (cooling)</text><text x="630" y="100" font-size="11.5" fill="#1f2328" text-anchor="start">Weak solution returns through</text><text x="630" y="118" font-size="11.5" fill="#1f2328" text-anchor="start">pressure-reducing valve to absorber</text><rect x="40" y="330" width="820" height="82.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="350" font-size="11" fill="#1f2328" text-anchor="start">Refrigerant NH3, absorbent water; (LiBr-water: refrigerant is water, evaporator above 0 C, used in air conditioning)</text><text x="52" y="367.05" font-size="11" fill="#1f2328" text-anchor="start">Compressor replaced by absorber + pump + generator; pump work is tiny, so the main input is heat at the generator</text><text x="52" y="384.1" font-size="11" fill="#1f2328" text-anchor="start">COP = Q<tspan baseline-shift="sub" font-size="72%">E</tspan> / (Q<tspan baseline-shift="sub" font-size="72%">G</tspan> + W<tspan baseline-shift="sub" font-size="72%">pump</tspan>); typical 0.5-1.2 (much below vapour compression), but can use waste heat or solar energy</text><text x="52" y="401.15" font-size="11" fill="#1f2328" text-anchor="start">Electrolux (three-fluid) system: no pump; NH3 + H2 + water; used in domestic refrigerators</text></svg>