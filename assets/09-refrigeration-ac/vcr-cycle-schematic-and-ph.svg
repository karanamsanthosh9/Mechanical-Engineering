(h<tspan baseline-shift="sub" font-size="72%">1</tspan> - h<tspan baseline-shift="sub" font-size="72%">4</tspan>) / (h<tspan baseline-shift="sub" font-size="72%">2</tspan> - h<tspan baseline-shift="sub" font-size="72%">1</tspan>);   1 ton of refrigeration = 3.517 kW = 211 kJ/min</text><text x="52" y="387.825" font-size="11.5" fill="#1f2328" text-anchor="start">Throttling is irreversible, so a flash vapour fraction appears at 4; the process 1-2 is isentropic in the ideal cycle</text><text x="52" y="405.65" font-size="11.5" fill="#1f2328" text-anchor="start">Subcooling raises refrigerating effect; superheating at the evaporator raises it but also work; higher condenser pressure lowers COP</text></svg>