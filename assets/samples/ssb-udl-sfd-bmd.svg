<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="900" height="860" fill="#ffffff"/><text x="450" y="32" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="bold">Simply Supported Beam with UDL: SFD and BMD</text><line x1="150" y1="96" x2="750" y2="96" stroke="#c0392b" stroke-width="1.5"/><line x1="150" y1="96" x2="150" y2="122" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="200" y1="96" x2="200" y2="122" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="250" y1="96" x2="250" y2="122" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="300" y1="96" x2="300" y2="122" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="350" y1="96" x2="350" y2="122" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="400" y1="96" x2="400" y2="122" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="450" y1="96" x2="450" y2="122" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="500" y1="96" x2="500" y2="122" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="550" y1="96" x2="550" y2="122" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="600" y1="96" x2="600" y2="122" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="650" y1="96" x2="650" y2="122" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="700" y1="96" x2="700" y2="122" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="750" y1="96" x2="750" y2="122" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="150" y1="130" x2="750" y2="130" stroke="#1f2328" stroke-width="6"/><path d="M150,133 l-14,24 h28 z" fill="#e5e7eb" stroke="#1f2328" stroke-width="1.5"/><line x1="128" y1="157" x2="172" y2="157" stroke="#1f2328" stroke-width="1.5"/><path d="M750,133 l-14,20 h28 z" fill="#e5e7eb" stroke="#1f2328" stroke-width="1.5"/><circle cx="743" cy="158" r="5" fill="#fff" stroke="#1f2328" stroke-width="1.5"/><circle cx="757" cy="158" r="5" fill="#fff" stroke="#1f2328" stroke-width="1.5"/><line x1="728" y1="163" x2="772" y2="163" stroke="#1f2328" stroke-width="1.5"/><text x="450" y="84" font-size="13" fill="#c0392b" text-anchor="middle">w per unit length</text><line x1="450" y1="200" x2="150" y2="200" stroke="#1f2328" stroke-width="1.5" marker-end="url(#ah)"/><line x1="450" y1="200" x2="750" y2="200" stroke="#1f2328" stroke-width="1.5" marker-end="url(#ah)"/><rect x="438" y="188" width="24" height="20" fill="#ffffff"/><text x="450" y="204" font-size="14" fill="#1f2328" text-anchor="middle" font-style="italic">L</text><line x1="150" y1="176" x2="150" y2="208" stroke="#57606a" stroke-width="1"/><line x1="750" y1="176" x2="750" y2="208" stroke="#57606a" stroke-width="1"/><text x="130" y="138" font-size="14" fill="#1f2328" text-anchor="end" font-weight="bold">A</text><text x="770" y="138" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">B</text><text x="150" y="236" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">R_A = wL/2</text><text x="750" y="236" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">R_B = wL/2</text><text x="40" y="290" font-size="15" fill="#3b82d4" text-anchor="start" font-weight="bold">Shear Force Diagram (SFD)</text><line x1="130" y1="400" x2="770" y2="400" stroke="#57606a" stroke-width="1"/><path d="M150,400 L150,330 L750,470 L750,400 Z" fill="#dbeafe" stroke="#3b82d4" stroke-width="2"/><text x="158" y="322" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">+ wL/2</text><text x="742" y="488" font-size="13" fill="#1f2328" text-anchor="end" font-weight="bold">- wL/2</text><text x="458" y="392" font-size="12" fill="#57606a" text-anchor="start">V = 0 at x = L/2</text><text x="122" y="404" font-size="12" fill="#57606a" text-anchor="end">0</text><text x="450" y="526" font-size="13" fill="#1f2328" text-anchor="middle">V(x) = wL/2 - wx   (straight line, slope = -w)</text><text x="40" y="628" font-size="15" fill="#3b82d4" text-anchor="start" font-weight="bold">Bending Moment Diagram (BMD): sagging positive, plotted upwards</text><line x1="130" y1="770" x2="770" y2="770" stroke="#57606a" stroke-width="1"/><path d="M150,770 Q450,610 750,770 Z" fill="#fde2e0" stroke="#c0392b" stroke-width="2"/><line x1="450" y1="770" x2="450" y2="690" stroke="#1f2328" stroke-width="1" stroke-dasharray="4 3"/><text x="450" y="680" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">M_max = wL^2/8  at x = L/2</text><text x="122" y="774" font-size="12" fill="#57606a" text-anchor="end">0</text><text x="778" y="774" font-size="12" fill="#57606a" text-anchor="start">0</text><text x="450" y="804" font-size="13" fill="#1f2328" text-anchor="middle">M(x) = wLx/2 - wx^2/2   (parabola; M_max where V = 0; dM/dx = V)</text><text x="450" y="826" font-size="12" fill="#57606a" text-anchor="middle">Point of contraflexure: none (M is never negative)</text></svg>