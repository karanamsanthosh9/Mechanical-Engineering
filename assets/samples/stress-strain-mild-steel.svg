<svg xmlns="http://www.w3.org/2000/svg" width="900" height="790" viewBox="0 0 900 790" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="900" height="790" fill="#ffffff"/><text x="450" y="32" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="bold">Stress-Strain Curve of Mild Steel (ductile material)</text><line x1="110" y1="520" x2="820" y2="520" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><line x1="110" y1="520" x2="110" y2="80" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><text x="820" y="548" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">Strain (e)</text><text x="124" y="76" font-size="14" fill="#1f2328" text-anchor="start" font-style="italic">Stress (sigma)</text><text x="102" y="536" font-size="14" fill="#1f2328" text-anchor="end" font-weight="bold">O</text><path d="M110,520 L190,330 L200,322 L235,262 L250,295 L270,290 L290,298 L330,292 C400,230 480,150 560,150 C620,150 670,190 700,235" fill="none" stroke="#3b82d4" stroke-width="3"/><path d="M560,150 C620,140 670,125 700,120" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="708" y="124" font-size="12" fill="#57606a" text-anchor="start">true stress</text><circle cx="190" cy="330" r="5" fill="#c0392b"/><text x="178" y="334" font-size="14" fill="#1f2328" text-anchor="end" font-weight="bold">A</text><circle cx="235" cy="262" r="5" fill="#c0392b"/><text x="225" y="256" font-size="14" fill="#1f2328" text-anchor="end" font-weight="bold">B</text><circle cx="250" cy="295" r="5" fill="#c0392b"/><text x="258" y="313" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">C</text><circle cx="560" cy="150" r="5" fill="#c0392b"/><text x="560" y="136" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">D</text><circle cx="700" cy="235" r="5" fill="#c0392b"/><text x="710" y="249" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">E</text><line x1="560" y1="150" x2="560" y2="520" stroke="#57606a" stroke-width="1" stroke-dasharray="4 3"/><line x1="110" y1="150" x2="560" y2="150" stroke="#57606a" stroke-width="1" stroke-dasharray="4 3"/><line x1="700" y1="235" x2="700" y2="520" stroke="#57606a" stroke-width="1" stroke-dasharray="4 3"/><text x="118" y="144" font-size="12" fill="#57606a" text-anchor="start">UTS</text><text x="270" y="510" font-size="12" fill="#57606a" text-anchor="middle">Yielding</text><text x="430" y="510" font-size="12" fill="#57606a" text-anchor="middle">Strain hardening</text><text x="630" y="510" font-size="12" fill="#57606a" text-anchor="middle">Necking</text><line x1="335" y1="496" x2="335" y2="520" stroke="#e5e7eb" stroke-width="1"/><line x1="110" y1="532" x2="190" y2="532" stroke="#3b82d4" stroke-width="3"/><text x="110" y="550" font-size="12" fill="#3b82d4" text-anchor="start">Elastic</text><rect x="110" y="592" width="640" height="116" fill="#f7f8fa" stroke="#e5e7eb"/><text x="124" y="612" font-size="13" fill="#1f2328" text-anchor="start">A  Proportional limit (Hooke's law ends; stress is proportional to strain)</text><text x="124" y="633" font-size="13" fill="#1f2328" text-anchor="start">B  Upper yield point (sudden drop begins)</text><text x="124" y="654" font-size="13" fill="#1f2328" text-anchor="start">C  Lower yield point (stress stays about constant while strain rises)</text><text x="124" y="675" font-size="13" fill="#1f2328" text-anchor="start">D  Ultimate tensile strength, UTS (maximum nominal stress)</text><text x="124" y="696" font-size="13" fill="#1f2328" text-anchor="start">E  Fracture / breaking point (nominal stress falls because of necking)</text><text x="450" y="774" font-size="12" fill="#57606a" text-anchor="middle">Slope of OA = Young's modulus E. Elastic limit is very close to A. Brittle materials show no yield point.</text></svg>