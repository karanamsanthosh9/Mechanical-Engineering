<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1010" viewBox="0 0 900 1010" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="900" height="1010" fill="#ffffff"/><text x="450" y="32" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="bold">Types of Beams (by support condition)</text><text x="40" y="70" font-size="15" fill="#3b82d4" text-anchor="start" font-weight="bold">1. Simply supported beam</text><text x="40" y="88" font-size="12" fill="#57606a" text-anchor="start">Pin at one end, roller at the other. Statically determinate (3 reactions: R_A, H_A, R_B).</text><line x1="300" y1="170" x2="700" y2="170" stroke="#1f2328" stroke-width="6"/><path d="M300,173 l-14,24 h28 z" fill="#e5e7eb" stroke="#1f2328" stroke-width="1.5"/><line x1="278" y1="197" x2="322" y2="197" stroke="#1f2328" stroke-width="1.5"/><path d="M700,173 l-14,20 h28 z" fill="#e5e7eb" stroke="#1f2328" stroke-width="1.5"/><circle cx="693" cy="198" r="5" fill="#fff" stroke="#1f2328" stroke-width="1.5"/><circle cx="707" cy="198" r="5" fill="#fff" stroke="#1f2328" stroke-width="1.5"/><line x1="678" y1="203" x2="722" y2="203" stroke="#1f2328" stroke-width="1.5"/><line x1="500" y1="122" x2="500" y2="166" stroke="#c0392b" stroke-width="2" marker-end="url(#ahr)"/><text x="500" y="116" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">W</text><line x1="40" y1="208" x2="860" y2="208" stroke="#e5e7eb" stroke-width="1"/><text x="40" y="220" font-size="15" fill="#3b82d4" text-anchor="start" font-weight="bold">2. Cantilever beam</text><text x="40" y="238" font-size="12" fill="#57606a" text-anchor="start">Fixed at one end, free at the other. Statically determinate (V, H, M at the wall).</text><line x1="300" y1="292" x2="300" y2="348" stroke="#1f2328" stroke-width="3"/><line x1="300" y1="300" x2="290" y2="292" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="308" x2="290" y2="300" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="316" x2="290" y2="308" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="324" x2="290" y2="316" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="332" x2="290" y2="324" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="340" x2="290" y2="332" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="348" x2="290" y2="340" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="320" x2="700" y2="320" stroke="#1f2328" stroke-width="6"/><line x1="700" y1="272" x2="700" y2="316" stroke="#c0392b" stroke-width="2" marker-end="url(#ahr)"/><text x="700" y="266" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">W</text><text x="700" y="348" font-size="12" fill="#57606a" text-anchor="middle">free end</text><line x1="40" y1="358" x2="860" y2="358" stroke="#e5e7eb" stroke-width="1"/><text x="40" y="370" font-size="15" fill="#3b82d4" text-anchor="start" font-weight="bold">3. Overhanging beam</text><text x="40" y="388" font-size="12" fill="#57606a" text-anchor="start">Simply supported with one or both ends projecting beyond a support. Determinate.</text><line x1="260" y1="470" x2="720" y2="470" stroke="#1f2328" stroke-width="6"/><path d="M360,473 l-14,24 h28 z" fill="#e5e7eb" stroke="#1f2328" stroke-width="1.5"/><line x1="338" y1="497" x2="382" y2="497" stroke="#1f2328" stroke-width="1.5"/><path d="M600,473 l-14,20 h28 z" fill="#e5e7eb" stroke="#1f2328" stroke-width="1.5"/><circle cx="593" cy="498" r="5" fill="#fff" stroke="#1f2328" stroke-width="1.5"/><circle cx="607" cy="498" r="5" fill="#fff" stroke="#1f2328" stroke-width="1.5"/><line x1="578" y1="503" x2="622" y2="503" stroke="#1f2328" stroke-width="1.5"/><line x1="720" y1="422" x2="720" y2="466" stroke="#c0392b" stroke-width="2" marker-end="url(#ahr)"/><text x="720" y="416" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">W</text><line x1="260" y1="422" x2="260" y2="466" stroke="#c0392b" stroke-width="2" marker-end="url(#ahr)"/><text x="260" y="416" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">W</text><text x="300" y="494" font-size="12" fill="#57606a" text-anchor="middle">overhang</text><text x="690" y="494" font-size="12" fill="#57606a" text-anchor="middle">overhang</text><line x1="40" y1="508" x2="860" y2="508" stroke="#e5e7eb" stroke-width="1"/><text x="40" y="520" font-size="15" fill="#3b82d4" text-anchor="start" font-weight="bold">4. Fixed (built-in) beam</text><text x="40" y="538" font-size="12" fill="#57606a" text-anchor="start">Both ends fixed. Indeterminate to the 3rd degree (2nd degree for vertical loads only).</text><line x1="300" y1="592" x2="300" y2="648" stroke="#1f2328" stroke-width="3"/><line x1="300" y1="600" x2="290" y2="592" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="608" x2="290" y2="600" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="616" x2="290" y2="608" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="624" x2="290" y2="616" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="632" x2="290" y2="624" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="640" x2="290" y2="632" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="648" x2="290" y2="640" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="620" x2="700" y2="620" stroke="#1f2328" stroke-width="6"/><line x1="700" y1="592" x2="700" y2="648" stroke="#1f2328" stroke-width="3"/><line x1="700" y1="600" x2="710" y2="592" stroke="#1f2328" stroke-width="1"/><line x1="700" y1="608" x2="710" y2="600" stroke="#1f2328" stroke-width="1"/><line x1="700" y1="616" x2="710" y2="608" stroke="#1f2328" stroke-width="1"/><line x1="700" y1="624" x2="710" y2="616" stroke="#1f2328" stroke-width="1"/><line x1="700" y1="632" x2="710" y2="624" stroke="#1f2328" stroke-width="1"/><line x1="700" y1="640" x2="710" y2="632" stroke="#1f2328" stroke-width="1"/><line x1="700" y1="648" x2="710" y2="640" stroke="#1f2328" stroke-width="1"/><line x1="500" y1="572" x2="500" y2="616" stroke="#c0392b" stroke-width="2" marker-end="url(#ahr)"/><text x="500" y="566" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">W</text><line x1="40" y1="658" x2="860" y2="658" stroke="#e5e7eb" stroke-width="1"/><text x="40" y="670" font-size="15" fill="#3b82d4" text-anchor="start" font-weight="bold">5. Propped cantilever</text><text x="40" y="688" font-size="12" fill="#57606a" text-anchor="start">Fixed at one end, roller/prop at the other. Statically indeterminate to the 1st degree.</text><line x1="300" y1="742" x2="300" y2="798" stroke="#1f2328" stroke-width="3"/><line x1="300" y1="750" x2="290" y2="742" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="758" x2="290" y2="750" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="766" x2="290" y2="758" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="774" x2="290" y2="766" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="782" x2="290" y2="774" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="790" x2="290" y2="782" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="798" x2="290" y2="790" stroke="#1f2328" stroke-width="1"/><line x1="300" y1="770" x2="700" y2="770" stroke="#1f2328" stroke-width="6"/><path d="M700,773 l-14,20 h28 z" fill="#e5e7eb" stroke="#1f2328" stroke-width="1.5"/><circle cx="693" cy="798" r="5" fill="#fff" stroke="#1f2328" stroke-width="1.5"/><circle cx="707" cy="798" r="5" fill="#fff" stroke="#1f2328" stroke-width="1.5"/><line x1="678" y1="803" x2="722" y2="803" stroke="#1f2328" stroke-width="1.5"/><line x1="312" y1="736" x2="688" y2="736" stroke="#c0392b" stroke-width="1.5"/><line x1="312" y1="736" x2="312" y2="762" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="359" y1="736" x2="359" y2="762" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="406" y1="736" x2="406" y2="762" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="453" y1="736" x2="453" y2="762" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="500" y1="736" x2="500" y2="762" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="547" y1="736" x2="547" y2="762" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="594" y1="736" x2="594" y2="762" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="641" y1="736" x2="641" y2="762" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="688" y1="736" x2="688" y2="762" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ahr)"/><line x1="40" y1="808" x2="860" y2="808" stroke="#e5e7eb" stroke-width="1"/><text x="40" y="820" font-size="15" fill="#3b82d4" text-anchor="start" font-weight="bold">6. Continuous beam</text><text x="40" y="838" font-size="12" fill="#57606a" text-anchor="start">More than two supports. Indeterminate; solved by Clapeyron three-moment equation.</text><line x1="240" y1="920" x2="760" y2="920" stroke="#1f2328" stroke-width="6"/><path d="M240,923 l-14,24 h28 z" fill="#e5e7eb" stroke="#1f2328" stroke-width="1.5"/><line x1="218" y1="947" x2="262" y2="947" stroke="#1f2328" stroke-width="1.5"/><path d="M400,923 l-14,20 h28 z" fill="#e5e7eb" stroke="#1f2328" stroke-width="1.5"/><circle cx="393" cy="948" r="5" fill="#fff" stroke="#1f2328" stroke-width="1.5"/><circle cx="407" cy="948" r="5" fill="#fff" stroke="#1f2328" stroke-width="1.5"/><line x1="378" y1="953" x2="422" y2="953" stroke="#1f2328" stroke-width="1.5"/><path d="M560,923 l-14,20 h28 z" fill="#e5e7eb" stroke="#1f2328" stroke-width="1.5"/><circle cx="553" cy="948" r="5" fill="#fff" stroke="#1f2328" stroke-width="1.5"/><circle cx="567" cy="948" r="5" fill="#fff" stroke="#1f2328" stroke-width="1.5"/><line x1="538" y1="953" x2="582" y2="953" stroke="#1f2328" stroke-width="1