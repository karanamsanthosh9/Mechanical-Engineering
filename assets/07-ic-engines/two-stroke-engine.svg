<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Two-Stroke Engine: Crankcase-Scavenged Port Type</text><rect x="120" y="90" width="100" height="200" fill="#f7f8fa" stroke="#1f2328" stroke-width="3"/><rect x="120" y="290" width="100" height="70" fill="#dbeafe" stroke="#3b82d4" stroke-width="2"/><rect x="124" y="150" width="92" height="22" fill="#fdecc8" stroke="#1f2328" stroke-width="2"/><line x1="170" y1="172" x2="170" y2="300" stroke="#57606a" stroke-width="3"/><circle cx="170" cy="310" r="12" fill="none" stroke="#57606a" stroke-width="2"/><line x1="40" y1="270" x2="120" y2="270" stroke="#3b82d4" stroke-width="2.5" marker-end="url(#ae-blue)"/><text x="40" y="258" font-size="12" fill="#3b82d4" text-anchor="start" font-weight="bold">inlet port</text><line x1="220" y1="240" x2="220" y2="200" stroke="#7c5cd8" stroke-width="2" marker-end="url(#ae-purple)"/><text x="230" y="230" font-size="12" fill="#7c5cd8" text-anchor="start" font-weight="bold">transfer port</text><line x1="220" y1="130" x2="290" y2="130" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ae-red)"/><text x="230" y="120" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">exhaust port</text><text x="170" y="380" font-size="12" fill="#3b82d4" text-anchor="middle">Crankcase (pre-compression)</text><text x="170" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Piston near TDC</text><rect x="420" y="90" width="100" height="200" fill="#f7f8fa" stroke="#1f2328" stroke-width="3"/><rect x="420" y="290" width="100" height="70" fill="#dbeafe" stroke="#3b82d4" stroke-width="2"/><rect x="424" y="230" width="92" height="22" fill="#fdecc8" stroke="#1f2328" stroke-width="2"/><line x1="470" y1="252" x2="470" y2="300" stroke="#57606a" stroke-width="3"/><circle cx="470" cy="310" r="12" fill="none" stroke="#57606a" stroke-width="2"/><line x1="520" y1="130" x2="590" y2="130" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ae-red)"/><line x1="520" y1="240" x2="520" y2="180" stroke="#7c5cd8" stroke-width="2" marker-end="url(#ae-purple)"/><line x1="430" y1="210" x2="430" y2="160" stroke="#2e8b57" stroke-width="2" marker-end="url(#ae-green)"/><text x="470" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Piston at BDC</text><rect x="620" y="90" width="260" height="120.94999999999999" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="632" y="110" font-size="11.5" fill="#1f2328" text-anchor="start">Strokes per cycle: 2 (1 revolution)</text><text x="632" y="127.825" font-size="11.5" fill="#1f2328" text-anchor="start">Power stroke every revolution</text><text x="632" y="145.65" font-size="11.5" fill="#1f2328" text-anchor="start">Scavenging: fresh charge pushes out</text><text x="632" y="163.475" font-size="11.5" fill="#1f2328" text-anchor="start">burnt gas (loop, cross or uniflow)</text><text x="632" y="181.3" font-size="11.5" fill="#1f2328" text-anchor="start">Fuel loss through exhaust port in</text><text x="632" y="199.125" font-size="11.5" fill="#1f2328" text-anchor="start">petrol two-strokes</text><rect x="40" y="400" width="820" height="49.65" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="420" font-size="11.5" fill="#1f2328" text-anchor="start">Versus 4-stroke of same size: about 1.6-1.8 times the power (not 2 times, scavenging loss), simpler, more fuel and emissions</text><text x="52" y="437.825" font-size="11.5" fill="#1f2328" text-anchor="start">Mixed (petrol-oil) lubrication in small SI two-strokes; diesel two-strokes use a blower and exhaust valves (uniflow)</text></svg>