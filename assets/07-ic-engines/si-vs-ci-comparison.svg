<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">SI versus CI Engine: Key Differences</text><rect x="50" y="70" width="380" height="330" rx="6" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><rect x="470" y="70" width="380" height="330" rx="6" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><text x="240" y="98" font-size="15" fill="#3b82d4" text-anchor="middle" font-weight="bold">SI engine (petrol)</text><text x="660" y="98" font-size="15" fill="#d98a1f" text-anchor="middle" font-weight="bold">CI engine (diesel)</text><text x="240" y="126" font-size="12" fill="#1f2328" text-anchor="middle">Otto (constant volume)</text><text x="660" y="126" font-size="12" fill="#1f2328" text-anchor="middle">Diesel / Dual</text><text x="60" y="140" font-size="10" fill="#57606a" text-anchor="start">Cycle</text><text x="240" y="156" font-size="12" fill="#1f2328" text-anchor="middle">Air + fuel (carburetor / MPFI)</text><text x="660" y="156" font-size="12" fill="#1f2328" text-anchor="middle">Air only</text><text x="60" y="170" font-size="10" fill="#57606a" text-anchor="start">Charge in suction</text><text x="240" y="186" font-size="12" fill="#1f2328" text-anchor="middle">Spark plug</text><text x="660" y="186" font-size="12" fill="#1f2328" text-anchor="middle">Compression (auto-ignition)</text><text x="60" y="200" font-size="10" fill="#57606a" text-anchor="start">Ignition</text><text x="240" y="216" font-size="12" fill="#1f2328" text-anchor="middle">6 to 10</text><text x="660" y="216" font-size="12" fill="#1f2328" text-anchor="middle">14 to 22</text><text x="60" y="230" font-size="10" fill="#57606a" text-anchor="start">Compression ratio</text><text x="240" y="246" font-size="12" fill="#1f2328" text-anchor="middle">High octane number</text><text x="660" y="246" font-size="12" fill="#1f2328" text-anchor="middle">High cetane number</text><text x="60" y="260" font-size="10" fill="#57606a" text-anchor="start">Fuel property</text><text x="240" y="276" font-size="12" fill="#1f2328" text-anchor="middle">Quantity governing (throttle)</text><text x="660" y="276" font-size="12" fill="#1f2328" text-anchor="middle">Quality governing (fuel amount)</text><text x="60" y="290" font-size="10" fill="#57606a" text-anchor="start">Load control</text><text x="240" y="306" font-size="12" fill="#1f2328" text-anchor="middle">Knock (end gas auto-ignites)</text><text x="660" y="306" font-size="12" fill="#1f2328" text-anchor="middle">Diesel knock (long delay period)</text><text x="60" y="320" font-size="10" fill="#57606a" text-anchor="start">Abnormal combustion</text><text x="240" y="336" font-size="12" fill="#1f2328" text-anchor="middle">Lower (lower r)</text><text x="660" y="336" font-size="12" fill="#1f2328" text-anchor="middle">Higher (higher r)</text><text x="60" y="350" font-size="10" fill="#57606a" text-anchor="start">Thermal efficiency</text><text x="240" y="366" font-size="12" fill="#1f2328" text-anchor="middle">Lighter, cheaper</text><text x="660" y="366" font-size="12" fill="#1f2328" text-anchor="middle">Heavier, costlier</text><text x="60" y="380" font-size="10" fill="#57606a" text-anchor="start">Weight / cost</text><rect x="50" y="415" width="800" height="32.6" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="62" y="435" font-size="12" fill="#1f2328" text-anchor="start">Same compression ratio: Otto is more efficient than Diesel; in practice diesel wins because its r is much higher</text></svg>