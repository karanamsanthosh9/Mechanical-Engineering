<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Valve Timing Diagram (Four-Stroke SI Engine)</text><circle cx="330" cy="265" r="150" fill="none" stroke="#e5e7eb" stroke-width="1"/><line x1="140" y1="265" x2="520" y2="265" stroke="#57606a" stroke-width="1" stroke-dasharray="4 3"/><line x1="330" y1="100" x2="330" y2="430" stroke="#57606a" stroke-width="1" stroke-dasharray="4 3"/><text x="330" y="93" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">TDC</text><text x="330" y="455" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">BDC</text><path d="M352.23,138.94 A128,128 0 1 0 412.28,363.05" fill="none" stroke="#3b82d4" stroke-width="7" stroke-linejoin="round"/><path d="M253.63,341.37 A108,108 0 1 0 302.05,160.68" fill="none" stroke="#c0392b" stroke-width="7" stroke-linejoin="round"/><path d="M356.05,117.28 A150,150 0 0 0 291.18,120.11" fill="none" stroke="#7c5cd8" stroke-width="5" stroke-linejoin="round"/><line x1="352.2269667413671" y1="138.94460761443736" x2="420" y2="80" stroke="#3b82d4" stroke-width="1"/><text x="424" y="84" font-size="11" fill="#3b82d4" text-anchor="start" font-weight="bold">IVO: 10 deg before TDC</text><line x1="302.04754312892777" y1="160.68001076078062" x2="270" y2="80" stroke="#c0392b" stroke-width="1"/><text x="266" y="84" font-size="11" fill="#c0392b" text-anchor="end" font-weight="bold">EVC: 15 deg after TDC</text><line x1="412.276814039877" y1="363.05368871922917" x2="520" y2="390" stroke="#3b82d4" stroke-width="1"/><text x="524" y="394" font-size="11" fill="#3b82d4" text-anchor="start" font-weight="bold">IVC: 40 deg after BDC</text><line x1="253.63246763185285" y1="341.3675323681471" x2="180" y2="415" stroke="#c0392b" stroke-width="1"/><text x="176" y="419" font-size="11" fill="#c0392b" text-anchor="end" font-weight="bold">EVO: 45 deg before BDC</text><text x="330" y="225" font-size="11" fill="#7c5cd8" text-anchor="middle" font-weight="bold">Valve overlap (purple)</text><text x="330" y="241" font-size="11" fill="#7c5cd8" text-anchor="middle">about 25 deg near TDC</text><text x="330" y="295" font-size="11" fill="#57606a" text-anchor="middle">Crank angle rotation</text><text x="330" y="311" font-size="11" fill="#57606a" text-anchor="middle">counter-clockwise here</text><text x="620" y="110" font-size="12" fill="#1f2328" text-anchor="start">Blue arc: inlet valve open</text><text x="620" y="130" font-size="12" fill="#1f2328" text-anchor="start">Red arc: exhaust valve open</text><rect x="600" y="200" width="280" height="133.35000000000002" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="612" y="220" font-size="11" fill="#1f2328" text-anchor="start">Reasons for early opening and late closing:</text><text x="612" y="237.05" font-size="11" fill="#1f2328" text-anchor="start">Inlet: IVO before TDC lets valve open</text><text x="612" y="254.1" font-size="11" fill="#1f2328" text-anchor="start">fully when suction begins; IVC after</text><text x="612" y="271.15" font-size="11" fill="#1f2328" text-anchor="start">BDC uses ram effect of inflow</text><text x="612" y="288.2" font-size="11" fill="#1f2328" text-anchor="start">Exhaust: EVO before BDC lets pressure</text><text x="612" y="305.25" font-size="11" fill="#1f2328" text-anchor="start">fall so less back work</text><text x="612" y="322.3" font-size="11" fill="#1f2328" text-anchor="start">Overlap: scavenging and cooling</text></svg>