<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="520" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Stress-Strain Curves: Ductile, Brittle and Offset Yield</text><line x1="100" y1="400" x2="754" y2="400" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><line x1="100" y1="400" x2="100" y2="86" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)"/><text x="752" y="424" font-size="14" fill="#1f2328" text-anchor="end" font-style="italic">Strain</text><text x="90" y="78" font-size="14" fill="#1f2328" text-anchor="start" font-style="italic">Stress</text><polyline points="100,400 176.8,256 189.6,244 208.8,265 253.6,262 304.8,256 484,172 573.6,157 663.2,202" fill="none" stroke="#3b82d4" stroke-width="3" stroke-linejoin="round"/><text x="513.2" y="166.00000000000003" font-size="13" fill="#3b82d4" text-anchor="start" font-weight="bold">Mild steel (ductile)</text><polyline points="100,400 170.4,280 228,220 324,178 484,148 612,154" fill="none" stroke="#2e8b57" stroke-width="2.5" stroke-linejoin="round"/><text x="454" y="135.99999999999997" font-size="13" fill="#2e8b57" text-anchor="start" font-weight="bold">Aluminium (no yield point)</text><polyline points="100,400 151.2,322 170.4,307" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/><circle cx="170.4" cy="307" r="4.5" fill="#c0392b"/><text x="182.4" y="325" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">Cast iron (brittle)</text><line x1="228" y1="400" x2="228" y2="262" stroke="#57606a" stroke-width="1" stroke-dasharray="4 3"/><text x="222" y="418" font-size="11" fill="#57606a" text-anchor="middle">0.002</text><polyline points="112.8,400 314.4,211" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round"/><text x="325.59999999999997" y="225" font-size="12" fill="#57606a" text-anchor="start">0.2% offset line</text><rect x="100" y="440" width="700" height="51.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="112" y="460" font-size="12" fill="#1f2328" text-anchor="start">Offset method: draw a line parallel to the elastic part from 0.002 strain; its intersection gives the proof (yield) stress</text><text x="112" y="478.6" font-size="12" fill="#1f2328" text-anchor="start">Ductile: large plastic strain before failure, necking.  Brittle: fracture with almost no plastic strain.</text></svg>