<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Bending Stress Distribution and Neutral Axis</text><text x="200" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Beam element in bending</text><path d="M80,150 Q200,110 320,150 L320,250 Q200,210 80,250 Z" fill="#dbeafe" stroke="#3b82d4" stroke-width="2" stroke-linejoin="round"/><path d="M80,200 Q200,160 320,200" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/><text x="330" y="196" font-size="12" fill="#c0392b" text-anchor="start">Neutral axis</text><path d="M72.00,179.22 A24,24 0 1 0 80.78,212.00" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)" stroke-linejoin="round"/><path d="M360.78,212.00 A24,24 0 1 1 352.00,179.22" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#ae-ink)" stroke-linejoin="round"/><text x="200" y="300" font-size="12" fill="#1f2328" text-anchor="middle">Top fibres: compression (sagging)</text><text x="200" y="320" font-size="12" fill="#1f2328" text-anchor="middle">Bottom fibres: tension</text><text x="200" y="350" font-size="12" fill="#57606a" text-anchor="middle">Strain &#949; = y / R   (plane sections remain plane)</text><line x1="440" y1="60" x2="440" y2="440" stroke="#e5e7eb" stroke-width="1"/><text x="660" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Stress across the depth</text><rect x="540" y="120" width="70" height="200" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><line x1="520" y1="220" x2="760" y2="220" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="765" y="224" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">NA</text><polygon points="700,220 700,120 770,120" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5" stroke-linejoin="round"/><polygon points="700,220 700,320 630,320" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5" stroke-linejoin="round"/><text x="735" y="108" font-size="12" fill="#c0392b" text-anchor="middle">&#963;<tspan baseline-shift="sub" font-size="72%">max</tspan> (compression)</text><text x="572" y="342" font-size="12" fill="#3b82d4" text-anchor="start">&#963;<tspan baseline-shift="sub" font-size="72%">max</tspan> (tension)</text><line x1="525" y1="120" x2="525" y2="320" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="517.425" y="211" width="15.15" height="18" fill="#ffffff" opacity="0.9"/><text x="525" y="224" font-size="13" fill="#1f2328" text-anchor="middle">h</text><line x1="540" y1="360" x2="610" y2="360" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="567.425" y="351" width="15.15" height="18" fill="#ffffff" opacity="0.9"/><text x="575" y="364" font-size="13" fill="#1f2328" text-anchor="middle">b</text><line x1="620" y1="220" x2="620" y2="120" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="612.425" y="161" width="15.15" height="18" fill="#ffffff" opacity="0.9"/><text x="620" y="174" font-size="13" fill="#1f2328" text-anchor="middle">y</text><rect x="470" y="385" width="410" height="51.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="482" y="405" font-size="12" fill="#1f2328" text-anchor="start">Flexure formula: M / I = &#963; / y = E / R</text><text x="482" y="423.6" font-size="12" fill="#1f2328" text-anchor="start">&#963; = M y / I ;  &#963;<tspan baseline-shift="sub" font-size="72%">max</tspan> = M / Z ,  Z = I / y<tspan baseline-shift="sub" font-size="72%">max</tspan></text></svg>