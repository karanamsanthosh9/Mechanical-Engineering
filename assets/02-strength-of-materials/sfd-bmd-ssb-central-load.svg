oke-width="1"/><line x1="735" y1="181" x2="728" y2="190" stroke="#1f2328" stroke-width="1"/><line x1="744" y1="181" x2="737" y2="190" stroke="#1f2328" stroke-width="1"/><line x1="753" y1="181" x2="746" y2="190" stroke="#1f2328" stroke-width="1"/><line x1="762" y1="181" x2="755" y2="190" stroke="#1f2328" stroke-width="1"/><line x1="771" y1="181" x2="764" y2="190" stroke="#1f2328" stroke-width="1"/><line x1="450" y1="106" x2="450" y2="147" stroke="#c0392b" stroke-width="2" marker-end="url(#ae-red)"/><text x="450" y="100" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">W</text><text x="150" y="258" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">R<tspan baseline-shift="sub" font-size="72%">A</tspan> = W/2</text><text x="750" y="258" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">R<tspan baseline-shift="sub" font-size="72%">B</tspan> = W/2</text><line x1="150" y1="224" x2="750" y2="224" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="442.425" y="215" width="15.15" height="18" fill="#ffffff" opacity="0.9"/><text x="450" y="228" font-size="13" fill="#1f2328" text-anchor="middle">L</text><text x="40" y="276" font-size="15" fill="#3b82d4" text-anchor="start" font-weight="bold">Shear Force Diagram (SFD)</text><line x1="130" y1="380" x2="770" y2="380" stroke="#57606a" stroke-width="1"/><polygon points="150,380 150,310 450,310 450,450 750,450 750,380" fill="#dbeafe" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><polyline points="150,310 450,310 450,450 750,450" fill="none" stroke="#3b82d4" stroke-width="2.2" stroke-linejoin="round"/><text x="40" y="526" font-size="15" fill="#3b82d4" text-anchor="start" font-weight="bold">Bending Moment Diagram (BMD): sagging positive, plotted upwards</text><line x1="130" y1="640" x2="770" y2="640" stroke="#57606a" stroke-width="1"/><polygon points="150,640 150,640 450,560 750,640 750,640" fill="#fde2e0" stroke="non