<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="460" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Torsion of Circular Shafts: Shear Stress Distribution</text><text x="230" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Solid shaft</text><circle cx="230" cy="210" r="100" fill="#f7f8fa" stroke="#1f2328" stroke-width="2.5"/><circle cx="230" cy="210" r="4" fill="#1f2328"/><line x1="230" y1="210" x2="330" y2="210" stroke="#57606a" stroke-width="1.5" marker-end="url(#ae-grey)"/><text x="280" y="200" font-size="13" fill="#57606a" text-anchor="start">R</text><polygon points="230,210 330,210 330,130" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5" stroke-linejoin="round"/><text x="335" y="125" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">&#964;<tspan baseline-shift="sub" font-size="72%">max</tspan></text><path d="M290.00,106.08 A120,120 0 1 0 333.92,270.00" fill="none" stroke="#3b82d4" stroke-width="2" marker-end="url(#ae-blue)" stroke-linejoin="round"/><text x="230" y="345" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">&#964; = T r / J</text><text x="230" y="368" font-size="12" fill="#1f2328" text-anchor="middle">J = &#960; d<tspan baseline-shift="super" font-size="72%">4</tspan> / 32 (solid)</text><line x1="450" y1="60" x2="450" y2="430" stroke="#e5e7eb" stroke-width="1"/><text x="670" y="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Hollow shaft</text><circle cx="670" cy="210" r="100" fill="#f7f8fa" stroke="#1f2328" stroke-width="2.5"/><circle cx="670" cy="210" r="55" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><polygon points="725,210 770,210 770,130 725,160" fill="#fde2e0" stroke="#c0392b" stroke-width="1.5" stroke-linejoin="round"/><text x="775" y="125" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">&#964;<tspan baseline-shift="sub" font-size="72%">max</tspan></text><text x="670" y="345" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">J = &#960; (D<tspan baseline-shift="super" font-size="72%">4</tspan> - d<tspan baseline-shift="super" font-size="72%">4</tspan>) / 32</text><text x="670" y="368" font-size="12" fill="#57606a" text-anchor="middle">Core is lightly stressed: hollow shaft is efficient</text><rect x="40" y="395" width="820" height="32.6" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="415" font-size="12" fill="#1f2328" text-anchor="start">Torsion equation: T / J = &#964; / r = G &#952; / L ;  power P = 2 &#960; N T / 60 ;  strength Z<tspan baseline-shift="sub" font-size="72%">p</tspan> = J / R</text></svg>