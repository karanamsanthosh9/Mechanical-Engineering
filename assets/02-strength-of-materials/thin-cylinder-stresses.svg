="70" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Thin sphere</text><circle cx="700" cy="200" r="90" fill="#f7f8fa" stroke="#1f2328" stroke-width="2.5"/><text x="700" y="205" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">p</text><text x="700" y="330" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">&#963; = p d / 4t  (all directions)</text><rect x="40" y="365" width="820" height="51.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="385" font-size="12" fill="#1f2328" text-anchor="start">Volumetric strain of a cylinder: &#949;<tspan baseline-shift="sub" font-size="72%">v</tspan> = p d / (4 t E) x (5 - 4&#957;) ;  efficiency of joint &#951; reduces the effective area</text><text x="52" y="403.6" font-size="12" fill="#1f2328" text-anchor="start">Hoop stress is the larger, so longitudinal joints (and their rivets) must be stronger than circumferential joints</text></svg>