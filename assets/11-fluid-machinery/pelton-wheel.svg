<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Pelton Wheel (Impulse Turbine)</text><circle cx="250" cy="230" r="110" fill="#f7f8fa" stroke="#1f2328" stroke-width="3"/><circle cx="360" cy="230" r="13" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="345.2627944162883" cy="285" r="13" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="305" cy="325.2627944162882" r="13" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="250" cy="340" r="13" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="195.00000000000003" cy="325.2627944162883" r="13" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="154.73720558371173" cy="285" r="13" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="140" cy="230" r="13" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="154.73720558371176" cy="175" r="13" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="194.99999999999994" cy="134.73720558371178" r="13" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="249.99999999999997" cy="120" r="13" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="305" cy="134.73720558371176" r="13" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="345.2627944162882" cy="174.99999999999994" r="13" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><circle cx="250" cy="230" r="12" fill="#1f2328" stroke="none" stroke-width="1.5"/><polygon points="10,320 90,320 150,340 90,360 10,360" fill="#fdecc8" stroke="#d98a1f" stroke-width="2" stroke-linejoin="round"/><polygon points="90,328 200,340 90,352" fill="#f7f8fa" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/><line x1="150" y1="340" x2="237" y2="340" stroke="#3b82d4" stroke-width="4" marker-end="url(#ae-blue)"/><text x="60" y="312" font-size="11" fill="#d98a1f" text-anchor="start" font-weight="bold">Nozzle + spear (flow control)</text><text x="180" y="322" font-size="12" fill="#3b82d4" text-anchor="start" font-weight="bold">Jet</text><text x="250" y="375" font-size="12" fill="#1f2328" text-anchor="middle">Wheel (pitch circle diameter D)</text><rect x="520" y="90" width="330" height="100" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="685" y="129.2" font-size="12" fill="#1f2328" text-anchor="middle"><tspan x="685" dy="0">Jet velocity  V<tspan baseline-shift="sub" font-size="72%">1</tspan> = C<tspan baseline-shift="sub" font-size="72%">v</tspan> &#8730;(2 g H)</tspan><tspan x="685" dy="15">Bucket speed  U = &#960; D N / 60</tspan><tspan x="685" dy="15">Best U = 0.43-0.48 of V<tspan baseline-shift="sub" font-size="72%">1</tspan></tspan></text><rect x="520" y="205" width="330" height="99.25" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="532" y="225" font-size="11" fill="#1f2328" text-anchor="start">Work done per kg = U (V<tspan baseline-shift="sub" font-size="72%">w1</tspan> + V<tspan baseline-shift="sub" font-size="72%">w2</tspan>)</text><text x="532" y="242.05" font-size="11" fill="#1f2328" text-anchor="start">Max hydraulic efficiency at U = V<tspan baseline-shift="sub" font-size="72%">1</tspan>/2:</text><text x="532" y="259.1" font-size="11" fill="#1f2328" text-anchor="start">&#951;<tspan baseline-shift="sub" font-size="72%">h</tspan> = (1 + k cos&#966;) / 2   (k = V<tspan baseline-shift="sub" font-size="72%">r2</tspan>/V<tspan baseline-shift="sub" font-size="72%">r1</tspan>)</text><text x="532" y="276.15" font-size="11" fill="#1f2328" text-anchor="start">Bucket angle 165 deg (&#966; = 15 deg)</text><text x="532" y="293.2" font-size="11" fill="#1f2328" text-anchor="start">No draft tube: wheel runs in air</text><rect x="40" y="405" width="820" height="48.1" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="425" font-size="11" fill="#1f2328" text-anchor="start">Pelton: high head (above about 250 m), low discharge, partial admission. Specific speed 8-30 (single jet). Several jets raise specific speed</text><text x="52" y="442.05" font-size="11" fill="#1f2328" text-anchor="start">Governing: spear valve (flow) and deflector (jet bypass to avoid water hammer); casing prevents splashing</text></svg>