<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Francis and Kaplan Turbines</text><text x="230" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Francis (mixed flow)</text><path d="M 60 150 Q 60 90 150 90 L 330 90 Q 410 90 410 160" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><circle cx="230" cy="190" r="70" fill="#f7f8fa" stroke="#1f2328" stroke-width="2"/><circle cx="230" cy="190" r="38" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><line x1="270" y1="190" x2="290.7900256041904" y2="215.70161059237094" stroke="#3b82d4" stroke-width="2"/><line x1="264.6410161513775" y1="210" x2="269.7949011737499" y2="242.65326049326364" stroke="#3b82d4" stroke-width="2"/><line x1="250" y1="224.64101615137753" x2="238.13676511092677" y2="255.49651176612082" stroke="#3b82d4" stroke-width="2"/><line x1="230" y1="230" x2="204.2983894076291" y2="250.79002560419042" stroke="#3b82d4" stroke-width="2"/><line x1="210" y1="224.64101615137756" x2="177.34673950673636" y2="229.7949011737499" stroke="#3b82d4" stroke-width="2"/><line x1="195.35898384862244" y1="210" x2="164.50348823387918" y2="198.13676511092677" stroke="#3b82d4" stroke-width="2"/><line x1="190" y1="190" x2="169.20997439580958" y2="164.2983894076291" stroke="#3b82d4" stroke-width="2"/><line x1="195.35898384862247" y1="170" x2="190.20509882625012" y2="137.34673950673633" stroke="#3b82d4" stroke-width="2"/><line x1="209.99999999999997" y1="155.35898384862247" x2="221.86323488907323" y2="124.50348823387917" stroke="#3b82d4" stroke-width="2"/><line x1="230" y1="150" x2="255.70161059237094" y2="129.20997439580958" stroke="#3b82d4" stroke-width="2"/><line x1="250" y1="155.35898384862247" x2="282.65326049326364" y2="150.20509882625012" stroke="#3b82d4" stroke-width="2"/><line x1="264.6410161513775" y1="169.99999999999997" x2="295.4965117661208" y2="181.86323488907323" stroke="#3b82d4" stroke-width="2"/><text x="230" y="195" font-size="11" fill="#3b82d4" text-anchor="middle" font-weight="bold">Runner</text><line x1="40" y1="150" x2="80" y2="150" stroke="#3b82d4" stroke-width="3" marker-end="url(#ae-blue)"/><text x="14" y="140" font-size="10" fill="#57606a" text-anchor="start">Water from penstock</text><polyline points="200,260 195,320 150,360" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><polyline points="260,260 265,320 310,360" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><text x="230" y="345" font-size="12" fill="#7c5cd8" text-anchor="middle" font-weight="bold">Draft tube</text><text x="230" y="395" font-size="11" fill="#57606a" text-anchor="middle">Guide vanes control the flow; spiral casing</text><text x="670" y="58" font-size="13" fill="#3b82d4" text-anchor="middle" font-weight="bold">Kaplan (axial flow)</text><rect x="580" y="120" width="180" height="40" fill="none" stroke="#1f2328" stroke-width="2"/><rect x="670" y="120" width="15" height="50" fill="#f7f8fa" stroke="#1f2328" stroke-width="1.5"/><polygon points="640,165 665,190 665,240 640,215" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="690,165 715,190 715,240 690,215" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5" stroke-linejoin="round"/><line x1="680" y1="90" x2="680" y2="150" stroke="#3b82d4" stroke-width="3" marker-end="url(#ae-blue)"/><line x1="680" y1="270" x2="680" y2="320" stroke="#3b82d4" stroke-width="3" marker-end="url(#ae-blue)"/><text x="700" y="310" font-size="11" fill="#7c5cd8" text-anchor="start">to draft tube</text><text x="680" y="255" font-size="11" fill="#3b82d4" text-anchor="middle" font-weight="bold">Adjustable runner blades</text><text x="790" y="120" font-size="11" fill="#57606a" text-anchor="start">Hub</text><rect x="520" y="300" width="340" height="99.25" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="532" y="320" font-size="11" fill="#1f2328" text-anchor="start">Francis: medium head (40-400 m), N<tspan baseline-shift="sub" font-size="72%">s</tspan> 60-300</text><text x="532" y="337.05" font-size="11" fill="#1f2328" text-anchor="start">Kaplan: low head (&lt; 60 m), large Q, N<tspan baseline-shift="sub" font-size="72%">s</tspan> 300-1000;</text><text x="532" y="354.1" font-size="11" fill="#1f2328" text-anchor="start">double regulation (guide vanes + blades)</text><text x="532" y="371.15" font-size="11" fill="#1f2328" text-anchor="start">Draft tube regains kinetic head and allows</text><text x="532" y="388.2" font-size="11" fill="#1f2328" text-anchor="start">setting the runner above tailrace level</text><rect x="40" y="415" width="460" height="46.550000000000004" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="435" font-size="10.5" fill="#1f2328" text-anchor="start">Specific speed N<tspan baseline-shift="sub" font-size="72%">s</tspan> = N &#8730;(P) / H<tspan baseline-shift="super" font-size="72%">5/4</tspan>;  unit speed N<tspan baseline-shift="sub" font-size="72%">u</tspan> = N / &#8730;(H)</text><text x="52" y="451.275" font-size="10.5" fill="#1f2328" text-anchor="start">Unit power P<tspan baseline-shift="sub" font-size="72%">u</tspan> = P / H<tspan baseline-shift="super" font-size="72%">3/2</tspan>;  unit discharge Q<tspan baseline-shift="sub" font-size="72%">u</tspan> = Q / &#8730;(H)</text></svg>