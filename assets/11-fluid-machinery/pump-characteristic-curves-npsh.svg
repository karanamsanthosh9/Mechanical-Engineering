ight="bold">&#951;</text><rect x="500" y="90" width="350" height="100" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="675" y="129.2" font-size="12" fill="#1f2328" text-anchor="middle"><tspan x="675" dy="0">NPSH available = (p<tspan baseline-shift="sub" font-size="72%">atm</tspan> - p<tspan baseline-shift="sub" font-size="72%">vap</tspan>)/&#961; g - H<tspan baseline-shift="sub" font-size="72%">s</tspan> - h<tspan baseline-shift="sub" font-size="72%">fs</tspan></tspan><tspan x="675" dy="15">NPSH required (from manufacturer)</tspan><tspan x="675" dy="15">No cavitation if NPSH<tspan baseline-shift="sub" font-size="72%">a</tspan> &gt; NPSH<tspan baseline-shift="sub" font-size="72%">r</tspan></tspan></text><rect x="500" y="205" width="350" height="99.25" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="512" y="225" font-size="11" fill="#1f2328" text-anchor="start">Affinity laws (same pump, different N):</text><text x="512" y="242.05" font-size="11" fill="#1f2328" text-anchor="start">Q proportional to N;  H to N<tspan baseline-shift="super" font-size="72%">2</tspan>;  P to N<tspan baseline-shift="super" font-size="72%">3</tspan></text><text x="512" y="259.1" font-size="11" fill="#1f2328" text-anchor="start">Specific speed N<tspan baseline-shift="sub" font-size="72%">s</tspan> = N &#8730;(Q) / H<tspan baseline-shift="super" font-size="72%">3/4</tspan></text><text x="512" y="276.15" font-size="11" fill="#1f2328" text-anchor="start">(low: radial flow; high: axial flow)</text><text x="512" y="293.2" font-size="11" fill="#1f2328" text-anchor="start">Series: heads add; parallel: discharges add</text><rect x="40" y="360" width="820" height="65.15" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="380" font-size="11" fill="#1f2328" text-anchor="start">Cavitation signs: noise, vibration, drop in head and efficiency, pitting of impeller</text><text x="52" y="397.05" font-size="11" fill="#1f2328" text-anchor="start">Prevent by lower suction lift, larger suction pipe, lower speed</text><text x="52" y="414.1" font-size="11" fill="#1f2328" text-anchor="start">Euler head for a pump: H = (U<tspan baseline-shift="sub" font-size="72%">2</tspan>V<tspan baseline-shift="sub" font-size="72%">w2</tspan> - U<tspan baseline-shift="sub" font-size="72%">1</tspan>V<tspan baseline-shift="sub" font-size="72%">w1</tspan>)/g; backward-curved vanes are standard (stable curve, higher efficiency)</text></svg>