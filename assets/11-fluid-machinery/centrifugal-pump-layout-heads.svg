t="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Centrifugal Pump: Layout and Heads</text><rect x="40" y="330" width="140" height="50" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="110" y="360" font-size="12" fill="#3b82d4" text-anchor="middle" font-weight="bold">Sump</text><line x1="80" y1="340" x2="80" y2="220" stroke="#1f2328" stroke-width="5"/><polyline points="80,220 80,200 260,200" fill="none" stroke="#1f2328" stroke-width="5" stroke-linejoin="round"/><rect x="70" y="335" width="20" height="20" fill="#f7f8fa" stroke="#1f2328" stroke-width="1.5"/><text x="100" y="350" font-size="11" fill="#57606a" text-anchor="start">Foot valve + strainer</text><circle cx="300" cy="200" r="50" fill="#f7f8fa" stroke="#1f2328" stroke-width="3"/><circle cx="300" cy="200" r="30" fill="#dbeafe" stroke="#3b82d4" stroke-width="2"/><text x="300" y="205" font-size="11" fill="#3b82d4" text-anchor="middle" font-weight="bold">Impeller</text><polyline points="335,160 335,90 560,90" fill="none" stroke="#1f2328" stroke-width="5" stroke-linejoin="round"/><rect x="560" y="80" width="50" height="20" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="430" y="82" font-size="11" fill="#57606a" text-anchor="middle">Delivery pipe (delivery valve)</text><line x1="40" y1="332" x2="180" y2="332" stroke="#3b82d4" stroke-width="2"/><line x1="560" y1="80" x2="640" y2="80" stroke="#3b82d4" stroke-width="2"/><line x1="630" y1="90" x2="630" y2="332" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="608.125" y="202" width="43.75" height="18" fill="#ffffff" opacity="0.9"/><text x="630" y="215" font-size="13" fill="#1f2328" text-anchor="middle">H<tspan baseline-shift="sub" font-size="72%">s</tspan>+H<tspan baseline-shift="sub" font-size="72%">d</tspan></text><line x1="190" y1="200" x2="190" y2="330" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="178.85" y="256" width="22.3" height="18" fill="#ffffff" opacity="0.9"/><text x="190" y="269" font-size="13" fill="#1f2328" text-anchor="middle">H<tspan baseline-shift="sub" font-size="72%">s</tspan></text><line x1="605" y1="90" x2="605" y2="200" stroke="#1f2328" stroke-width="1.2" marker-end="url(#ae-ink)" marker-start="url(#as-ink)"/><rect x="593.85" y="136" width="22.3" height="18" fill="#ffffff" opacity="0.9"/><text x="605" y="149" font-size="13" fill="#1f2328" text-anchor="middle">H<tspan baseline-shift="sub" font-size="72%">d</tspan></text><rect x="660" y="120" width="190" height="150" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="755" y="171.35" font-size="11" fill="#1f2328" text-anchor="middle"><tspan x="755" dy="0">Manometric head</tspan><tspan x="755" dy="13.75">H<tspan baseline-shift="sub" font-size="72%">m</tspan> = H<tspan baseline-shift="sub" font-size="72%">s</tspan> + H<tspan baseline-shift="sub" font-size="72%">d</tspan> + h<tspan baseline-shift="sub" font-size="72%">fs</tspan> + h<tspan baseline-shift="sub" font-size="72%">fd</tspan></tspan><tspan x="755" dy="13.75">+ V<tspan baseline-shift="sub" font-size="72%">d</tspan><tspan baseline-shift="super" font-size="72%">2</tspan>/2g</tspan><tspan x="755" dy="13.75"></tspan><tspan x="755" dy="13.75">Static head = H<tspan baseline-shift="sub" font-size="72%">s</tspan> + H<tspan baseline-shift="sub" font-size="72%">d</tspan></tspan></text><rect x="40" y="405" width="820" height="48.1" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="425" font-size="11" fill="#1f2328" text-anchor="start">Power input = &#961; g Q H<tspan baseline-shift="sub" font-size="72%">m</tspan> / &#951;<tspan baseline-shift="sub" font-size="72%">o</tspan>;  overall efficiency = manometric x mechanical x volumetric (&#951;<tspan baseline-shift="sub" font-size="72%">o</tspan> = &#951;<tspan baseline-shift="sub" font-size="72%">m</tspan> &#951;<tspan baseline-shift="sub" font-size="72%">mech</tspan> &#951;<tspan baseline-shift="sub" font-size="72%">v</tspan>)</text><text x="52" y="442.05" font-size="11" fill="#1f2328" text-anchor="start">Prime the pump before starting (casing must be full); start with delivery valve closed to reduce starting torque</text></svg>