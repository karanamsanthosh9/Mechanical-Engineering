<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ae-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ae-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82d4"/></marker><marker id="ae-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker><marker id="ae-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker><marker id="ae-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e8b57"/></marker><marker id="ae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d98a1f"/></marker><marker id="ae-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c5cd8"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="bold">Pump Classification and Typical Applications</text><rect x="330" y="80" width="240" height="44" rx="5" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/><text x="450" y="107.25" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Pumps</text><line x1="450" y1="124" x2="450" y2="150" stroke="#1f2328" stroke-width="1.5"/><line x1="220" y1="150" x2="680" y2="150" stroke="#1f2328" stroke-width="1.5"/><line x1="220" y1="150" x2="220" y2="175" stroke="#1f2328" stroke-width="1.5"/><line x1="680" y1="150" x2="680" y2="175" stroke="#1f2328" stroke-width="1.5"/><rect x="100" y="175" width="240" height="44" rx="5" fill="#dcf3e4" stroke="#2e8b57" stroke-width="1.5"/><text x="220" y="201.55" font-size="13" fill="#1f2328" text-anchor="middle">Dynamic (rotodynamic)</text><rect x="560" y="175" width="240" height="44" rx="5" fill="#fdecc8" stroke="#d98a1f" stroke-width="1.5"/><text x="680" y="201.55" font-size="13" fill="#1f2328" text-anchor="middle">Positive displacement</text><line x1="220" y1="219" x2="220" y2="240" stroke="#1f2328" stroke-width="1.5"/><line x1="150" y1="240" x2="290" y2="240" stroke="#1f2328" stroke-width="1.5"/><line x1="150" y1="240" x2="150" y2="260" stroke="#1f2328" stroke-width="1.5"/><line x1="290" y1="240" x2="290" y2="260" stroke="#1f2328" stroke-width="1.5"/><rect x="80" y="260" width="140" height="44" rx="5" fill="#dcf3e4" stroke="#57606a" stroke-width="1.5"/><text x="150" y="278.975" font-size="11" fill="#1f2328" text-anchor="middle"><tspan x="150" dy="0">Centrifugal</tspan><tspan x="150" dy="13.75">(radial)</tspan></text><rect x="230" y="260" width="140" height="44" rx="5" fill="#dcf3e4" stroke="#57606a" stroke-width="1.5"/><text x="300" y="278.975" font-size="11" fill="#1f2328" text-anchor="middle"><tspan x="300" dy="0">Axial / mixed</tspan><tspan x="300" dy="13.75">flow</tspan></text><line x1="680" y1="219" x2="680" y2="240" stroke="#1f2328" stroke-width="1.5"/><line x1="610" y1="240" x2="750" y2="240" stroke="#1f2328" stroke-width="1.5"/><line x1="610" y1="240" x2="610" y2="260" stroke="#1f2328" stroke-width="1.5"/><line x1="750" y1="240" x2="750" y2="260" stroke="#1f2328" stroke-width="1.5"/><rect x="540" y="260" width="140" height="44" rx="5" fill="#fdecc8" stroke="#57606a" stroke-width="1.5"/><text x="610" y="278.975" font-size="11" fill="#1f2328" text-anchor="middle"><tspan x="610" dy="0">Reciprocating</tspan><tspan x="610" dy="13.75">(piston, plunger)</tspan></text><rect x="690" y="260" width="140" height="44" rx="5" fill="#fdecc8" stroke="#57606a" stroke-width="1.5"/><text x="760" y="278.975" font-size="11" fill="#1f2328" text-anchor="middle"><tspan x="760" dy="0">Rotary (gear,</tspan><tspan x="760" dy="13.75">vane, screw)</tspan></text><rect x="40" y="330" width="820" height="82.2" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/><text x="52" y="350" font-size="11" fill="#1f2328" text-anchor="start">Dynamic: continuous flow, smooth, high discharge at moderate head; delivers less as head rises; needs priming; handles clean liquids</text><text x="52" y="367.05" font-size="11" fill="#1f2328" text-anchor="start">Positive displacement: fixed volume per stroke, almost independent of head; self-priming; high head, low discharge</text><text x="52" y="384.1" font-size="11" fill="#1f2328" text-anchor="start">A relief valve is essential on the delivery side of a positive displacement pump</text><text x="52" y="401.15" font-size="11" fill="#1f2328" text-anchor="start">Other hydraulic devices: hydraulic ram (uses water hammer), hydraulic press, accumulator, intensifier, coupling and torque converter, jet pump</text></svg>